<title>TESOL 116 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* Layout: a study desk — slim brand band with the 400–600 readiness scale, tabbed workspace below;
   exam mode swaps into a plain test-center frame. Motif: primary-writing-paper rules (blue lines, red dashed midline). */
:root{
  --paper:#F2F5F8; --card:#FFFFFF; --ink:#17212C; --muted:#5A6774; --line:#D8E0E7; --line2:#E8EDF2;
  --brand:#24557D; --brand-ink:#183D5B; --brand-soft:#E2EBF4; --on-brand:#FFFFFF;
  --band:#183D5B; --band-ink:#F2F7FB; --band-muted:#B9CCDD;
  --red:#C2453B; --red-soft:#F8E5E2;
  --manila:#F5EBCD; --manila-ink:#5B4818;
  --good:#2D7A4D; --good-soft:#E1F1E6; --warn:#A5680F; --warn-soft:#F8EDD7; --bad:#B4392F; --bad-soft:#F7E2DF;
  --l0:#AAB5C0; --l1:#C2453B; --l2:#CF7E27; --l3:#BF9A1E; --l4:#5B9B54; --l5:#2D7A4D;
  --shadow:0 1px 2px rgba(23,33,44,.06),0 6px 18px rgba(23,33,44,.06);
  --f-display:'Literata',Georgia,'Times New Roman',serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141A; --card:#16202A; --ink:#E3E9EF; --muted:#97A4B1; --line:#2A3643; --line2:#1F2A35;
  --brand:#88B7DF; --brand-ink:#B7D4EE; --brand-soft:#1C3246; --on-brand:#0E141A;
  --band:#112434; --band-ink:#E3ECF4; --band-muted:#8FA9C0;
  --red:#EE8176; --red-soft:#3A2321;
  --manila:#373019; --manila-ink:#EAD9A4;
  --good:#6CC291; --good-soft:#17342A; --warn:#E2AD58; --warn-soft:#382B15; --bad:#F08A80; --bad-soft:#3C2220;
  --l0:#4A5866; --l1:#E0675C; --l2:#E39A4C; --l3:#D6BA48; --l4:#7DBB74; --l5:#4FAE78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E141A; --card:#16202A; --ink:#E3E9EF; --muted:#97A4B1; --line:#2A3643; --line2:#1F2A35;
  --brand:#88B7DF; --brand-ink:#B7D4EE; --brand-soft:#1C3246; --on-brand:#0E141A;
  --band:#112434; --band-ink:#E3ECF4; --band-muted:#8FA9C0;
  --red:#EE8176; --red-soft:#3A2321;
  --manila:#373019; --manila-ink:#EAD9A4;
  --good:#6CC291; --good-soft:#17342A; --warn:#E2AD58; --warn-soft:#382B15; --bad:#F08A80; --bad-soft:#3C2220;
  --l0:#4A5866; --l1:#E0675C; --l2:#E39A4C; --l3:#D6BA48; --l4:#7DBB74; --l5:#4FAE78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tiny{font-size:.76rem}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* brand band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px 12px}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo b{font-family:var(--f-display);font-size:1.38rem;font-weight:700;letter-spacing:.01em}
.logo .ipa{font-family:var(--f-mono);font-size:.78rem;color:var(--band-muted)}
.logo .sub{display:block;font-size:.76rem;color:var(--band-muted);letter-spacing:.02em}
.scale{flex:1 1 300px;max-width:420px;min-width:0}
.scale .lbl{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted)}
.scale .track{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.14);margin:5px 0 3px}
.scale .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--band-ink);opacity:.9;transition:width .6s ease}
.scale .pass{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E9C46A;left:60%}
.scale .nums{display:flex;justify-content:space-between;font-size:.74rem;color:var(--band-muted)}
.scale .nums b{color:var(--band-ink);font-family:var(--f-mono)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:13px 12px 11px;font-weight:700;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:.7rem;line-height:18px;text-align:center}

main{padding-block:24px 96px}
.view-title{font-size:1.75rem}
.ruled{height:12px;max-width:200px;margin:8px 0 18px;opacity:.6;
  background:
   linear-gradient(var(--brand),var(--brand)) top/100% 1.5px no-repeat,
   repeating-linear-gradient(90deg,var(--red) 0 7px,transparent 7px 12px) center/100% 1.5px no-repeat,
   linear-gradient(var(--brand),var(--brand)) bottom/100% 1.5px no-repeat}
.lede{color:var(--muted);max-width:68ch;margin-bottom:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:1.12rem;margin-bottom:6px}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.eyebrow.red{color:var(--red)}
.hero-card{border-left:0;background:linear-gradient(0deg,var(--card),var(--card));position:relative;overflow:hidden}
.hero-card h2{font-size:1.45rem;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;font-size:.92rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.82rem;border-radius:8px}
.btn.lg{padding:14px 22px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--line2);color:var(--ink);white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--l0)}
.lv1 .d{background:var(--l1)} .lv2 .d{background:var(--l2)} .lv3 .d{background:var(--l3)} .lv4 .d{background:var(--l4)} .lv5 .d{background:var(--l5)}
.chip.trap{background:var(--red-soft);color:var(--red)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .c{font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}

/* level ladder legend */
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder span{flex:1 1 90px;font-size:.72rem;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--line2);border-top:4px solid var(--l0)}
.ladder .lv1{border-top-color:var(--l1)} .ladder .lv2{border-top-color:var(--l2)} .ladder .lv3{border-top-color:var(--l3)} .ladder .lv4{border-top-color:var(--l4)} .ladder .lv5{border-top-color:var(--l5)}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar .name{font-weight:700;font-size:.9rem;min-width:0}
.bar .val{font-family:var(--f-mono);font-size:.86rem}
.bar .track{grid-column:1/-1;height:9px;background:var(--line2);border-radius:99px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand)}
.bar .track .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35;left:75%}

/* skill map */
.skillmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sk{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l0);border-radius:10px;padding:9px 11px;min-width:0}
.sk:hover{border-color:var(--brand)}
.sk.lv1{border-left-color:var(--l1)} .sk.lv2{border-left-color:var(--l2)} .sk.lv3{border-left-color:var(--l3)} .sk.lv4{border-left-color:var(--l4)} .sk.lv5{border-left-color:var(--l5)}
.sk .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.sk .nm{font-weight:700;font-size:.86rem;line-height:1.3}
.sk .meta{font-size:.74rem;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--line2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plus{font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;color:var(--brand)}

/* player */
.player{max-width:780px;margin:0 auto}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.phead .prog{font-family:var(--f-mono);font-size:.86rem;color:var(--muted)}
.pbar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.stim{background:var(--manila);color:var(--manila-ink);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.stim .stim-h{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:6px;white-space:normal}
.stim table{margin:6px 0;background:rgba(255,255,255,.35);border-radius:6px;white-space:normal}
.stim th{background:rgba(0,0,0,.06);color:inherit}
.stim td,.stim th{border-bottom-color:rgba(0,0,0,.08)}
.stem{font-size:1.08rem;font-weight:700;margin-bottom:14px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:9px}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;line-height:1.45}
.opt:hover{border-color:var(--brand)}
.opt .ol{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--f-mono)}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ol{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt.struck .ot{text-decoration:line-through;opacity:.45}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .ol{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .ol{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.strike{flex:0 0 38px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--muted);font-size:.9rem}
.strike:hover{color:var(--red);border-color:var(--red)}
.strike.on{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.pfoot .hint{margin-right:auto;font-size:.78rem;color:var(--muted);align-self:center}
.fb{margin-top:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.fb .fbh{padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok .fbh{background:var(--good-soft);color:var(--good)}
.fb.no .fbh{background:var(--bad-soft);color:var(--bad)}
.fb .fbb{padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:.94rem}
.fb .yours{border-left:3px dashed var(--red);padding-left:12px}
.keyline{background:var(--manila);color:var(--manila-ink);border-radius:8px;padding:9px 12px;font-size:.9rem}
.keyline b{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
details.others summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--brand)}
details.others ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ai{border:1px dashed var(--brand);border-radius:10px;padding:12px 14px;background:var(--brand-soft);font-size:.92rem;white-space:pre-wrap}

/* lesson */
.lesson{max-width:72ch}
.lesson h2{font-size:1.6rem;margin-bottom:4px}
.lesson h3{font-size:1.15rem;margin:26px 0 8px}
.lesson p{margin:0 0 12px}
.lesson ul{margin:0 0 12px;padding-left:20px}
.lesson li{margin-bottom:5px}
.why{font-size:1rem;color:var(--muted);margin:6px 0 4px}
.traps{background:var(--red-soft);border-radius:12px;padding:14px 16px;margin:22px 0}
.traps h4{font-family:var(--f-body);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.traps ul{margin:0;padding-left:18px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:10px 0 20px}
.term{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:.88rem}
.term b{display:block;margin-bottom:2px}
.tip{border-left:4px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:16px 0}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary h3{font-size:1.05rem}
.acc[open]>summary{border-bottom:1px solid var(--line2)}
.acc .inner{padding:8px 10px 12px}
.lrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 8px;border-radius:8px}
.lrow:hover{background:var(--line2)}
.lrow .t{font-weight:700;font-size:.92rem;min-width:0}
.check{color:var(--good);font-weight:700}

/* flashcards */
.flash{max-width:560px;margin:0 auto}
.fcard{min-height:240px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;cursor:pointer;
  background-image:linear-gradient(transparent 0 calc(100% - 46px),var(--line2) calc(100% - 46px) calc(100% - 45px),transparent calc(100% - 45px))}
.fcard .t{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.fcard .d{font-size:1rem;max-width:44ch}

/* writing */
.cr-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cr-layout{grid-template-columns:1fr}}
.exh-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.exh{background:var(--manila);color:var(--manila-ink);border-radius:10px;padding:14px 16px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:62vh;overflow:auto}
.exh table{white-space:normal;background:rgba(255,255,255,.35)}
.exh th{background:rgba(0,0,0,.06);color:inherit}
textarea.resp{width:100%;min-height:360px;border:1.5px solid var(--line);border-radius:10px;padding:14px;background:var(--card);line-height:1.6;resize:vertical}
textarea.notes{width:100%;min-height:90px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:.9rem}
textarea:focus{outline:none;border-color:var(--brand)}
.wc{display:flex;gap:10px;align-items:center;font-size:.84rem}
.wc .meter{flex:1;height:7px;background:var(--line2);border-radius:99px;position:relative;overflow:hidden}
.wc .meter i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.wc .meter .z{position:absolute;top:0;bottom:0;left:57%;width:29%;background:var(--good-soft);opacity:.9}
.tasklist{margin:8px 0 0;padding-left:20px}
.tasklist li{margin-bottom:6px}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rubric label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.86rem}
.rubric select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.checks input{margin-top:4px;width:18px;height:18px;flex:0 0 18px}
.prose{white-space:pre-wrap;font-size:.93rem;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 13px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}

/* exam (test-center frame) */
#exam{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column}
.xbar{background:var(--band);color:var(--band-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.xbar .ttl{font-weight:700;font-size:.9rem;min-width:0}
.xbar .clock{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.xbar .clock.low{background:#B4392F;color:#fff}
.xbody{flex:1;overflow:auto;padding:22px 16px 30px}
.xinner{max-width:820px;margin:0 auto}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* misc */
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.callout{border-radius:12px;padding:14px 16px;background:var(--brand-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.red{background:var(--red-soft)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.insight:last-child{border-bottom:0}
.insight .ix{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.insight .ix.r{background:var(--red-soft);color:var(--red)}
.trapcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
.trapcard:last-child{border-bottom:0}
.trapcard .rate{font-family:var(--f-mono);font-weight:600;text-align:right}
.trapcard .fix{grid-column:1/-1;font-size:.88rem;background:var(--line2);border-radius:8px;padding:8px 10px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad div{border-radius:10px;padding:12px;background:var(--line2)}
.quad .n{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.quad .bad{background:var(--bad-soft)}
.quad .good{background:var(--good-soft)}
.quad .warn{background:var(--warn-soft)}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.qitem .qs{font-weight:700;font-size:.92rem}
.qitem .qm{font-size:.84rem;color:var(--muted);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:st}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);flex-wrap:wrap}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);background:var(--brand-soft);color:var(--brand)}
.step.done .num{background:var(--good);color:#fff}
.step .body{flex:1 1 220px;min-width:0}
.step .body b{display:block}
.milestones{display:flex;gap:0;flex-wrap:wrap}
.ms{flex:1 1 120px;padding:10px 10px 10px 0;position:relative;font-size:.8rem}
.ms::before{content:"";display:block;height:4px;border-radius:99px;background:var(--line);margin-bottom:8px}
.ms.done::before{background:var(--good)}
.ms.now::before{background:var(--brand)}
.ms b{display:block;font-size:.84rem}
.spark{width:100%;height:60px}
.spark .ln{fill:none;stroke:var(--brand);stroke-width:2}
.spark .ar{fill:var(--brand-soft)}
.spark .pass{stroke:var(--red);stroke-dasharray:4 4;stroke-width:1}
.spark .pt{fill:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:14px 16px}
input[type=date],input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
@media (max-width:560px){
  html{font-size:16px}
  .view-title{font-size:1.45rem}
  .card{padding:16px}
  .pfoot .hint{display:none}
  .pfoot .btn{flex:1 1 auto}
}

<script>
(function(){
'use strict';
/* ============================== data ============================== */
const BANK = JSON.parse(document.getElementById('bank').textContent);
const Q = BANK.questions || [];
const QM = {}; Q.forEach(q => QM[q.id] = q);
const LESSONS = {}; (BANK.lessons || []).forEach(l => LESSONS[l.skill] = l);
const SCEN = BANK.scenarios || [];
const SCM = {}; SCEN.forEach(s => SCM[s.id] = s);
const GUIDE = BANK.guide || null;

const COMPS = [
 {id:1, code:'0001', name:'Language and Language Learning', short:'Language & Learning', weight:13, skills:{

  '2.5':'SIFE, newcomers & trauma-informed practice','2.6':'ELLs with disabilities','2.7':'Long-term, gifted & other profiles'}},
 {id:3, code:'0003', name:'ESOL Instructional Planning, Practices, and Assessment', short:'Planning & Assessment', weight:13, skills:{
  '3.1':'NYS program models (Part 154)','3.2':'Approaches & methods','3.3':'Objectives, language demands & scaffolds','3.4':'Input, interaction & feedback',
  '3.5':'NYSITELL & NYSESLAT','3.6':'Classroom assessment principles','3.7':'Accommodations & data use'}},
 {id:4, code:'0004', name:'Instructing English Language Learners in English Language Arts', short:'ELA Instruction', weight:14, skills:{
  '4.1':'Next Gen ELA & the NLAP','4.2':'Oral language development','4.3':'Foundational literacy & transfer','4.4':'Vocabulary development',
  '4.5':'Reading complex texts','4.6':'Writing development','4.7':'Literature, culture & home language'}},
 {id:5, code:'0005', name:'Instructing English Language Learners in the Content Areas', short:'Content-Area Instruction', weight:14, skills:{
  '5.1':'Sheltered instruction (SIOP, CALLA)','5.2':'Co-teaching & collaboration','5.3':'Mathematics','5.4':'Science',
  '5.5':'Social studies','5.6':'Academic language across disciplines','5.7':'Assessing content learning'}},
 {id:6, code:'0006', name:'ESOL Professional Environments', short:'Professional Environments', weight:13, skills:{
  '6.1':'Federal law & court cases','6.2':'NYS policy & frameworks','6.3':'Family engagement','6.4':'Collaboration & partnerships',
  '6.5':'Advocacy & equity','6.6':'Reflection & professional growth'}},
 {id:7, code:'0007', name:'Analysis, Synthesis, and Application', short:'Constructed Response', weight:20, skills:{
  '7.1':'Spot the significant strength','7.2':'Spot the significant need','7.3':'Choose a strategy that links them','7.4':'Explain with evidence & theory'}}
];
const SKILL = {}; COMPS.forEach(c => Object.entries(c.skills).forEach(([k,v]) => SKILL[k] = {code:k, name:v, comp:c.id}));
const SKILLS = Object.keys(SKILL);
const compOf = sk => COMPS[(+String(sk).split('.')[0]) - 1];

const TRAPS = {
 TERM:{label:'Near-miss terms', plain:'You picked a definition that belongs to a neighboring concept.', fix:'Name the concept in your own words first, then check each option against its defining feature, not just its topic.'},
 PARTIAL:{label:'Good, but not best', plain:'You chose something true or reasonable that is narrower or less complete than the keyed answer.', fix:'The exam asks for the BEST or MOST effective option. Compare your top two: which one meets the student\'s specific need and the stem\'s exact goal?'},
 DEFICIT:{label:'Deficit lens', plain:'You chose an option that treats the home language or culture as a problem to remove.', fix:'Credited answers treat home language and culture as resources. Be suspicious of options that ban, replace, or "fix" the L1.'},
 LOWER_RIGOR:{label:'Watering it down', plain:'You chose to simplify the content or lower expectations instead of scaffolding.', fix:'Keep the grade-level text or task and add supports (visuals, frames, L1, chunking). Swapping in easier work is rarely best.'},
 ISOLATED:{label:'Drills out of context', plain:'You chose rote or decontextualized practice (lists, worksheets, drills).', fix:'Prefer language practice embedded in meaningful content and real communication.'},
 PASSIVE:{label:'Students just listening', plain:'You chose a teacher-centered option with no student interaction or output.', fix:'Look for structured talk and output: partners, discussion, writing with talk.'},
 MISREFERRAL:{label:'Difference vs. disability', plain:'You confused normal second-language development with a disability (or delayed a warranted evaluation).', fix:'Ask: does the difficulty also show up in the home language and across settings? Rule out language and instruction first, but don\'t stall a warranted evaluation.'},
 ONE_SIZE:{label:'Same support for all', plain:'You chose an option that ignores the student\'s level or profile.', fix:'Match the support to the proficiency level and the details given about this student.'},
 WRONG_LEVEL:{label:'Level mismatch', plain:'The option expects too much or too little for the student\'s stage.', fix:'Place the student on Entering → Commanding first, then choose what that level can do with support.'},
 OVERCORRECT:{label:'Correcting too much', plain:'You chose heavy or interrupting error correction when meaning was the goal.', fix:'When fluency or meaning is the goal, use recasts or targeted feedback on one or two patterns.'},
 EXCLUSION:{label:'Waiting until proficient', plain:'You chose to remove the ELL from grade-level work, enrichment, or opportunity.', fix:'ELLs get grade-level content and opportunities now, with support. Removing them or waiting is the trap.'},
 ASSESS_INVALID:{label:'Testing the wrong thing', plain:'The assessment you chose measures language when it should measure content (or the reverse), or it is biased.', fix:'Ask what the assessment is meant to measure. Remove language barriers when you are measuring content.'},
 LAW_FACT:{label:'Law & case mix-up', plain:'You attached the wrong holding or detail to a law or court case.', fix:'Anchor each case to one phrase: Lau = same ≠ equal; Castañeda = 3-prong test; Plyler = school for undocumented children; EEOA = "appropriate action."'},
 NYS_POLICY:{label:'NYS rule slip', plain:'You picked the wrong NYS procedure, timeline, test, or requirement.', fix:'Rehearse the sequence: HLQ → interview → NYSITELL (10 school days) → parent notice (5) → program. Exit = Commanding, or Expanding + ELA Level 3 / Regents 65.'},
 STEREOTYPE:{label:'Group generalization', plain:'You chose an option that assumes what a student or family is like based on their culture.', fix:'Gather information about the individual; avoid answers built on cultural assumptions.'},
 FAMILY_BARRIER:{label:'Family communication gap', plain:'You chose a family-communication approach that shuts some families out.', fix:'Use the family\'s preferred language, qualified interpreters (never children), and flexible two-way contact.'},
 MISAPPLIED_THEORY:{label:'Theory mismatch', plain:'You matched the right idea to the wrong theorist, or misread what a theory implies for teaching.', fix:'Tie each theorist to one claim and one classroom move: Krashen = input, Swain = output, Long = interaction, Vygotsky = ZPD, Cummins = BICS/CALP/CUP.'},
 LITERAL:{label:'Surface detail', plain:'You reacted to a vivid detail instead of the key evidence or the question actually asked.', fix:'Reread the last sentence of the stem and underline the decisive evidence before you look at the options.'}
};
const LEVELS = [
 {n:0, name:'Not yet assessed'},{n:1, name:'Entering'},{n:2, name:'Emerging'},{n:3, name:'Transitioning'},{n:4, name:'Expanding'},{n:5, name:'Commanding'}
];

/* ============================== utils ============================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET = 'ABCD';
const now = () => Date.now();
function dayStr(t){ const d = t ? new Date(t) : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Math.round(new Date(y, m-1, d).getTime()/864e5); }
const todayNum = () => dayNum(dayStr());
function hash(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return (h >>> 0); }
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r=Math.random){ for (let i=arr.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; }
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const plural = (n, w, p) => n + ' ' + (n === 1 ? w : (p || w + 's'));
function fmtClock(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); }
function words(t){ return (String(t||'').trim().match(/\S+/g) || []).length; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400); }
function md(s){
  const blocks = String(s||'').split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) return '';
    const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inl(l.replace(/^\s*[-•]\s+/, '')) + '</li>').join('') + '</ul>';
    if (lines.some(l => /^\s*[-•]\s+/.test(l))) {
      let out = '', list = [];
      const flush = () => { if (list.length){ out += '<ul>' + list.map(x => '<li>'+inl(x)+'</li>').join('') + '</ul>'; list = []; } };
      lines.forEach(l => { if (/^\s*[-•]\s+/.test(l)) list.push(l.replace(/^\s*[-•]\s+/, '')); else { flush(); out += '<p>'+inl(l)+'</p>'; } });
      flush(); return out;
    }
    return '<p>' + lines.map(inl).join('<br>') + '</p>';
  }).join('');
}
/* stimulus / exhibit text: pipe tables become real tables */
function richText(s){
  const lines = String(s||'').split('\n');
  let out = '', buf = [], tbl = [];
  const flushText = () => { if (buf.length){ out += esc(buf.join('\n')); buf = []; } };
  const flushTbl = () => {
    if (tbl.length){
      const rows = tbl.map(l => l.split('|').map(c => c.trim())).filter(r => !r.every(c => /^:?-{2,}:?$/.test(c) || c === ''));
      const clean = rows.map(r => { if (r[0] === '') r.shift(); if (r[r.length-1] === '') r.pop(); return r; });
      out += '<div class="tbl-wrap"><table><thead><tr>' + clean[0].map(c => '<th>'+esc(c)+'</th>').join('') + '</tr></thead><tbody>' +
        clean.slice(1).map(r => '<tr>' + r.map(c => '<td>'+esc(c)+'</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      tbl = [];
    }
  };
  lines.forEach((l, i) => {
    const isRow = (l.match(/\|/g) || []).length >= 1 && l.includes(' | ');
    const nextRow = lines[i+1] != null && lines[i+1].includes(' | ');
    const prevRow = lines[i-1] != null && lines[i-1].includes(' | ');
    if (isRow && (nextRow || prevRow)){ flushText(); tbl.push(l); }
    else { flushTbl(); buf.push(l); }
  });
  flushText(); flushTbl();
  return out.replace(/\n(?=<div class="tbl-wrap">)/g, '').replace(/(<\/div>)\n/g, '$1');
}

/* ============================== storage ============================== */
const KEY = 'tesol116.studio.v1';
let memStore = null;
function blank(){ return {v:1, updated:0, examDate:'', name:'', att:[], diag:null, check:null, exams:[], exam:null, srs:{}, cards:{}, read:{}, cr:[], crDraft:{}, prefs:{fb:'each'}}; }
function normalize(s){ const b = blank(); s = Object.assign(b, s || {}); ['att','exams','cr'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; }); ['srs','cards','read','crDraft','prefs'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; }); return s; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e) {}
  return normalize(memStore || blank());
}
let S = loadState();
let storageOK = true;
function save(quiet){
  S.updated = now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ memStore = S; storageOK = false; }
  if (!quiet) Sync.schedule();
}

/* ============================== account sync (db capability) ============================== */
const Sync = {
  db:null, base:'', on:false, timer:null, chain:Promise.resolve(), pushedAtt:0, err:'',
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.base = 'data/users/' + uid;
      const snap = await db.doc(this.base + '/main').get();
      if (snap.exists){
        const r = snap.data() || {};
        if ((r.updated || 0) > (S.updated || 0) + 1000){
          const att = [];
          for (let i = 0; i < (r.chunks || 0); i++){
            const cs = await db.doc(this.base + '/att' + i).get();
            if (cs.exists){ try { JSON.parse(cs.data().a || '[]').forEach(x => att.push(unpackAtt(x))); } catch(e){} }
          }
          const st = normalize(JSON.parse(r.json || '{}'));
          st.att = att; st.updated = r.updated;
          S = st; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ memStore = S; }
          this.pushedAtt = att.length; this.on = true; render(); toast('Loaded your saved progress');
          return;
        }
        this.pushedAtt = Math.min(r.attCount || 0, S.att.length);
        this.on = true;
        if ((S.updated || 0) > (r.updated || 0)) this.schedule(1500);
      } else {
        this.on = true; this.pushedAtt = 0;
        if (S.updated) this.schedule(1500);
      }
      renderSettingsBadge();
    } catch(e){ this.on = false; this.err = (e && e.code) || 'unavailable'; }
  },
  schedule(ms){ if (!this.on) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms || 8000); },
  push(){ clearTimeout(this.timer); this.chain = this.chain.then(() => this._push()).catch(e => { this.err = (e && e.code) || 'error'; if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) this.on = false; }); return this.chain; },
  async _push(){
    if (!this.db || !this.on) return;
    const CH = 1500, n = S.att.length, chunks = Math.ceil(n / CH);
    for (let i = Math.floor(this.pushedAtt / CH); i < chunks; i++){
      await this.db.doc(this.base + '/att' + i).set({a: JSON.stringify(S.att.slice(i*CH, (i+1)*CH).map(packAtt))});
    }
    const rest = Object.assign({}, S); delete rest.att;
    const json = JSON.stringify(rest);
    if (json.length > 240000) { this.err = 'too_large'; return; }
    await this.db.doc(this.base + '/main').set({updated: S.updated, chunks, attCount: n, json});
    this.pushedAtt = n; this.err = '';
  }
};
const packAtt = a => [a.q, a.c, a.ok ? 1 : 0, a.cf, a.s, a.t, a.m];
const unpackAtt = x => ({q:x[0], c:x[1], ok:!!x[2], cf:x[3], s:x[4], t:x[5], m:x[6]});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Sync.on) Sync.push(); });

/* ============================== capabilities: Claude ============================== */
const CAP = {sample:null};
(async function(){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      const s = await window.claude.use('sample');
      if (s){ CAP.sample = s; if (['play','write','exam'].includes(route.tab)) render(); }
    }
  } catch(e){}
})();

/* ============================== stats ============================== */
let _statsCache = null, _statsLen = -1;
function stats(){
  if (_statsCache && _statsLen === S.att.length + S.cr.length * 1000 + S.exams.length * 7) return _statsCache;
  const by = {};
  S.att.forEach(a => { const q = QM[a.q]; if (!q) return; (by[q.skill] = by[q.skill] || []).push(a); });
  const sk = {};
  SKILLS.forEach(code => {
    const list = by[code] || [];
    let num = 0, den = 0, ok = 0, sureNo = 0, unsOk = 0;
    for (let k = list.length - 1, j = 0; k >= 0; k--, j++){
      const a = list[k]; const w = Math.pow(0.88, j) * (!a.ok && a.cf === 1 ? 1.25 : 1);
      num += w * (a.ok ? 1 : 0); den += w;
    }
    list.forEach(a => { if (a.ok) ok++; if (!a.ok && a.cf === 1) sureNo++; if (a.ok && a.cf === 0) unsOk++; });
    const m = list.length ? (num + 0.75) / (den + 1.5) : null;
    let lv = 0;
    if (m != null){ lv = m < .45 ? 1 : m < .6 ? 2 : m < .72 ? 3 : m < .85 ? 4 : 5; if (lv === 5 && list.length < 4) lv = 4; }
    const total = Q.filter(q => q.skill === code).length;
    const seen = new Set(list.map(a => a.q)).size;
    sk[code] = {code, n:list.length, ok, m, lv, sureNo, unsOk, total, seen, acc: list.length ? ok/list.length : null};
  });
  const comp = {};
  COMPS.forEach(c => {
    const arr = Object.keys(c.skills).map(k => sk[k]).filter(x => x.m != null);
    const n = Object.keys(c.skills).reduce((t,k) => t + sk[k].n, 0);

}
function crRecent(){
  const scores = [];

  S.exams.forEach(e => { if (e.crScore && e.crScore.o) scores.push({t:e.finished, o:e.crScore.o}); });

}
function toScaled(p){ return Math.round(p <= .7 ? 400 + (p/.7)*120 : 520 + ((p-.7)/.3)*80); }
function projection(){

  const sr = comps.reduce((t,c) => t + c.weight * st.comp[c.id].m, 0) / 80;
  const cr = crRecent();
  const crP = cr.length ? cr.reduce((t,x) => t + x.o, 0) / cr.length / 4 : 0.625;

}
function priorities(){
  const st = stats();

    const c = compOf(code), x = st.sk[code];
    const m = x.m == null ? 0.55 : x.m;
    const w = c.weight / Object.keys(c.skills).length * (c.id === 7 ? 0.45 : 1);
    const sureRate = x.n ? x.sureNo / x.n : 0;
    const readRecent = S.read[code] && (now() - S.read[code] < 7*864e5);
    const pr = (1 - m) * w * (1 + 0.8*sureRate) * (readRecent ? 0.92 : 1) * (x.n === 0 ? 0.9 : 1);
    return {code, pr, m: x.m, lv: x.lv, n: x.n};

}
function analyze(atts){

  atts.forEach(a => {
    const q = QM[a.q]; if (!q) return;
    r.n++; if (a.ok) r.ok++;
    const t = r.type[q.type] = r.type[q.type] || {n:0, ok:0}; t.n++; if (a.ok) t.ok++;
    const d = r.diff[q.difficulty] = r.diff[q.difficulty] || {n:0, ok:0}; d.n++; if (a.ok) d.ok++;
    const cc = compOf(q.skill).id; const ce = r.comp[cc] = r.comp[cc] || {n:0, ok:0}; ce.n++; if (a.ok) ce.ok++;
    const se = r.skill[q.skill] = r.skill[q.skill] || {n:0, ok:0}; se.n++; if (a.ok) se.ok++;
    if (a.s){ r.secs += a.s; r.timed++; }
    if (a.cf === 1){ if (a.ok) r.conf.so++; else { r.conf.sn++; r.sureMiss.push(a); } }
    else if (a.cf === 0){ if (a.ok) r.conf.uo++; else r.conf.un++; }

}

/* ============================== selection ============================== */
function diagItems(kind){
  const want = kind === 'check' ? 2 : 1;
  const out = [];
  SKILLS.forEach(code => {
    const pool = Q.filter(q => q.skill === code);
    if (!pool.length) return;
    let q = pool.find(x => x.diag === want) || pool.find(x => x.difficulty === 2 && !x.diag) || pool[0];
    out.push(q.id);
  });
  const r = rng(hash('diag-' + kind));
  const byComp = {};
  out.forEach(id => { const c = compOf(QM[id].skill).id; (byComp[c] = byComp[c] || []).push(id); });
  Object.values(byComp).forEach(a => shuffle(a, r));
  const order = []; let more = true, k = 0;
  while (more){ more = false; for (let c = 1; c <= 7; c++){ const a = byComp[c]; if (a && a[k]){ order.push(a[k]); more = true; } } k++; }
  return order;
}
let FORMS = null;
function forms(){
  if (FORMS) return FORMS;
  const used = new Set(Q.filter(q => q.diag).map(q => q.id));
  const crIds = SCEN.map(s => s.id);
  FORMS = {};
  ['A','B','C'].forEach((F, fi) => {
    const r = rng(hash('form-' + F));
    const items = [];
    COMPS.slice(0,6).forEach(c => {
      const skills = shuffle(Object.keys(c.skills), r);
      const base = Math.floor(15 / skills.length), extra = 15 - base * skills.length;
      let got = [];
      skills.forEach((sk, k) => {
        const need = base + (k < extra ? 1 : 0);
        const pool = shuffle(Q.filter(q => q.skill === sk && !used.has(q.id)), r);
        const pick = []; const want = [2,1,3,2,1,3,2];
        want.forEach(dv => { if (pick.length < need){ const q = pool.find(x => x.difficulty === dv && !pick.includes(x)); if (q) pick.push(q); } });
        pool.forEach(x => { if (pick.length < need && !pick.includes(x)) pick.push(x); });
        pick.forEach(q => { used.add(q.id); got.push(q.id); });
      });
      if (got.length < 15){
        const pool = shuffle(Q.filter(q => compOf(q.skill).id === c.id && !used.has(q.id)), r);
        pool.slice(0, 15 - got.length).forEach(q => { used.add(q.id); got.push(q.id); });
      }
      items.push(...got);
    });
    FORMS[F] = {qids: shuffle(items, r), cr: crIds.length ? crIds[[0,2,5][fi] % crIds.length] : null};
  });
  return FORMS;
}
function seenSet(){ return new Set(S.att.map(a => a.q)); }
function lastSeenMap(){ const m = {}; S.att.forEach(a => { m[a.q] = a.t; }); return m; }
function pickFrom(pool, n, opts={}){
  const seen = lastSeenMap();
  const scored = pool.map(q => {
    let sc = Math.random();
    if (seen[q.id] == null) sc += 3; else sc += Math.min(2.5, (now()/1000 - seen[q.id]) / 86400 / 7);
    if (opts.diffTarget) sc += q.difficulty === opts.diffTarget ? 0.8 : 0;
    if (opts.avoidDiag && q.diag) sc -= 1.5;
    return {q, sc};
  }).sort((a,b) => b.sc - a.sc);
  return scored.slice(0, n).map(x => x.q.id);
}
function dueReviews(){ const t = todayNum(); return Object.entries(S.srs).filter(([id, v]) => QM[id] && v.d <= t).map(([id]) => id); }
function pickSmart(n){
  const pri = priorities().filter(p => Q.some(q => q.skill === p.code));
  const due = shuffle(dueReviews()).slice(0, Math.round(n * 0.3));
  const out = [...due];
  const top = pri.slice(0, 6);
  const weights = top.map((p, i) => p.pr * (1 - i * 0.08));
  const st = stats();
  let guard = 0;
  while (out.length < n && guard++ < 400){
    let code;
    if (Math.random() < 0.8 && top.length){
      const tot = weights.reduce((a,b) => a+b, 0); let x = Math.random() * tot;
      code = top[top.length-1].code; for (let i = 0; i < top.length; i++){ x -= weights[i]; if (x <= 0){ code = top[i].code; break; } }
    } else code = SKILLS[Math.floor(Math.random()*SKILLS.length)];
    const m = st.sk[code].m;
    const target = m == null ? 2 : m < .5 ? 1 : m < .8 ? 2 : 3;
    const pool = Q.filter(q => q.skill === code && !out.includes(q.id));
    const pick = pickFrom(pool, 1, {diffTarget: target, avoidDiag: true})[0];
    if (pick) out.push(pick);
  }
  return shuffle(out);
}
function pickSkill(code, n){ return shuffle(pickFrom(Q.filter(q => q.skill === code), n, {avoidDiag: true})); }
function pickTrap(code, n){
  const pool = Q.filter(q => (q.traps || []).some(t => t && t.code === code));
  return shuffle(pickFrom(pool, n, {avoidDiag: true}));
}
function pickQuick(){
  const out = [];
  COMPS.slice(0,6).forEach(c => { const pool = Q.filter(q => compOf(q.skill).id === c.id); out.push(...pickFrom(pool, c.id >= 4 && c.id <= 5 ? 3 : 2, {avoidDiag: true})); });
  return shuffle(out).slice(0, 15);
}

let P = null;
function startPlayer(cfg){

  if (!P.qids.length){ toast('No questions available for that set yet'); P = null; return; }

function curQ(){ return QM[P.qids[P.i]]; }
function dispOrder(id){ return P.order[id] || [0,1,2,3]; }
VIEWS.play = function(){
  if (!P) return VIEWS.practice();
  if (P.done) return playSummary();
  const q = curQ();
  const total = P.qids.length;
  const ord = dispOrder(q.id);
  const isDiag = P.mode === 'diag' || P.mode === 'check';
  const showSkill = !isDiag && P.mode !== 'quick';
  let h = '<div class="player"><div class="phead"><div class="row"><span class="chip brand">' + esc(P.title) + '</span>' + (showSkill ? '<span class="chip">' + q.skill + ' · ' + esc(SKILL[q.skill].name) + '</span>' : '') + '</div><div class="row"><span class="prog">' + (P.i + 1) + ' / ' + total + '</span>' + (P.limit ? '<span class="prog mono" id="setclock"></span>' : '') + '<button class="btn sm ghost" data-act="quit">' + (isDiag ? 'Pause' : 'End set') + '</button></div></div>';
  h += '<div class="pbar"><i style="width:' + pct(P.i, total) + '%"></i></div>';
  if (q.stimulus) h += '<div class="stim"><div class="stim-h">Read the information below</div>' + richText(q.stimulus) + '</div>';
  h += '<div class="stem">' + esc(q.stem) + '</div><div class="opts" role="radiogroup" aria-label="Answer options">';
  const ans = P.answers[q.id];
  ord.forEach((oi, di) => {
    let cls = 'opt';
    if (P.revealed){ if (oi === q.answer) cls += ' ok'; else if (ans && ans.c === oi) cls += ' no'; }
    else if (P.sel === oi) cls += ' sel';
    if (P.struck[q.id + ':' + oi] && !P.revealed) cls += ' struck';
    h += '<div class="optrow"><button class="' + cls + '" role="radio" aria-checked="' + (P.sel === oi) + '" data-act="pick" data-o="' + oi + '"' + (P.revealed ? ' disabled' : '') + '><span class="ol">' + LET[di] + '</span><span class="ot">' + esc(q.options[oi]) + '</span></button>' + (P.revealed ? '' : '<button class="strike' + (P.struck[q.id + ':' + oi] ? ' on' : '') + '" data-act="strike" data-o="' + oi + '" aria-label="Cross out option ' + LET[di] + '" title="Cross out">✕</button>') + '</div>';
  });
  h += '</div>';
  if (P.revealed) h += feedbackBlock(q, ans.c, ord);
  else {
    const dis = P.sel == null ? ' disabled' : '';
    if (isDiag) h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> to choose. How sure are you?</span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Guessing → next</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Sure → next</button></div>';
    else if (P.mode === 'quick' || !P.feedback) h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span>, <span class="kbd">Enter</span></span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Not sure → next</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Sure → next</button></div>';
    else h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span>, <span class="kbd">Enter</span>. Telling me how sure you are sharpens the report.</span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Check · not sure</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Check · I\'m sure</button></div>';
  }
  h += '</div>';
  return h;
};
function feedbackBlock(q, c, ord){
  const ok = c === q.answer;

    case 'exam-abandon': route.confirmAbandon = true; render(); break;
    case 'exam-abandon-yes': S.exam = null; save(); go('exam'); toast('Attempt discarded'); break;
    case 'exam-result': go('exam', {result:d.id}); break;
    case 'exam-filter': go('exam', {result:d.id, filter:d.v}); break;
    case 'x-pick': { const x = S.exam, id = x.qids[x.i]; x.ans[id] = +d.o; save(true); renderExam(); break; }
    case 'x-strike': { const x = S.exam, id = x.qids[x.i]; x.struck = x.struck || {}; const k = id + ':' + d.o; x.struck[k] = !x.struck[k]; if (x.struck[k] && x.ans[id] === +d.o) delete x.ans[id]; renderExam(); break; }
    case 'x-next': { const x = S.exam; x.view = 'q'; x.i = Math.min(x.i + 1, x.qids.length - (x.cr ? 0 : 1)); save(true); renderExam(); break; }
    case 'x-prev': { const x = S.exam; if (x.view === 'review'){ x.view = 'q'; } else x.i = Math.max(0, x.i - 1); renderExam(); break; }
    case 'x-flag': { const x = S.exam, id = x.qids[x.i]; x.flags[id] = !x.flags[id]; save(true); renderExam(); break; }
    case 'x-review': S.exam.view = 'review'; S.exam.confirmEnd = false; renderExam(); break;
    case 'x-goto': S.exam.view = 'q'; S.exam.i = +d.i; renderExam(); break;
    case 'x-submit': S.exam.confirmEnd = true; renderExam(); break;
    case 'x-submit-yes': submitExam(); break;
    case 'x-exit': closeExam(); go('exam'); toast('Exam saved. The clock is paused.'); break;
    case 'x-exh': case 'w-exh': {
      const prefix = act[0];
      const sc = prefix === 'x' ? SCM[S.exam.cr] : SCM[W.id];
      const i = +d.i; if (prefix === 'w') W.tab = i;
      const box = $('#' + prefix + '-exh'); box.innerHTML = '<b>' + esc(sc.exhibits[i].title) + '</b>\n\n' + richText(sc.exhibits[i].content);
      document.querySelectorAll('#' + prefix + '-exhtabs .btn').forEach((b, j) => b.classList.toggle('pri', j === i));
      break; }
    case 'ws-open': W = null; route = {tab:'write', ws:d.id}; render(); window.scrollTo(0,0); break;
    case 'ws-back': if (W && W.running){ W.base = wsElapsed(); W.running = false; } clearInterval(wsTimer); W = null; go('write'); break;
    case 'ws-timer': { if (W.running){ W.base = wsElapsed(); W.running = false; } else { W.running = true; W.since = now(); } const resp = $('#w-resp'), notes = $('#w-notes'); S.crDraft[W.id] = {text: resp ? resp.value : '', notes: notes ? notes.value : '', secs: W.base}; save(true); render(); break; }
    case 'ws-peek': W.peek = !W.peek; render(); break;
    case 'ws-submit': {
      const text = $('#w-resp').value, notes = $('#w-notes').value;
      if (words(text) < 20){ toast('Write a bit more before submitting'); break; }
      const secs = wsElapsed();
      S.cr.push({scen:W.id, text, notes, words:words(text), secs, t:now(), score:null, ai:null});
      delete S.crDraft[W.id]; W = null; clearInterval(wsTimer); save();
      route = {tab:'write', scored:S.cr.length - 1, crtab: CAP.sample ? 'ai' : 'self'}; render(); window.scrollTo(0,0);
      break; }
    case 'ws-last': { let idx = -1; S.cr.forEach((c, i) => { if (c.scen === d.id) idx = i; }); if (idx >= 0) go('write', {scored:idx}); break; }
    case 'crtab': route.crtab = d.v; render(); break;
    case 'cr-self': {
      const T = crTarget(d.key); if (!T) break;
      const c = +$('#rs-c').value, a = +$('#rs-a').value, dd = +$('#rs-d').value;
      T.set({c, a, d:dd, o:Math.round((c + a + dd) / 3), src:'self'});
      save(); route.crtab = 'model'; render(); toast('Score saved. Now compare with the model.');
      break; }
    case 'cr-ai': crAI(d.key); break;
    case 'fc-start': startCards(d.deck); break;
    case 'fc-flip': if (FC){ FC.flip = !FC.flip; render(); } break;
    case 'fc-grade': {
      const c = FC.deck[FC.i]; const cur = S.cards[c.id] || {b:-1};
      if (+d.v){ const b = Math.min(BOXES.length - 1, cur.b + 1); S.cards[c.id] = {b, d:todayNum() + BOXES[b], last:now()}; FC.got++; }
      else S.cards[c.id] = {b:-1, d:todayNum() + 1, last:now()};
      save(true); FC.i++; FC.flip = false; render(); break; }
    case 'fc-end': FC = null; go('cards'); break;
    case 'backup': {
      const code = JSON.stringify(S);
      const ta = $('#bk');
      const done = () => toast('Backup code copied. Paste it somewhere safe.');
      try { navigator.clipboard.writeText(code).then(done, () => { ta.value = code; ta.select(); toast('Select-all and copy the code shown'); }); }
      catch(err){ ta.value = code; ta.select(); toast('Select-all and copy the code shown'); }
      break; }
    case 'restore': {
      try { const obj = JSON.parse($('#bk').value.trim()); if (!obj || !Array.isArray(obj.att)) throw 0; S = normalize(obj); save(); _statsCache = null; render(); toast('Progress restored'); }
      catch(err){ toast('That code didn\'t work. Copy the whole thing and try again.'); }
      break; }
    case 'reset': route.confirmReset = true; render(); break;
    case 'reset-yes': S = blank(); save(); _statsCache = null; P = null; FC = null; go('today'); toast('All progress erased'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (!$('#exam').hidden && S.exam){
    const x = S.exam;
    if (x.view !== 'review' && x.i < x.qids.length){
      const k = e.key.toUpperCase(); const i = 'ABCD'.indexOf(k) >= 0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(e.key);
      if (i >= 0){ x.ans[x.qids[x.i]] = i; save(true); renderExam(); }
      if (e.key === 'ArrowRight' || e.key === 'Enter'){ x.i = Math.min(x.i + 1, x.qids.length - (x.cr ? 0 : 1)); renderExam(); }
      if (e.key === 'ArrowLeft'){ x.i = Math.max(0, x.i - 1); renderExam(); }
    }
    return;
  }
  if (route.tab === 'play' && P && !P.done){
    const ord = dispOrder(curQ().id);
    const k = e.key.toUpperCase(); let i = 'ABCD'.indexOf(k); if (i < 0) i = '1234'.indexOf(e.key);
    if (i >= 0 && !P.revealed){ P.sel = ord[i]; render(); }
    else if (e.key === 'Enter'){ if (P.revealed) nextQ(); else if (P.sel != null) submitAnswer(1); }
  } else if (route.tab === 'cards' && FC){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); FC.flip = !FC.flip; render(); }
  }
});

/* ============================== boot ============================== */
function boot(){
  if (S.exam && S.exam.view !== 'done'){ /* stay on tab; offer resume */ }
  render();
  Sync.init();
}
boot();
})();
</script>
