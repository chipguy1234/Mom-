 English language development to ELLs in a separate class describes Stand-alone ENL."},{"code":"NYS_POLICY","note":"A teaching assistant doesn't meet the requirement. Integrated ENL requires a certified ESOL teacher as co-teacher, or a teacher who is dually certified."},null,{"code":"TERM","pair":"Transitional Bilingual Education ↔ Integrated ENL","note":"Home-language content instruction with English gradually increasing describes Transitional Bilingual Education, a bilingual program, not ENL."}],"key":"Integrated ENL = content plus English development, co-taught by content and ESOL teachers or taught by a dually certified teacher."},{"id":"5.2-10","skill":"5.2","type":"analysis","difficulty":3,"diag":0,"stimulus":"Co-teachers in a grade 6 Integrated ENL social studies class collected written answers to the question 'Why did people settle near rivers in ancient Mesopotamia?'\nResponse from an Emerging ELL (home language: Arabic):\n'People live near river. River give water for farm. Farm make food.'","stem":"Which co-assessment practice would best inform the teachers' next lessons?","options":["The ENL teacher grades the ELLs' grammar while the social studies teacher grades the other students' content","Both teachers score the answers with a rubric that rates content and language separately, then group by need","The social studies teacher assigns a content grade, and the ENL teacher marks each grammar error in red","Both teachers wait for the end-of-unit test to evaluate learning, so they can see a more complete picture"],"answer":1,"why":"Co-assessment means both teachers examine student work together, ideally with criteria that separate content understanding from language use. This student clearly understands why settlements formed near rivers (water → farming → food) but needs cause-and-effect language and verb forms. Scoring both dimensions and grouping by need lets the teachers plan targeted instruction, such as a mini-lesson on 'because' and 'so,' without underestimating the student's content knowledge.","traps":[{"code":"ASSESS_INVALID","note":"Judging the ELL only on grammar measures language instead of the content question, which this student actually answered correctly. Splitting students by teacher also undercuts shared responsibility."},null,{"code":"OVERCORRECT","note":"Marking every error overwhelms an Emerging writer and sets no priorities. The teachers should target one or two high-leverage patterns, such as connecting ideas with 'because' and 'so.'"},{"code":"PARTIAL","note":"Summative data matters, but waiting for the unit test misses the purpose of formative co-assessment, which is adjusting instruction now."}],"key":"Co-assess jointly with criteria that separate content from language, then use the results to group and plan."},{"id":"5.2-11","skill":"5.2","type":"application","difficulty":3,"diag":0,"stem":"Co-teachers in a grade 7 Integrated ENL math class want every student, ELLs and non-ELLs alike, to receive small-group instruction from both teachers during the same period, each teacher focusing on a different part of a lesson on ratios. Which co-teaching model best meets this goal?","options":["Parallel teaching","Alternative teaching","One teach, one assist","Station teaching"],"answer":3,"why":"In station teaching, the content is divided and each teacher teaches one part to small groups that rotate, so every student gets small-group instruction from both teachers. Parallel teaching also reduces group size, but each student works with only one teacher and both halves get the same content. This distinction (rotating through different parts vs. splitting the class for the same content) is a frequent exam point.","traps":[{"code":"TERM","pair":"parallel ↔ station","note":"Parallel teaching creates smaller groups, but each half works with only one teacher on the same content, so students don't get both teachers or both parts of the lesson."},{"code":"TERM","pair":"alternative ↔ station","note":"Alternative teaching gives one small group specialized time with one teacher. The large group doesn't get small-group instruction from both teachers."},{"code":"TERM","pair":"one teach, one assist ↔ station","note":"One teach, one assist keeps the whole class together, so there is no small-group instruction from either teacher."},null],"key":"Every student rotates to both teachers for different content = station; two halves, same content, one teacher each = parallel."},{"id":"5.2-12","skill":"5.2","type":"scenario","difficulty":1,"diag":0,"stem":"At the start of the year, a high school chemistry teacher with five ELLs in her class asks the ENL teacher what she should know about them. Which information would be most useful to share?","options":["Each student's proficiency level, modality strengths, prior schooling, and home-language literacy","A summary of the learning styles and classroom behaviors typical of each student's home culture","A list of the chapters each ELL can skip until he or she scores Commanding on the NYSESLAT","Each student's overall proficiency level, so she can give all five ELLs the same modified assignments"],"answer":0,"why":"Effective collaboration starts with sharing actionable information about each ELL: proficiency level, strengths and needs in listening, speaking, reading, and writing, educational background (including any interrupted schooling), and home-language literacy, which can be leveraged with bilingual glossaries or home-language texts. This lets the content teacher plan scaffolds for individuals instead of treating ELLs as one group.","traps":[null,{"code":"STEREOTYPE","note":"Styles and behaviors 'typical' of a culture are overgeneralizations. Students within any cultural group vary widely, and planning from stereotypes misleads the teacher."},{"code":"EXCLUSION","note":"ELLs shouldn't skip grade-level content until they're proficient. They need scaffolded access now, which is the whole point of integrated support."},{"code":"ONE_SIZE","note":"Five ELLs can differ widely in level, modality profile, and schooling. Identical modified assignments ignore those differences."}],"key":"Share individual profiles (level, modality strengths, schooling, home-language literacy) so content teachers can scaffold for each ELL."},{"id":"5.2-13","skill":"5.2","type":"analysis","difficulty":3,"diag":0,"stimulus":"Co-planning template, grade 4 Integrated ENL science (draft)\nContent objective: Students will explain how plants use sunlight to make food.\nLanguage objective: (blank)\nOpening (10 min): Classroom teacher introduces the lesson. ENL teacher: 'help ELLs.'\nWork time (25 min): Classroom teacher leads the investigation. ENL teacher: 'help ELLs.'\nClosing (10 min): Classroom teacher leads the review. ENL teacher: 'help ELLs.'","stem":"Which revision would most strengthen this plan?","options":["Assign the ENL teacher to lead the opening each day so that both teachers get equal time at the front","Add the ELLs' names to each section so that the ENL teacher knows which students to sit beside","Add a language objective and define the ENL teacher's role in each segment, such as leading a small group","Move the language work to a separate Stand-alone ENL period so this lesson can focus on science content"],"answer":2,"why":"The draft has two classic problems: no language objective, and a vague ENL role ('help ELLs') that defaults to one teach, one assist. A strong co-plan states both content and language objectives (for example, 'Students will explain how plants make food using sequence words and because') and specifies what each teacher does in each segment and which model they'll use. That way the ENL teacher's expertise drives instruction instead of trailing behind it.","traps":[{"code":"PARTIAL","note":"Equal time at the front looks like parity, but it doesn't add the missing language objective or tie the ENL teacher's role to what students need to learn."},{"code":"LITERAL","note":"Listing whom to sit beside keeps the vague 'help ELLs' role. It adds no language objective and defines no instruction for the ENL teacher to deliver."},null,{"code":"ISOLATED","note":"Moving language work elsewhere separates language from the content it serves. Integrated ENL exists to develop English through grade-level content in the same lesson."}],"key":"Co-plans need a language objective and a defined instructional role for the ENL teacher in each lesson segment."},{"id":"5.2-14","skill":"5.2","type":"knowledge","difficulty":1,"diag":0,"stem":"Research on co-teaching for ELLs most consistently identifies which factor as essential to an effective co-teaching partnership?","options":["Assigning both teachers to the same grade level for several consecutive years","Regular, scheduled co-planning time with shared goals and clearly defined roles","Requiring the ENL teacher to hold certification in the co-taught content area","Seating the ELLs together at one table so the ENL teacher can support them"],"answer":1,"why":"Across the co-teaching literature (for example, Honigsfeld and Dove), regular co-planning time is the most consistently cited condition for success. Without it, the ENL teacher learns the lesson as it unfolds and slips into an assistant role. With it, the two teachers can set content and language objectives, choose co-teaching models, divide roles, and plan co-assessment.","traps":[{"code":"PARTIAL","note":"Continuity can help a partnership mature, but it doesn't replace planning time. Long-standing partners without co-planning still default to one teach, one assist."},null,{"code":"NYS_POLICY","note":"NYS allows Integrated ENL to be co-taught by a certified ESOL teacher and a certified content teacher. Dual certification is one option, not a requirement for co-teaching."},{"code":"EXCLUSION","note":"Clustering ELLs at one table segregates them within the room, limits their interaction with English-proficient peers, and casts the ENL teacher as their aide."}],"key":"Regular co-planning with shared goals and defined roles is the foundation of effective co-teaching."}],"lessons":[],"scenarios":[],"guide":null}</script>

const TRAPS = {
 TERM:{label:'Near-miss terms', plain:'You picked a definition that belongs to a neighboring concept.', fix:'Name the concept in your own words first, then check each option against its defining feature, not just its topic.'},
 PARTIAL:{label:'Good, but not best', plain:'You chose something true or reasonable that is narrower or less complete than the keyed answer.', fix:'The exam asks for the BEST or MOST effective option. Compare your top two: which one meets the student\'s specific need and the stem\'s exact goal?'},
 DEFICIT:{label:'Deficit lens', plain:'You chose an option that treats the home language or culture as a problem to remove.', fix:'Credited answers treat home language and culture as resources. Be suspicious of options that ban, replace, or "fix" the L1.'},
 LOWER_RIGOR:{label:'Watering it down', plain:'You chose to simplify the content or lower expectations instead of scaffolding.', fix:'Keep the grade-level text or task and add supports (visuals, frames, L1, chunking). Swapping in easier work is rarely best.'},
 ISOLATED:{label:'Drills out of context', plain:'You chose rote or decontextualized practice (lists, worksheets, drills).', fix:'Prefer language practice embedded in meaningful content and real communication.'},
 PASSIVE:{label:'Students just listening', plain:'You chose a teacher-centered option with no student interaction or output.', fix:'Look for structured talk and output: partners, discussion, writing with talk.'},
 MISREFERRAL:{label:'Difference vs. disability', plain:'You confused normal second-language development with a disability (or delayed a warranted evaluation).', fix:'Ask: does the difficulty also show up in the home language and across settings? Rule out language and instruction first, but don\'t stall a warranted evaluation.'},
 ONE_SIZE:{label:'Same support for all', plain:'You chose an option that ignores the student\'s level or profile.', fix:'Match the support to the proficiency level and the details given about this student.'},
 WRONG_LEVEL:{label:'Level mismatch', plain:'The option expects too much or too little for the student\'s stage.', fix:'Place the student on Entering → Commanding first, then choose what that level can do with support.'},
 OVERCORRECT:{label:'Correcting too much', plain:'You chose heavy or interrupting error correction when meaning was the goal.', fix:'When fluency or meaning is the goal, use recasts or targeted feedback on one or two patterns.'},
 EXCLUSION:{label:'Waiting until proficient', plain:'You chose to remove the ELL from grade-level work, enrichment, or opportunity.', fix:'ELLs get grade-level content and opportunities now, with support. Removing them or waiting is the trap.'},
 ASSESS_INVALID:{label:'Testing the wrong thing', plain:'The assessment you chose measures language when it should measure content (or the reverse), or it is biased.', fix:'Ask what the assessment is meant to measure. Remove language barriers when you are measuring content.'},
 LAW_FACT:{label:'Law & case mix-up', plain:'You attached the wrong holding or detail to a law or court case.', fix:'Anchor each case to one phrase: Lau = same ≠ equal; Castañeda = 3-prong test; Plyler = school for undocumented children; EEOA = "appropriate action."'},
 NYS_POLICY:{label:'NYS rule slip', plain:'You picked the wrong NYS procedure, timeline, test, or requirement.', fix:'Rehearse the sequence: HLQ → interview → NYSITELL (10 school days) → parent notice (5) → program. Exit = Commanding, or Expanding + ELA Level 3 / Regents 65.'},
 STEREOTYPE:{label:'Group generalization', plain:'You chose an option that assumes what a student or family is like based on their culture.', fix:'Gather information about the individual; avoid answers built on cultural assumptions.'},
 FAMILY_BARRIER:{label:'Family communication gap', plain:'You chose a family-communication approach that shuts some families out.', fix:'Use the family\'s preferred language, qualified interpreters (never children), and flexible two-way contact.'},
 MISAPPLIED_THEORY:{label:'Theory mismatch', plain:'You matched the right idea to the wrong theorist, or misread what a theory implies for teaching.', fix:'Tie each theorist to one claim and one classroom move: Krashen = input, Swain = output, Long = interaction, Vygotsky = ZPD, Cummins = BICS/CALP/CUP.'},
 LITERAL:{label:'Surface detail', plain:'You reacted to a vivid detail instead of the key evidence or the question actually asked.', fix:'Reread the last sentence of the stem and underline the decisive evidence before you look at the options.'}
};
const LEVELS = [
 {n:0, name:'Not yet assessed'},{n:1, name:'Entering'},{n:2, name:'Emerging'},{n:3, name:'Transitioning'},{n:4, name:'Expanding'},{n:5, name:'Commanding'}
];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET = 'ABCD';
const now = () => Date.now();
function dayStr(t){ const d = t ? new Date(t) : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Math.round(new Date(y, m-1, d).getTime()/864e5); }
const todayNum = () => dayNum(dayStr());
function hash(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return (h >>> 0); }

const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const plural = (n, w, p) => n + ' ' + (n === 1 ? w : (p || w + 's'));
function fmtClock(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); }
function words(t){ return (String(t||'').trim().match(/\S+/g) || []).length; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400); }
function md(s){
  const blocks = String(s||'').split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) return '';
    const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inl(l.replace(/^\s*[-•]\s+/, '')) + '</li>').join('') + '</ul>';
    if (lines.some(l => /^\s*[-•]\s+/.test(l))) {
      let out = '', list = [];
      const flush = () => { if (list.length){ out += '<ul>' + list.map(x => '<li>'+inl(x)+'</li>').join('') + '</ul>'; list = []; } };
      lines.forEach(l => { if (/^\s*[-•]\s+/.test(l)) list.push(l.replace(/^\s*[-•]\s+/, '')); else { flush(); out += '<p>'+inl(l)+'</p>'; } });
      flush(); return out;
    }
    return '<p>' + lines.map(inl).join('<br>') + '</p>';
  }).join('');
}
/* stimulus / exhibit text: pipe tables become real tables */
function richText(s){
  const lines = String(s||'').split('\n');
  let out = '', buf = [], tbl = [];
  const flushText = () => { if (buf.length){ out += esc(buf.join('\n')); buf = []; } };
  const flushTbl = () => {
    if (tbl.length){
      const rows = tbl.map(l => l.split('|').map(c => c.trim())).filter(r => !r.every(c => /^:?-{2,}:?$/.test(c) || c === ''));
      const clean = rows.map(r => { if (r[0] === '') r.shift(); if (r[r.length-1] === '') r.pop(); return r; });
      out += '<div class="tbl-wrap"><table><thead><tr>' + clean[0].map(c => '<th>'+esc(c)+'</th>').join('') + '</tr></thead><tbody>' +
        clean.slice(1).map(r => '<tr>' + r.map(c => '<td>'+esc(c)+'</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      tbl = [];
    }
  };
  lines.forEach((l, i) => {
    const isRow = (l.match(/\|/g) || []).length >= 1 && l.includes(' | ');
    const nextRow = lines[i+1] != null && lines[i+1].includes(' | ');
    const prevRow = lines[i-1] != null && lines[i-1].includes(' | ');
    if (isRow && (nextRow || prevRow)){ flushText(); tbl.push(l); }
    else { flushTbl(); buf.push(l); }
  });
  flushText(); flushTbl();
  return out.replace(/\n(?=<div class="tbl-wrap">)/g, '').replace(/(<\/div>)\n/g, '$1');
}

const Sync = {
  db:null, base:'', on:false, timer:null, chain:Promise.resolve(), pushedAtt:0, err:'',
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.base = 'data/users/' + uid;
      const snap = await db.doc(this.base + '/main').get();
      if (snap.exists){
        const r = snap.data() || {};
        if ((r.updated || 0) > (S.updated || 0) + 1000){
          const att = [];
          for (let i = 0; i < (r.chunks || 0); i++){
            const cs = await db.doc(this.base + '/att' + i).get();
            if (cs.exists){ try { JSON.parse(cs.data().a || '[]').forEach(x => att.push(unpackAtt(x))); } catch(e){} }
          }
          const st = normalize(JSON.parse(r.json || '{}'));
          st.att = att; st.updated = r.updated;
          S = st; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ memStore = S; }
          this.pushedAtt = att.length; this.on = true; render(); toast('Loaded your saved progress');
          return;
        }
        this.pushedAtt = Math.min(r.attCount || 0, S.att.length);
        this.on = true;
        if ((S.updated || 0) > (r.updated || 0)) this.schedule(1500);
      } else {
        this.on = true; this.pushedAtt = 0;
        if (S.updated) this.schedule(1500);
      }
      renderSettingsBadge();
    } catch(e){ this.on = false; this.err = (e && e.code) || 'unavailable'; }
  },
  schedule(ms){ if (!this.on) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms || 8000); },
  push(){ clearTimeout(this.timer); this.chain = this.chain.then(() => this._push()).catch(e => { this.err = (e && e.code) || 'error'; if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) this.on = false; }); return this.chain; },
  async _push(){
    if (!this.db || !this.on) return;
    const CH = 1500, n = S.att.length, chunks = Math.ceil(n / CH);
    for (let i = Math.floor(this.pushedAtt / CH); i < chunks; i++){
      await this.db.doc(this.base + '/att' + i).set({a: JSON.stringify(S.att.slice(i*CH, (i+1)*CH).map(packAtt))});
    }
    const rest = Object.assign({}, S); delete rest.att;
    const json = JSON.stringify(rest);
    if (json.length > 240000) { this.err = 'too_large'; return; }
    await this.db.doc(this.base + '/main').set({updated: S.updated, chunks, attCount: n, json});
    this.pushedAtt = n; this.err = '';
  }
};

let _statsCache = null, _statsLen = -1;
function stats(){
  if (_statsCache && _statsLen === S.att.length + S.cr.length * 1000 + S.exams.length * 7) return _statsCache;
  const by = {};
  S.att.forEach(a => { const q = QM[a.q]; if (!q) return; (by[q.skill] = by[q.skill] || []).push(a); });
  const sk = {};
  SKILLS.forEach(code => {
    const list = by[code] || [];
    let num = 0, den = 0, ok = 0, sureNo = 0, unsOk = 0;
    for (let k = list.length - 1, j = 0; k >= 0; k--, j++){
      const a = list[k]; const w = Math.pow(0.88, j) * (!a.ok && a.cf === 1 ? 1.25 : 1);
      num += w * (a.ok ? 1 : 0); den += w;
    }
    list.forEach(a => { if (a.ok) ok++; if (!a.ok && a.cf === 1) sureNo++; if (a.ok && a.cf === 0) unsOk++; });
    const m = list.length ? (num + 0.75) / (den + 1.5) : null;
    let lv = 0;
    if (m != null){ lv = m < .45 ? 1 : m < .6 ? 2 : m < .72 ? 3 : m < .85 ? 4 : 5; if (lv === 5 && list.length < 4) lv = 4; }
    const total = Q.filter(q => q.skill === code).length;
    const seen = new Set(list.map(a => a.q)).size;
    sk[code] = {code, n:list.length, ok, m, lv, sureNo, unsOk, total, seen, acc: list.length ? ok/list.length : null};
  });
  const comp = {};
  COMPS.forEach(c => {
    const arr = Object.keys(c.skills).map(k => sk[k]).filter(x => x.m != null);
    const n = Object.keys(c.skills).reduce((t,k) => t + sk[k].n, 0);
    comp[c.id] = {m: arr.length ? arr.reduce((t,x) => t + x.m, 0) / arr.length : null, covered: arr.length, of: Object.keys(c.skills).length, n};
  });
  _statsCache = {sk, comp}; _statsLen = S.att.length + S.cr.length * 1000 + S.exams.length * 7;
  return _statsCache;
}
function crRecent(){
  const scores = [];
  S.cr.forEach(c => { if (c.score && c.score.o) scores.push({t:c.t, o:c.score.o}); });
  S.exams.forEach(e => { if (e.crScore && e.crScore.o) scores.push({t:e.finished, o:e.crScore.o}); });
  scores.sort((a,b) => b.t - a.t);
  return scores.slice(0, 2);
}
function toScaled(p){ return Math.round(p <= .7 ? 400 + (p/.7)*120 : 520 + ((p-.7)/.3)*80); }
function projection(){
  const st = stats();
  const comps = COMPS.slice(0,6);
  if (comps.some(c => st.comp[c.id].m == null)) return null;
  const sr = comps.reduce((t,c) => t + c.weight * st.comp[c.id].m, 0) / 80;
  const cr = crRecent();
  const crP = cr.length ? cr.reduce((t,x) => t + x.o, 0) / cr.length / 4 : 0.625;
  const p = 0.8 * sr + 0.2 * crP;
  return {sr, crP, crAssumed: !cr.length, p, scaled: toScaled(p)};
}
function priorities(){
  const st = stats();
  return SKILLS.map(code => {
    const c = compOf(code), x = st.sk[code];
    const m = x.m == null ? 0.55 : x.m;
    const w = c.weight / Object.keys(c.skills).length * (c.id === 7 ? 0.45 : 1);
    const sureRate = x.n ? x.sureNo / x.n : 0;
    const readRecent = S.read[code] && (now() - S.read[code] < 7*864e5);
    const pr = (1 - m) * w * (1 + 0.8*sureRate) * (readRecent ? 0.92 : 1) * (x.n === 0 ? 0.9 : 1);
    return {code, pr, m: x.m, lv: x.lv, n: x.n};
  }).sort((a,b) => b.pr - a.pr);
}
function analyze(atts){
  const r = {n:0, ok:0, traps:{}, pairs:{}, conf:{so:0, sn:0, uo:0, un:0}, type:{}, diff:{}, secs:0, timed:0, sureMiss:[], comp:{}, skill:{}};
  atts.forEach(a => {
    const q = QM[a.q]; if (!q) return;
    r.n++; if (a.ok) r.ok++;
    const t = r.type[q.type] = r.type[q.type] || {n:0, ok:0}; t.n++; if (a.ok) t.ok++;
    const d = r.diff[q.difficulty] = r.diff[q.difficulty] || {n:0, ok:0}; d.n++; if (a.ok) d.ok++;
    const cc = compOf(q.skill).id; const ce = r.comp[cc] = r.comp[cc] || {n:0, ok:0}; ce.n++; if (a.ok) ce.ok++;
    const se = r.skill[q.skill] = r.skill[q.skill] || {n:0, ok:0}; se.n++; if (a.ok) se.ok++;
    if (a.s){ r.secs += a.s; r.timed++; }
    if (a.cf === 1){ if (a.ok) r.conf.so++; else { r.conf.sn++; r.sureMiss.push(a); } }
    else if (a.cf === 0){ if (a.ok) r.conf.uo++; else r.conf.un++; }
    (q.traps || []).forEach((tr, j) => {
      if (!tr || j === q.answer) return;
      const e = r.traps[tr.code] = r.traps[tr.code] || {offered:0, chosen:0, qs:[]};
      e.offered++;
      if (a.c === j){ e.chosen++; e.qs.push(a.q); if (tr.pair){ const p = r.pairs[tr.pair] = r.pairs[tr.pair] || {n:0, qs:[]}; p.n++; p.qs.push(a.q); } }
    });
  });
  return r;
}

/* ============================== selection ============================== */
function diagItems(kind){
  const want = kind === 'check' ? 2 : 1;
  const out = [];
  SKILLS.forEach(code => {
    const pool = Q.filter(q => q.skill === code);
    if (!pool.length) return;
    let q = pool.find(x => x.diag === want) || pool.find(x => x.difficulty === 2 && !x.diag) || pool[0];
    out.push(q.id);
  });
  const r = rng(hash('diag-' + kind));
  const byComp = {};
  out.forEach(id => { const c = compOf(QM[id].skill).id; (byComp[c] = byComp[c] || []).push(id); });
  Object.values(byComp).forEach(a => shuffle(a, r));
  const order = []; let more = true, k = 0;
  while (more){ more = false; for (let c = 1; c <= 7; c++){ const a = byComp[c]; if (a && a[k]){ order.push(a[k]); more = true; } } k++; }
  return order;
}
let FORMS = null;
function forms(){
  if (FORMS) return FORMS;
  const used = new Set(Q.filter(q => q.diag).map(q => q.id));
  const crIds = SCEN.map(s => s.id);
  FORMS = {};
  ['A','B','C'].forEach((F, fi) => {
    const r = rng(hash('form-' + F));
    const items = [];
    COMPS.slice(0,6).forEach(c => {
      const skills = shuffle(Object.keys(c.skills), r);
      const base = Math.floor(15 / skills.length), extra = 15 - base * skills.length;
      let got = [];
      skills.forEach((sk, k) => {
        const need = base + (k < extra ? 1 : 0);
        const pool = shuffle(Q.filter(q => q.skill === sk && !used.has(q.id)), r);
        const pick = []; const want = [2,1,3,2,1,3,2];
        want.forEach(dv => { if (pick.length < need){ const q = pool.find(x => x.difficulty === dv && !pick.includes(x)); if (q) pick.push(q); } });
        pool.forEach(x => { if (pick.length < need && !pick.includes(x)) pick.push(x); });
        pick.forEach(q => { used.add(q.id); got.push(q.id); });
      });
      if (got.length < 15){
        const pool = shuffle(Q.filter(q => compOf(q.skill).id === c.id && !used.has(q.id)), r);
        pool.slice(0, 15 - got.length).forEach(q => { used.add(q.id); got.push(q.id); });
      }
      items.push(...got);
    });
    FORMS[F] = {qids: shuffle(items, r), cr: crIds.length ? crIds[[0,2,5][fi] % crIds.length] : null};
  });
  return FORMS;
}
function seenSet(){ return new Set(S.att.map(a => a.q)); }
function lastSeenMap(){ const m = {}; S.att.forEach(a => { m[a.q] = a.t; }); return m; }
function pickFrom(pool, n, opts={}){
  const seen = lastSeenMap();
  const scored = pool.map(q => {
    let sc = Math.random();
    if (seen[q.id] == null) sc += 3; else sc += Math.min(2.5, (now()/1000 - seen[q.id]) / 86400 / 7);
    if (opts.diffTarget) sc += q.difficulty === opts.diffTarget ? 0.8 : 0;
    if (opts.avoidDiag && q.diag) sc -= 1.5;
    return {q, sc};
  }).sort((a,b) => b.sc - a.sc);
  return scored.slice(0, n).map(x => x.q.id);
}
function dueReviews(){ const t = todayNum(); return Object.entries(S.srs).filter(([id, v]) => QM[id] && v.d <= t).map(([id]) => id); }
function pickSmart(n){
  const pri = priorities().filter(p => Q.some(q => q.skill === p.code));
  const due = shuffle(dueReviews()).slice(0, Math.round(n * 0.3));
  const out = [...due];
  const top = pri.slice(0, 6);
  const weights = top.map((p, i) => p.pr * (1 - i * 0.08));
  const st = stats();
  let guard = 0;
  while (out.length < n && guard++ < 400){
    let code;
    if (Math.random() < 0.8 && top.length){
      const tot = weights.reduce((a,b) => a+b, 0); let x = Math.random() * tot;
      code = top[top.length-1].code; for (let i = 0; i < top.length; i++){ x -= weights[i]; if (x <= 0){ code = top[i].code; break; } }
    } else code = SKILLS[Math.floor(Math.random()*SKILLS.length)];
    const m = st.sk[code].m;
    const target = m == null ? 2 : m < .5 ? 1 : m < .8 ? 2 : 3;
    const pool = Q.filter(q => q.skill === code && !out.includes(q.id));
    const pick = pickFrom(pool, 1, {diffTarget: target, avoidDiag: true})[0];
    if (pick) out.push(pick);
  }
  return shuffle(out);
}
function pickSkill(code, n){ return shuffle(pickFrom(Q.filter(q => q.skill === code), n, {avoidDiag: true})); }
function pickTrap(code, n){
  const pool = Q.filter(q => (q.traps || []).some(t => t && t.code === code));
  return shuffle(pickFrom(pool, n, {avoidDiag: true}));
}
function pickQuick(){
  const out = [];
  COMPS.slice(0,6).forEach(c => { const pool = Q.filter(q => compOf(q.skill).id === c.id); out.push(...pickFrom(pool, c.id >= 4 && c.id <= 5 ? 3 : 2, {avoidDiag: true})); });
  return shuffle(out).slice(0, 15);
}

function sparkline(vals, opts={}){
  if (vals.length < 2) return '';
  const W = 300, H = 60, pad = 4;
  const xs = i => pad + i * (W - 2*pad) / (vals.length - 1);
  const ys = v => H - pad - v * (H - 2*pad);
  const pts = vals.map((v,i) => xs(i).toFixed(1) + ',' + ys(v).toFixed(1)).join(' ');
  const area = 'M' + xs(0) + ',' + (H-pad) + ' L' + pts.split(' ').join(' L') + ' L' + xs(vals.length-1) + ',' + (H-pad) + ' Z';
  const last = vals[vals.length-1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(opts.label || 'trend') + '"><path class="ar" d="' + area + '"/><line class="pass" x1="0" x2="' + W + '" y1="' + ys(.75) + '" y2="' + ys(.75) + '"/><polyline class="ln" points="' + pts + '"/><circle class="pt" cx="' + xs(vals.length-1) + '" cy="' + ys(last) + '" r="3.5"/></svg>';
}
function streak(){
  const days = new Set(S.att.map(a => dayNum(dayStr(a.t * 1000))));
  let d = todayNum(), n = 0;
  if (!days.has(d)) d--;
  while (days.has(d)){ n++; d--; }
  return n;
}

function paceBlock(){
  const dl = daysLeft();
  if (dl == null || dl < 1) return '';
  const seen = seenSet().size;
  const perDay = Math.max(10, Math.min(60, Math.ceil((Q.length - seen) / Math.max(1, dl - 2))));
  const at = f => { const d = new Date(); d.setDate(d.getDate() + Math.max(0, Math.round(f))); return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}); };
  const done = k => S.exams.some(e => e.form === k);
  const plan = dl >= 10 ? [['A', dl * 0.4], ['B', dl * 0.7], ['C', dl - 5]] : dl >= 4 ? [['A', 1], ['C', dl - 2]] : [['A', 0]];
  return '<div style="margin-top:14px" class="small"><b>Pace:</b> about <b>' + perDay + ' questions a day</b> gets you through the whole bank before the exam.<br><b>Mock exams:</b> ' + plan.map(([k, f]) => 'Test ' + k + (done(k) ? ' ✓' : ' by ' + at(f))).join(' · ') + '</div>';
}
function milestones(){
  const diagDone = S.diag && S.diag.done;
  const ms = [
    ['Diagnostic', diagDone],
    ['Lessons: weak skills', diagDone && priorities().slice(0,10).every(p => S.read[p.code])],
    ['Mock Exam A', S.exams.some(e => e.form === 'A')],
    ['Progress check', S.check && S.check.done],
    ['Mock Exam B', S.exams.some(e => e.form === 'B')],
    ['3 written responses scored', S.cr.filter(c => c.score).length + S.exams.filter(e => e.crScore).length >= 3],
    ['Mock Exam C ≥ 75%', S.exams.some(e => e.form === 'C' && e.srPct >= .75)]
  ];
  let nowSet = false;
  return '<div class="milestones">' + ms.map(([t, done]) => { let cls = done ? 'done' : ''; if (!done && !nowSet){ cls = 'now'; nowSet = true; } return '<div class="ms ' + cls + '"><b>' + t + '</b><span class="muted">' + (done ? 'Done' : cls === 'now' ? 'Up next' : 'Later') + '</span></div>'; }).join('') + '</div>';
}

/* ============================== PLAYER ============================== */
let P = null;
function startPlayer(cfg){
  P = Object.assign({i:0, sel:null, struck:{}, answers:{}, revealed:false, qStart:now(), startedAt:now(), home:'practice', feedback: S.prefs.fb !== 'end', shuffle:false, order:{}}, cfg);
  if (!P.qids.length){ toast('No questions available for that set yet'); P = null; return; }
  if (P.shuffle) P.qids.forEach(id => { P.order[id] = shuffle([0,1,2,3]); });
  go('play');
}
function curQ(){ return QM[P.qids[P.i]]; }
function dispOrder(id){ return P.order[id] || [0,1,2,3]; }
VIEWS.play = function(){
  if (!P) return VIEWS.practice();
  if (P.done) return playSummary();
  const q = curQ();
  const total = P.qids.length;
  const ord = dispOrder(q.id);
  const isDiag = P.mode === 'diag' || P.mode === 'check';
  const showSkill = !isDiag && P.mode !== 'quick';
  let h = '<div class="player"><div class="phead"><div class="row"><span class="chip brand">' + esc(P.title) + '</span>' + (showSkill ? '<span class="chip">' + q.skill + ' · ' + esc(SKILL[q.skill].name) + '</span>' : '') + '</div><div class="row"><span class="prog">' + (P.i + 1) + ' / ' + total + '</span>' + (P.limit ? '<span class="prog mono" id="setclock"></span>' : '') + '<button class="btn sm ghost" data-act="quit">' + (isDiag ? 'Pause' : 'End set') + '</button></div></div>';
  h += '<div class="pbar"><i style="width:' + pct(P.i, total) + '%"></i></div>';
  if (q.stimulus) h += '<div class="stim"><div class="stim-h">Read the information below</div>' + richText(q.stimulus) + '</div>';
  h += '<div class="stem">' + esc(q.stem) + '</div><div class="opts" role="radiogroup" aria-label="Answer options">';
  const ans = P.answers[q.id];
  ord.forEach((oi, di) => {
    let cls = 'opt';
    if (P.revealed){ if (oi === q.answer) cls += ' ok'; else if (ans && ans.c === oi) cls += ' no'; }
    else if (P.sel === oi) cls += ' sel';
    if (P.struck[q.id + ':' + oi] && !P.revealed) cls += ' struck';
    h += '<div class="optrow"><button class="' + cls + '" role="radio" aria-checked="' + (P.sel === oi) + '" data-act="pick" data-o="' + oi + '"' + (P.revealed ? ' disabled' : '') + '><span class="ol">' + LET[di] + '</span><span class="ot">' + esc(q.options[oi]) + '</span></button>' + (P.revealed ? '' : '<button class="strike' + (P.struck[q.id + ':' + oi] ? ' on' : '') + '" data-act="strike" data-o="' + oi + '" aria-label="Cross out option ' + LET[di] + '" title="Cross out">✕</button>') + '</div>';
  });
  h += '</div>';
  if (P.revealed) h += feedbackBlock(q, ans.c, ord);
  else {
    const dis = P.sel == null ? ' disabled' : '';
    if (isDiag) h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> to choose. How sure are you?</span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Guessing → next</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Sure → next</button></div>';
    else if (P.mode === 'quick' || !P.feedback) h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span>, <span class="kbd">Enter</span></span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Not sure → next</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Sure → next</button></div>';
    else h += '<div class="pfoot"><span class="hint">Keys: <span class="kbd">A</span>–<span class="kbd">D</span>, <span class="kbd">Enter</span>. Telling me how sure you are sharpens the report.</span><button class="btn" data-act="submit" data-cf="0"' + dis + '>Check · not sure</button><button class="btn pri" data-act="submit" data-cf="1"' + dis + '>Check · I\'m sure</button></div>';
  }
  h += '</div>';
  return h;
};
function feedbackBlock(q, c, ord){
  const ok = c === q.answer;
  const L = i => LET[ord.indexOf(i)];
  const tr = !ok && c >= 0 ? q.traps[c] : null;
  let h = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="fbh">' + (ok ? '✓ Correct' : c < 0 ? 'Not answered. The answer is ' + L(q.answer) : '✗ Not quite. The best answer is ' + L(q.answer)) + (tr ? '<span class="chip trap">Trap: ' + esc((TRAPS[tr.code] || {}).label || tr.code) + '</span>' : '') + '</div><div class="fbb">';
  if (tr){
    h += '<div class="yours"><b>Why ' + L(c) + ' is tempting but wrong:</b> ' + esc(tr.note) + (tr.pair ? '<div class="small" style="margin-top:4px"><b>You mixed up:</b> ' + esc(tr.pair) + '</div>' : '') + '<div class="small muted" style="margin-top:4px"><b>Pattern fix:</b> ' + esc(TRAPS[tr.code] ? TRAPS[tr.code].fix : '') + '</div></div>';
  }
  h += '<div><b>Why ' + L(q.answer) + ' is best:</b> ' + esc(q.why) + '</div>';
  h += '<div class="keyline"><b>Takeaway</b>' + esc(q.key) + '</div>';
  const others = ord.filter(i => i !== q.answer && i !== c);
  if (others.length) h += '<details class="others"><summary>Why the other options are wrong</summary><ul>' + others.map(i => '<li><b>' + L(i) + '</b> <span class="chip trap" style="margin:0 4px">' + esc((TRAPS[q.traps[i] && q.traps[i].code] || {}).label || '') + '</span>' + esc(q.traps[i] ? q.traps[i].note : '') + '</li>').join('') + '</ul></details>';
  h += '<div class="row">' + (LESSONS[q.skill] ? '<button class="btn sm" data-act="lesson" data-skill="' + q.skill + '">Lesson ' + q.skill + '</button>' : '') + (CAP.sample ? '<button class="btn sm" data-act="ask" data-q="' + q.id + '">' + (ok ? 'Explain it another way' : 'Ask Claude why') + '</button>' : '') + '</div><div id="askout"></div>';
  h += '</div></div>';
  if (P && P.revealed) h += '<div class="pfoot"><button class="btn pri lg" data-act="next">' + (P.i + 1 < P.qids.length ? 'Next question →' : 'See results') + '</button></div>';
  return h;
}
let setClockTimer = null;
function afterPlayRender(){
  clearInterval(setClockTimer);
  if (P && P.limit && !P.done){
    const tick = () => { const el = $('#setclock'); if (!el){ clearInterval(setClockTimer); return; } const left = P.limit - (now() - P.startedAt); el.textContent = '⏱ ' + fmtClock(left); if (left <= 0){ clearInterval(setClockTimer); toast('Time! Here are your results.'); finishSet(); } };
    tick(); setClockTimer = setInterval(tick, 1000);
  }
}
function submitAnswer(cf){
  if (!P || P.sel == null) return;
  const q = curQ();
  const secs = (now() - P.qStart) / 1000;
  const ok = record(q.id, P.sel, cf, secs, P.mode);
  P.answers[q.id] = {c:P.sel, ok, cf, s:secs};
  if (P.mode === 'diag' || P.mode === 'check'){
    const D = S[P.mode]; D.ans[q.id] = {c:P.sel, cf}; D.i = P.i + 1;
  }
  save();
  if (P.feedback && P.mode !== 'quick' && P.mode !== 'diag' && P.mode !== 'check'){ P.revealed = true; render(); }
  else nextQ();
}
function nextQ(){
  P.i++; P.sel = null; P.revealed = false; P.qStart = now();
  if (P.i >= P.qids.length) finishSet();
  else { render(); window.scrollTo(0, 0); }
}
function finishSet(){
  P.done = true; P.finished = now();
  if (P.mode === 'diag' || P.mode === 'check'){
    const D = S[P.mode]; D.done = true; D.finished = now(); save();
    route = {tab:'insights', diag:P.mode}; P = null; render(); window.scrollTo(0,0); return;
  }
  render(); window.scrollTo(0, 0);
}
function playSummary(){
  const ids = P.qids.filter(id => P.answers[id]);
  const atts = ids.map(id => ({q:id, c:P.answers[id].c, ok:P.answers[id].ok, cf:P.answers[id].cf, s:P.answers[id].s}));

  h += '<div class="stats" style="margin-bottom:16px"><div class="stat"><span class="n">' + (an.timed ? Math.round(an.secs / an.timed) : 0) + 's</span><span class="c">avg per question (exam pace ≈ 90s)</span></div><div class="stat"><span class="n">' + an.conf.sn + '</span><span class="c">missed while "sure"</span></div><div class="stat"><span class="n">' + an.conf.uo + '</span><span class="c">right while unsure</span></div></div>';

  if (traps.length) h += '<div class="card" style="margin-bottom:16px"><div class="eyebrow red">What tripped you up in this set</div>' + traps.map(([k, v]) => '<div class="trapcard"><div><b>' + esc(TRAPS[k].label) + '</b><div class="small muted">' + esc(TRAPS[k].plain) + '</div></div><div class="rate">' + v.chosen + '×</div><div class="fix"><b>Fix:</b> ' + esc(TRAPS[k].fix) + '</div></div>').join('') + '</div>';
  h += '<div class="row" style="margin-bottom:18px">' + (missed.length ? '<button class="btn pri" data-act="retry-missed">Retry the ' + plural(missed.length, 'miss', 'misses') + ' (options reshuffled)</button>' : '') + '<button class="btn" data-act="smart" data-n="10">Another smart set</button><button class="btn ghost" data-act="tab" data-tab="insights">Pinpoint Report</button></div>';
  h += '<h3 style="margin-bottom:10px">Question review</h3>' + reviewList(atts);
  h += '</div>';
  return h;
}
function reviewList(atts, opts={}){
  return '<div class="qlist">' + atts.map((a, i) => {
    const q = QM[a.q]; if (!q) return '';
    const tr = !a.ok && a.c >= 0 ? q.traps[a.c] : null;

      '<div style="margin-top:10px">' + (q.stimulus ? '<div class="stim">' + richText(q.stimulus) + '</div>' : '') + '<div class="stem" style="font-size:.98rem">' + esc(q.stem) + '</div><div class="opts">' +
      q.options.map((o, j) => '<div class="opt' + (j === q.answer ? ' ok' : j === a.c ? ' no' : '') + '"><span class="ol">' + LET[j] + '</span><span class="ot">' + esc(o) + (j !== q.answer && q.traps[j] ? '<span class="small muted" style="display:block;margin-top:4px">' + esc(q.traps[j].note) + '</span>' : '') + '</span></div>').join('') +
      '</div><div class="fb ok" style="margin-top:10px"><div class="fbb"><div><b>Why ' + LET[q.answer] + ':</b> ' + esc(q.why) + '</div><div class="keyline"><b>Takeaway</b>' + esc(q.key) + '</div></div></div></div></details>';
  }).join('') + '</div>';

/* ============================== diagnostic ============================== */
function startDiag(kind){
  kind = kind || 'diag';
  if (!S[kind]) S[kind] = {items: diagItems(kind), i:0, ans:{}, started:now(), done:false};
  const D = S[kind];
  if (!D.items || !D.items.length) D.items = diagItems(kind);
  save(true);
  const remaining = D.items.filter(id => !D.ans[id]);
  if (!remaining.length){ D.done = true; save(); go('insights', {diag:kind}); return; }
  P = {mode:kind, title: kind === 'diag' ? 'Diagnostic' : 'Progress check', qids: D.items, i: D.items.findIndex(id => !D.ans[id]), sel:null, struck:{}, answers:{}, revealed:false, qStart:now(), startedAt:now(), home:'today', feedback:false, order:{}};
  D.items.forEach(id => { if (D.ans[id]) P.answers[id] = {c:D.ans[id].c, ok:D.ans[id].c === QM[id].answer, cf:D.ans[id].cf}; });
  go('play');
}

/* ============================== VIEW: insights (pinpoint report) ============================== */
VIEWS.insights = function(r){
  const kind = r.diag;
  const D = kind ? S[kind] : null;
  let atts;
  if (D){
    const ids = new Set(D.items);
    const firstByQ = {};
    S.att.forEach(a => { if (ids.has(a.q) && a.m === kind && !firstByQ[a.q]) firstByQ[a.q] = a; });
    atts = D.items.map(id => firstByQ[id]).filter(Boolean);
  } else atts = S.att.slice(-600);
  let h = '';
  if (!S.att.length){
    return '<h1 class="view-title">Pinpoint Report</h1><div class="ruled"></div><div class="empty"><p style="margin-bottom:12px">Your report builds itself as you answer. It shows where you stand on every skill, which traps keep catching you, and which concepts you mix up.</p><button class="btn pri" data-act="diag-start">Take the diagnostic</button></div>';
  }

  const st = stats();

    h += '<div class="eyebrow">' + (kind === 'diag' ? 'Diagnostic results · your baseline' : 'Progress check results') + '</div><h1 class="view-title">' + an.ok + ' of ' + an.n + ' correct · ' + pct(an.ok, an.n) + '%</h1><div class="ruled"></div>';

    h += '<p class="lede">On this sample, your multiple-choice performance projects to about <b>' + est + '</b> on the 400–600 scale (520 passes), assuming a mid-range written response. One question per skill is a rough read, so treat it as a starting line, not a verdict. The real value is below: exactly which skills and habits to fix first.</p>';
    if (kind === 'check' && S.diag && S.diag.done){
      const base = analyze(diagAtts('diag'));

    }
    h += '<div class="row" style="margin-bottom:18px"><button class="btn pri" data-act="tab" data-tab="today">Go to my study plan</button><a class="btn" href="#review-list">Review every question</a></div>';
  } else {
    h += '<h1 class="view-title">Pinpoint Report</h1><div class="ruled"></div><p class="lede">Built from your last ' + an.n + ' answers. Every wrong answer here was tagged with the reasoning error it represents, so you can see why you miss, not just what you missed.</p>';
  }

  // tutor's read
  const ins = insightsList(an, st, !!D);
  h += '<div class="card" style="margin-bottom:16px"><div class="eyebrow">The tutor\'s read</div><h3>What your answers say</h3>' + ins.map((x, i) => '<div class="insight"><span class="ix' + (x.red ? ' r' : '') + '">' + (i+1) + '</span><div>' + x.html + '</div></div>').join('') + '</div>';

function diagAtts(kind){
  const D = S[kind]; if (!D) return [];
  const ids = new Set(D.items); const first = {};
  S.att.forEach(a => { if (ids.has(a.q) && a.m === kind && !first[a.q]) first[a.q] = a; });

}
function trendBlock(){

}
function insightsList(an, st, isDiag){
  const out = [];
  const comps = COMPS.filter(c => an.comp[c.id] && an.comp[c.id].n >= 2).map(c => ({c, p: an.comp[c.id].ok / an.comp[c.id].n})).sort((a, b) => a.p - b.p);
  if (comps.length){ const w = comps[0], b = comps[comps.length-1];
    out.push({red: w.p < .7, html:'<b>Weakest area: ' + esc(w.c.name) + '</b> (' + Math.round(w.p*100) + '%, worth ' + w.c.weight + '% of the exam). ' + (b.c.id !== w.c.id ? 'Strongest: ' + esc(b.c.short) + ' (' + Math.round(b.p*100) + '%).' : '')}); }
  const traps = Object.entries(an.traps).filter(([k, v]) => v.chosen >= 2).sort((a, b) => b[1].chosen - a[1].chosen);
  if (traps.length){ const [k, v] = traps[0];
    out.push({red:true, html:'<b>Your #1 trap is "' + esc(TRAPS[k].label) + '."</b> You chose that kind of wrong answer ' + v.chosen + ' of the ' + v.offered + ' times it was offered. ' + esc(TRAPS[k].fix)}); }
  if (traps.length > 1){ const [k, v] = traps[1]; out.push({html:'<b>Runner-up trap: "' + esc(TRAPS[k].label) + '"</b> (' + v.chosen + '×). ' + esc(TRAPS[k].plain)}); }
  const kn = an.type.knowledge, ap = ['application','scenario','analysis'].reduce((t, k) => { const e = an.type[k]; if (e){ t.n += e.n; t.ok += e.ok; } return t; }, {n:0, ok:0});
  if (kn && kn.n >= 3 && ap.n >= 5){
    const dk = kn.ok/kn.n, da = ap.ok/ap.n;
    if (dk - da > .12) out.push({red:true, html:'<b>You know the terms but lose points applying them.</b> Recall: ' + Math.round(dk*100) + '% vs. classroom and analysis items: ' + Math.round(da*100) + '%. Most of the real exam is applied, so practice the 4-step question routine in the format lesson and favor drills over flashcards.'});
    else if (da - dk > .12) out.push({html:'<b>Your instincts are strong, but the vocabulary is shaky.</b> Scenarios: ' + Math.round(da*100) + '% vs. recall: ' + Math.round(dk*100) + '%. Ten minutes of flashcards a day will close this quickly.'});
  }
  const pairs = Object.entries(an.pairs).sort((a, b) => b[1].n - a[1].n).slice(0, 3);
  if (pairs.length) out.push({html:'<b>Specific mix-ups:</b> ' + pairs.map(([p]) => esc(p)).join(' · ') + '. Each one is a single fact to memorize, not a whole topic to restudy.'});
  if (an.conf.sn >= 2) out.push({red:true, html:'<b>' + an.conf.sn + ' confident misses</b> (' + pct(an.conf.sn, an.conf.sn + an.conf.so) + '% of your "sure" answers). These are misconceptions, the costliest kind of error because you won\'t double-check them. They\'re listed below.'});
  if (an.conf.uo >= 3) out.push({html:'<b>' + an.conf.uo + ' right answers were guesses.</b> That knowledge isn\'t locked in yet. Those skills will come back in smart practice until you\'re sure.'});
  const d1 = an.diff[1]; if (d1 && d1.n >= 4 && d1.ok/d1.n < .7) out.push({red:true, html:'<b>Foundational items are costing you</b> (' + pct(d1.ok, d1.n) + '% on the easiest tier). Read the lessons for your weakest skills before drilling harder questions.'});
  if (an.timed >= 8){ const avg = an.secs / an.timed; if (avg > 100) out.push({html:'<b>Pace: ' + Math.round(avg) + ' seconds per question.</b> The exam allows about 90 if you save 60 minutes for the written response. Use the Quick 15 timed sets.'}); else if (avg < 35 && an.ok/an.n < .75) out.push({html:'<b>You\'re moving fast (' + Math.round(avg) + 's per question)</b>, and some misses look like misreads. Slow down to the last sentence of each stem.'}); }
  if (isDiag){
    const top = priorities().filter(p => p.code[0] !== '7').slice(0, 3);
    out.push({html:'<b>Your study plan starts with:</b> ' + top.map(p => p.code + ' ' + esc(SKILL[p.code].name)).join(' · ') + '. The Today tab now builds each session around these.'});
  }
  if (!out.length) out.push({html:'Answer a few more questions and specific patterns will start to show here.'});
  return out;
}

function allCards(){
  const out = [];
  Object.values(LESSONS).forEach(L => (L.terms || []).forEach((t, i) => out.push({id:'t:' + L.skill + ':' + i, front:t.t, back:t.d, skill:L.skill})));
  if (GUIDE) (GUIDE.terms || []).forEach((t, i) => out.push({id:'t:g:' + i, front:t.t, back:t.d, skill:'7.1'}));
  const missed = new Set(S.att.filter(a => !a.ok).map(a => a.q));
  missed.forEach(id => { const q = QM[id]; if (q && q.key) out.push({id:'k:' + id, front:'Takeaway · ' + SKILL[q.skill].name, back:q.key, skill:q.skill, fromMiss:true}); });
  return out;
}
function dueCards(){ const t = todayNum(); return allCards().filter(c => { const s = S.cards[c.id]; return !s || s.d <= t; }); }
let FC = null;
VIEWS.cards = function(r){
  const all = allCards();
  if (!all.length) return '<h1 class="view-title">Flashcards</h1><div class="ruled"></div><div class="empty">Flashcards appear once the lessons are loaded.</div>';
  if (FC && FC.deck.length && FC.i < FC.deck.length){
    const c = FC.deck[FC.i];
    return '<div class="flash"><div class="row between" style="margin-bottom:12px"><span class="chip brand">' + esc(FC.label) + '</span><span class="mono small muted">' + (FC.i + 1) + ' / ' + FC.deck.length + '</span></div><button class="fcard" data-act="fc-flip" aria-live="polite">' + (FC.flip ? '<span class="tiny muted">' + esc(c.front) + '</span><span class="d">' + esc(c.back) + '</span>' : '<span class="t">' + esc(c.front) + '</span><span class="tiny muted">' + (c.skill ? esc(c.skill + ' · ' + SKILL[c.skill].name) : '') + ' · tap to flip</span>') + '</button>' +
      '<div class="row" style="justify-content:center;margin-top:16px">' + (FC.flip ? '<button class="btn lg" data-act="fc-grade" data-v="0">Again</button><button class="btn pri lg" data-act="fc-grade" data-v="1">Got it</button>' : '<button class="btn pri lg" data-act="fc-flip">Show answer</button>') + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm ghost" data-act="fc-end">End session</button></div></div>';
  }
  if (FC && FC.i >= FC.deck.length){ const n = FC.deck.length, g = FC.got; FC = null; return '<div class="flash"><h1 class="view-title">Deck done</h1><div class="ruled"></div><p class="lede">' + g + ' of ' + n + ' marked "got it." Cards you missed come back tomorrow.</p><button class="btn pri" data-act="tab" data-tab="cards">Back to decks</button></div>'; }
  const due = dueCards();
  const st = stats();
  let h = '<h1 class="view-title">Flashcards</h1><div class="ruled"></div><p class="lede">' + all.length + ' cards: every key term from the lessons, plus a takeaway card for each question you\'ve missed. "Got it" pushes a card out 1 → 3 → 7 → 16 → 35 days; "Again" brings it back tomorrow.</p>';
  h += '<div class="grid g3" style="margin-bottom:16px"><div class="card"><div class="eyebrow">Due now</div><h3>' + due.length + ' cards</h3><button class="btn pri" style="margin-top:10px" data-act="fc-start" data-deck="due"' + (due.length ? '' : ' disabled') + '>Study ' + Math.min(20, due.length) + '</button></div>' +
    '<div class="card"><div class="eyebrow red">From your misses</div><h3>' + all.filter(c => c.fromMiss).length + ' takeaways</h3><button class="btn" style="margin-top:10px" data-act="fc-start" data-deck="miss"' + (all.some(c => c.fromMiss) ? '' : ' disabled') + '>Study</button></div>' +
    '<div class="card"><div class="eyebrow">Weakest skills</div><h3>Terms from your top 3</h3><button class="btn" style="margin-top:10px" data-act="fc-start" data-deck="weak">Study</button></div></div>';
  h += '<div class="stack">' + COMPS.map(c => { const n = all.filter(x => x.skill && compOf(x.skill).id === c.id).length; return n ? '<div class="lrow card flat" style="padding:12px 14px"><div class="t"><span class="mono muted tiny">' + c.code + '</span> ' + esc(c.name) + ' <span class="tiny muted">' + n + ' cards</span></div><button class="btn sm" data-act="fc-start" data-deck="c' + c.id + '">Study deck</button></div>' : ''; }).join('') + '</div>';
  return h;
};
function startCards(deck){
  const all = allCards(); let list, label;
  if (deck === 'due'){ list = dueCards(); label = 'Due cards'; }
  else if (deck === 'miss'){ list = all.filter(c => c.fromMiss); label = 'Takeaways from misses'; }
  else if (deck === 'weak'){ const top = priorities().slice(0,3).map(p => p.code); list = all.filter(c => top.includes(c.skill)); label = 'Weakest skills'; }
  else { const id = +deck.slice(1); list = all.filter(c => c.skill && compOf(c.skill).id === id); label = COMPS[id-1].short; }
  FC = {deck: shuffle(list).slice(0, 20), i:0, flip:false, got:0, label};
  go('cards');
}

/* ============================== VIEW: settings ============================== */
VIEWS.settings = function(){
  const syncLine = Sync.on ? '<span class="chip good">On</span> Your progress is also saved to your Claude account, so it follows you across devices.' + (Sync.err ? ' <span class="small muted">(last sync issue: ' + esc(Sync.err) + ')</span>' : '') : '<span class="chip">Browser only</span> Progress is saved in this browser. Use the backup code below to move it or keep a copy.';
  let h = '<h1 class="view-title">Settings</h1><div class="ruled"></div><div class="stack">';
  h += '<div class="card"><h3>About you</h3><div class="row" style="margin-top:10px"><label class="small" for="nm">Name for greetings</label><input type="text" id="nm" value="' + esc(S.name) + '" placeholder="e.g., Mom"><label class="small" for="examDate2">Exam date</label><input type="date" id="examDate2" value="' + esc(S.examDate) + '"><button class="btn sm pri" data-act="save-me">Save</button></div></div>';
  h += '<div class="card"><h3>Where your progress lives</h3><p class="small" style="margin:8px 0">' + syncLine + '</p>' + (storageOK ? '' : '<p class="small" style="color:var(--bad)">This browser is blocking storage, so progress lasts only while this tab is open. Copy a backup code before closing.</p>') + '</div>';
  h += '<div class="card"><h3>Backup & restore</h3><p class="small muted" style="margin:6px 0 10px">Copy your backup code into a note or email to yourself. Paste it here on any device to restore your progress.</p><div class="row"><button class="btn" data-act="backup">Copy backup code</button></div><textarea class="notes" id="bk" style="margin-top:10px" placeholder="Paste a backup code here to restore"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="restore">Restore from code</button></div></div>';
  h += '<div class="card"><h3>Start over</h3><p class="small muted" style="margin:6px 0 10px">Erases every answer, exam, and written response.</p>' + (route.confirmReset ? '<div class="confirm"><b>Erase everything?</b> This can\'t be undone. <div class="row" style="margin-top:8px"><button class="btn danger sm" data-act="reset-yes">Yes, erase</button><button class="btn sm" data-act="tab" data-tab="settings">Cancel</button></div></div>' : '<button class="btn danger sm" data-act="reset">Reset all progress</button>') + '</div>';
  h += '<div class="card flat"><h3>About this simulator</h3><p class="small muted" style="margin-top:6px">Built around the published NYSTCE Field 116 design: 6 multiple-choice competencies (13–14% each, about 15 questions each) plus the Competency 0007 constructed response (20%), on a 195-minute clock with 520 to pass on the 400–600 scale. The questions are original practice items written to match the official competencies and question style; they are not actual exam questions. Score projections are estimates. NYSTCE doesn\'t publish a raw-to-scaled conversion, so aim for 75% or better on mock exams to give yourself a margin.</p><p class="tiny muted" style="margin-top:8px">' + Q.length + ' questions · ' + Object.keys(LESSONS).length + ' lessons · ' + SCEN.length + ' written tasks · ' + allCards().length + ' flashcards</p></div>';
  h += '</div>';
  return h;
};

/* ============================== events ============================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, d = el.dataset;
  switch (act){
    case 'tab': go(d.tab); break;
    case 'diag-start': startDiag('diag'); break;
    case 'check-start': if (S.check && S.check.done) go('insights', {diag:'check'}); else startDiag('check'); break;
    case 'go-diag-report': go('insights', {diag:d.kind}); break;
    case 'lesson': go('lesson', {skill:d.skill}); break;
    case 'mark-read': S.read[d.skill] = now(); save(); render(); toast('Marked as read'); break;
    case 'read-drill': S.read[d.skill] = now(); save(); startPlayer({mode:'drill', title:'Drill · ' + d.skill, qids:pickSkill(d.skill, 8), home:'learn'}); break;
    case 'drill': { const n = +(d.n || 8); startPlayer({mode:'drill', title:'Drill · ' + d.skill + ' ' + SKILL[d.skill].name, qids:pickSkill(d.skill, n)}); break; }
    case 'smart': startPlayer({mode:'practice', title:'Smart practice', qids:pickSmart(+d.n || 10)}); break;
    case 'review': startPlayer({mode:'review', title:'Missed-question review', qids:shuffle(dueReviews()).slice(0, 15), shuffle:true}); break;
    case 'quick': startPlayer({mode:'quick', title:'Quick 15 (timed)', qids:pickQuick(), feedback:false, limit:22.5*60000}); break;
    case 'trapdrill': startPlayer({mode:'drill', title:'Pattern drill · ' + TRAPS[d.code].label, qids:pickTrap(d.code, 10)}); break;
    case 'pref-fb': S.prefs.fb = d.v; save(true); render(); break;
    case 'pick': if (P && !P.revealed){ P.sel = +d.o; render(); } break;
    case 'strike': if (P){ const k = curQ().id + ':' + d.o; P.struck[k] = !P.struck[k]; if (P.struck[k] && P.sel === +d.o) P.sel = null; render(); } break;
    case 'submit': submitAnswer(+d.cf); break;
    case 'next': nextQ(); break;
    case 'quit': if (P && (P.mode === 'diag' || P.mode === 'check')){ P = null; go('today'); toast('Saved. Pick up where you left off anytime.'); } else if (P){ const answered = P.qids.filter(id => P.answers[id]); if (answered.length){ P.qids = answered; finishSet(); } else { P = null; go('practice'); } } break;
    case 'retry-missed': { const missed = P.qids.filter(id => P.answers[id] && !P.answers[id].ok); startPlayer({mode:'review', title:'Retry misses', qids:shuffle(missed), shuffle:true}); break; }
    case 'ask': askClaude(d.q); break;
    case 'save-date': { const v = $('#examDate').value; S.examDate = v; save(); render(); toast(v ? 'Exam date saved' : 'Exam date cleared'); break; }
    case 'save-me': S.name = $('#nm').value.trim().slice(0, 40); S.examDate = $('#examDate2').value; save(); toast('Saved'); render(); break;
    case 'exam': go('exam'); break;
    case 'exam-start': startExam(d.form); break;
    case 'exam-resume': openExam(); break;
    case 'exam-abandon': route.confirmAbandon = true; render(); break;
    case 'exam-abandon-yes': S.exam = null; save(); go('exam'); toast('Attempt discarded'); break;
    case 'exam-result': go('exam', {result:d.id}); break;
    case 'exam-filter': go('exam', {result:d.id, filter:d.v}); break;
    case 'x-pick': { const x = S.exam, id = x.qids[x.i]; x.ans[id] = +d.o; save(true); renderExam(); break; }
    case 'x-strike': { const x = S.exam, id = x.qids[x.i]; x.struck = x.struck || {}; const k = id + ':' + d.o; x.struck[k] = !x.struck[k]; if (x.struck[k] && x.ans[id] === +d.o) delete x.ans[id]; renderExam(); break; }
    case 'x-next': { const x = S.exam; x.view = 'q'; x.i = Math.min(x.i + 1, x.qids.length - (x.cr ? 0 : 1)); save(true); renderExam(); break; }
    case 'x-prev': { const x = S.exam; if (x.view === 'review'){ x.view = 'q'; } else x.i = Math.max(0, x.i - 1); renderExam(); break; }
    case 'x-flag': { const x = S.exam, id = x.qids[x.i]; x.flags[id] = !x.flags[id]; save(true); renderExam(); break; }
    case 'x-review': S.exam.view = 'review'; S.exam.confirmEnd = false; renderExam(); break;
    case 'x-goto': S.exam.view = 'q'; S.exam.i = +d.i; renderExam(); break;
    case 'x-submit': S.exam.confirmEnd = true; renderExam(); break;
    case 'x-submit-yes': submitExam(); break;
    case 'x-exit': closeExam(); go('exam'); toast('Exam saved. The clock is paused.'); break;
    case 'x-exh': case 'w-exh': {
      const prefix = act[0];
      const sc = prefix === 'x' ? SCM[S.exam.cr] : SCM[W.id];
      const i = +d.i; if (prefix === 'w') W.tab = i;
      const box = $('#' + prefix + '-exh'); box.innerHTML = '<b>' + esc(sc.exhibits[i].title) + '</b>\n\n' + richText(sc.exhibits[i].content);
      document.querySelectorAll('#' + prefix + '-exhtabs .btn').forEach((b, j) => b.classList.toggle('pri', j === i));
      break; }
    case 'ws-open': W = null; route = {tab:'write', ws:d.id}; render(); window.scrollTo(0,0); break;
    case 'ws-back': if (W && W.running){ W.base = wsElapsed(); W.running = false; } clearInterval(wsTimer); W = null; go('write'); break;
    case 'ws-timer': { if (W.running){ W.base = wsElapsed(); W.running = false; } else { W.running = true; W.since = now(); } const resp = $('#w-resp'), notes = $('#w-notes'); S.crDraft[W.id] = {text: resp ? resp.value : '', notes: notes ? notes.value : '', secs: W.base}; save(true); render(); break; }
    case 'ws-peek': W.peek = !W.peek; render(); break;
    case 'ws-submit': {
      const text = $('#w-resp').value, notes = $('#w-notes').value;
      if (words(text) < 20){ toast('Write a bit more before submitting'); break; }
      const secs = wsElapsed();
      S.cr.push({scen:W.id, text, notes, words:words(text), secs, t:now(), score:null, ai:null});
      delete S.crDraft[W.id]; W = null; clearInterval(wsTimer); save();
      route = {tab:'write', scored:S.cr.length - 1, crtab: CAP.sample ? 'ai' : 'self'}; render(); window.scrollTo(0,0);
      break; }
    case 'ws-last': { let idx = -1; S.cr.forEach((c, i) => { if (c.scen === d.id) idx = i; }); if (idx >= 0) go('write', {scored:idx}); break; }
    case 'crtab': route.crtab = d.v; render(); break;
    case 'cr-self': {
      const T = crTarget(d.key); if (!T) break;
      const c = +$('#rs-c').value, a = +$('#rs-a').value, dd = +$('#rs-d').value;
      T.set({c, a, d:dd, o:Math.round((c + a + dd) / 3), src:'self'});
      save(); route.crtab = 'model'; render(); toast('Score saved. Now compare with the model.');
      break; }
    case 'cr-ai': crAI(d.key); break;
    case 'fc-start': startCards(d.deck); break;
    case 'fc-flip': if (FC){ FC.flip = !FC.flip; render(); } break;
    case 'fc-grade': {
      const c = FC.deck[FC.i]; const cur = S.cards[c.id] || {b:-1};
      if (+d.v){ const b = Math.min(BOXES.length - 1, cur.b + 1); S.cards[c.id] = {b, d:todayNum() + BOXES[b], last:now()}; FC.got++; }
      else S.cards[c.id] = {b:-1, d:todayNum() + 1, last:now()};
      save(true); FC.i++; FC.flip = false; render(); break; }
    case 'fc-end': FC = null; go('cards'); break;
    case 'backup': {
      const code = JSON.stringify(S);
      const ta = $('#bk');
      const done = () => toast('Backup code copied. Paste it somewhere safe.');
      try { navigator.clipboard.writeText(code).then(done, () => { ta.value = code; ta.select(); toast('Select-all and copy the code shown'); }); }
      catch(err){ ta.value = code; ta.select(); toast('Select-all and copy the code shown'); }
      break; }
    case 'restore': {
      try { const obj = JSON.parse($('#bk').value.trim()); if (!obj || !Array.isArray(obj.att)) throw 0; S = normalize(obj); save(); _statsCache = null; render(); toast('Progress restored'); }
      catch(err){ toast('That code didn\'t work. Copy the whole thing and try again.'); }
      break; }
    case 'reset': route.confirmReset = true; render(); break;
    case 'reset-yes': S = blank(); save(); _statsCache = null; P = null; FC = null; go('today'); toast('All progress erased'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (!$('#exam').hidden && S.exam){
    const x = S.exam;
    if (x.view !== 'review' && x.i < x.qids.length){
      const k = e.key.toUpperCase(); const i = 'ABCD'.indexOf(k) >= 0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(e.key);
      if (i >= 0){ x.ans[x.qids[x.i]] = i; save(true); renderExam(); }
      if (e.key === 'ArrowRight' || e.key === 'Enter'){ x.i = Math.min(x.i + 1, x.qids.length - (x.cr ? 0 : 1)); renderExam(); }
      if (e.key === 'ArrowLeft'){ x.i = Math.max(0, x.i - 1); renderExam(); }
    }
    return;
  }
  if (route.tab === 'play' && P && !P.done){
    const ord = dispOrder(curQ().id);
    const k = e.key.toUpperCase(); let i = 'ABCD'.indexOf(k); if (i < 0) i = '1234'.indexOf(e.key);
    if (i >= 0 && !P.revealed){ P.sel = ord[i]; render(); }
    else if (e.key === 'Enter'){ if (P.revealed) nextQ(); else if (P.sel != null) submitAnswer(1); }
  } else if (route.tab === 'cards' && FC){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); FC.flip = !FC.flip; render(); }
  }
});

/* ============================== boot ============================== */
function boot(){
  if (S.exam && S.exam.view !== 'done'){ /* stay on tab; offer resume */ }
  render();
  Sync.init();
}
boot();
})();
