<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TESOL 116 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* Layout: a study desk — slim brand band with the 400–600 readiness scale, tabbed workspace below;
   exam mode swaps into a plain test-center frame. Motif: primary-writing-paper rules (blue lines, red dashed midline). */
:root{
  --paper:#F2F5F8; --card:#FFFFFF; --ink:#17212C; --muted:#5A6774; --line:#D8E0E7; --line2:#E8EDF2;
  --brand:#24557D; --brand-ink:#183D5B; --brand-soft:#E2EBF4; --on-brand:#FFFFFF;
  --band:#183D5B; --band-ink:#F2F7FB; --band-muted:#B9CCDD;
  --red:#C2453B; --red-soft:#F8E5E2;
  --manila:#F5EBCD; --manila-ink:#5B4818;
  --good:#2D7A4D; --good-soft:#E1F1E6; --warn:#A5680F; --warn-soft:#F8EDD7; --bad:#B4392F; --bad-soft:#F7E2DF;
  --l0:#AAB5C0; --l1:#C2453B; --l2:#CF7E27; --l3:#BF9A1E; --l4:#5B9B54; --l5:#2D7A4D;
  --shadow:0 1px 2px rgba(23,33,44,.06),0 6px 18px rgba(23,33,44,.06);
  --f-display:'Literata',Georgia,'Times New Roman',serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141A; --card:#16202A; --ink:#E3E9EF; --muted:#97A4B1; --line:#2A3643; --line2:#1F2A35;
  --brand:#88B7DF; --brand-ink:#B7D4EE; --brand-soft:#1C3246; --on-brand:#0E141A;
  --band:#112434; --band-ink:#E3ECF4; --band-muted:#8FA9C0;
  --red:#EE8176; --red-soft:#3A2321;
  --manila:#373019; --manila-ink:#EAD9A4;
  --good:#6CC291; --good-soft:#17342A; --warn:#E2AD58; --warn-soft:#382B15; --bad:#F08A80; --bad-soft:#3C2220;
  --l0:#4A5866; --l1:#E0675C; --l2:#E39A4C; --l3:#D6BA48; --l4:#7DBB74; --l5:#4FAE78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E141A; --card:#16202A; --ink:#E3E9EF; --muted:#97A4B1; --line:#2A3643; --line2:#1F2A35;
  --brand:#88B7DF; --brand-ink:#B7D4EE; --brand-soft:#1C3246; --on-brand:#0E141A;
  --band:#112434; --band-ink:#E3ECF4; --band-muted:#8FA9C0;
  --red:#EE8176; --red-soft:#3A2321;
  --manila:#373019; --manila-ink:#EAD9A4;
  --good:#6CC291; --good-soft:#17342A; --warn:#E2AD58; --warn-soft:#382B15; --bad:#F08A80; --bad-soft:#3C2220;
  --l0:#4A5866; --l1:#E0675C; --l2:#E39A4C; --l3:#D6BA48; --l4:#7DBB74; --l5:#4FAE78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tiny{font-size:.76rem}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* brand band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px 12px}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo b{font-family:var(--f-display);font-size:1.38rem;font-weight:700;letter-spacing:.01em}
.logo .ipa{font-family:var(--f-mono);font-size:.78rem;color:var(--band-muted)}
.logo .sub{display:block;font-size:.76rem;color:var(--band-muted);letter-spacing:.02em}
.scale{flex:1 1 300px;max-width:420px;min-width:0}
.scale .lbl{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted)}
.scale .track{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.14);margin:5px 0 3px}
.scale .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--band-ink);opacity:.9;transition:width .6s ease}
.scale .pass{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E9C46A;left:60%}
.scale .nums{display:flex;justify-content:space-between;font-size:.74rem;color:var(--band-muted)}
.scale .nums b{color:var(--band-ink);font-family:var(--f-mono)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:13px 12px 11px;font-weight:700;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:.7rem;line-height:18px;text-align:center}

main{padding-block:24px 96px}
.view-title{font-size:1.75rem}
.ruled{height:12px;max-width:200px;margin:8px 0 18px;opacity:.6;
  background:
   linear-gradient(var(--brand),var(--brand)) top/100% 1.5px no-repeat,
   repeating-linear-gradient(90deg,var(--red) 0 7px,transparent 7px 12px) center/100% 1.5px no-repeat,
   linear-gradient(var(--brand),var(--brand)) bottom/100% 1.5px no-repeat}
.lede{color:var(--muted);max-width:68ch;margin-bottom:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:1.12rem;margin-bottom:6px}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.eyebrow.red{color:var(--red)}
.hero-card{border-left:0;background:linear-gradient(0deg,var(--card),var(--card));position:relative;overflow:hidden}
.hero-card h2{font-size:1.45rem;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;font-size:.92rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.82rem;border-radius:8px}
.btn.lg{padding:14px 22px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--line2);color:var(--ink);white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--l0)}
.lv1 .d{background:var(--l1)} .lv2 .d{background:var(--l2)} .lv3 .d{background:var(--l3)} .lv4 .d{background:var(--l4)} .lv5 .d{background:var(--l5)}
.chip.trap{background:var(--red-soft);color:var(--red)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .c{font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}

/* level ladder legend */
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder span{flex:1 1 90px;font-size:.72rem;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--line2);border-top:4px solid var(--l0)}
.ladder .lv1{border-top-color:var(--l1)} .ladder .lv2{border-top-color:var(--l2)} .ladder .lv3{border-top-color:var(--l3)} .ladder .lv4{border-top-color:var(--l4)} .ladder .lv5{border-top-color:var(--l5)}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar .name{font-weight:700;font-size:.9rem;min-width:0}
.bar .val{font-family:var(--f-mono);font-size:.86rem}
.bar .track{grid-column:1/-1;height:9px;background:var(--line2);border-radius:99px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand)}
.bar .track .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35;left:75%}

/* skill map */
.skillmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sk{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l0);border-radius:10px;padding:9px 11px;min-width:0}
.sk:hover{border-color:var(--brand)}
.sk.lv1{border-left-color:var(--l1)} .sk.lv2{border-left-color:var(--l2)} .sk.lv3{border-left-color:var(--l3)} .sk.lv4{border-left-color:var(--l4)} .sk.lv5{border-left-color:var(--l5)}
.sk .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.sk .nm{font-weight:700;font-size:.86rem;line-height:1.3}
.sk .meta{font-size:.74rem;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--line2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plus{font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;color:var(--brand)}

/* player */
.player{max-width:780px;margin:0 auto}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.phead .prog{font-family:var(--f-mono);font-size:.86rem;color:var(--muted)}
.pbar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.stim{background:var(--manila);color:var(--manila-ink);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.stim .stim-h{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:6px;white-space:normal}
.stim table{margin:6px 0;background:rgba(255,255,255,.35);border-radius:6px;white-space:normal}
.stim th{background:rgba(0,0,0,.06);color:inherit}
.stim td,.stim th{border-bottom-color:rgba(0,0,0,.08)}
.stem{font-size:1.08rem;font-weight:700;margin-bottom:14px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:9px}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;line-height:1.45}
.opt:hover{border-color:var(--brand)}
.opt .ol{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--f-mono)}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ol{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt.struck .ot{text-decoration:line-through;opacity:.45}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .ol{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .ol{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.strike{flex:0 0 38px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--muted);font-size:.9rem}
.strike:hover{color:var(--red);border-color:var(--red)}
.strike.on{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.pfoot .hint{margin-right:auto;font-size:.78rem;color:var(--muted);align-self:center}
.fb{margin-top:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.fb .fbh{padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok .fbh{background:var(--good-soft);color:var(--good)}
.fb.no .fbh{background:var(--bad-soft);color:var(--bad)}
.fb .fbb{padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:.94rem}
.fb .yours{border-left:3px dashed var(--red);padding-left:12px}
.keyline{background:var(--manila);color:var(--manila-ink);border-radius:8px;padding:9px 12px;font-size:.9rem}
.keyline b{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
details.others summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--brand)}
details.others ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ai{border:1px dashed var(--brand);border-radius:10px;padding:12px 14px;background:var(--brand-soft);font-size:.92rem;white-space:pre-wrap}

/* lesson */
.lesson{max-width:72ch}
.lesson h2{font-size:1.6rem;margin-bottom:4px}
.lesson h3{font-size:1.15rem;margin:26px 0 8px}
.lesson p{margin:0 0 12px}
.lesson ul{margin:0 0 12px;padding-left:20px}
.lesson li{margin-bottom:5px}
.why{font-size:1rem;color:var(--muted);margin:6px 0 4px}
.traps{background:var(--red-soft);border-radius:12px;padding:14px 16px;margin:22px 0}
.traps h4{font-family:var(--f-body);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.traps ul{margin:0;padding-left:18px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:10px 0 20px}
.term{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:.88rem}
.term b{display:block;margin-bottom:2px}
.tip{border-left:4px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:16px 0}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary h3{font-size:1.05rem}
.acc[open]>summary{border-bottom:1px solid var(--line2)}
.acc .inner{padding:8px 10px 12px}
.lrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 8px;border-radius:8px}
.lrow:hover{background:var(--line2)}
.lrow .t{font-weight:700;font-size:.92rem;min-width:0}
.check{color:var(--good);font-weight:700}

/* flashcards */
.flash{max-width:560px;margin:0 auto}
.fcard{min-height:240px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;cursor:pointer;
  background-image:linear-gradient(transparent 0 calc(100% - 46px),var(--line2) calc(100% - 46px) calc(100% - 45px),transparent calc(100% - 45px))}
.fcard .t{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.fcard .d{font-size:1rem;max-width:44ch}

/* writing */
.cr-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cr-layout{grid-template-columns:1fr}}
.exh-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.exh{background:var(--manila);color:var(--manila-ink);border-radius:10px;padding:14px 16px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:62vh;overflow:auto}
.exh table{white-space:normal;background:rgba(255,255,255,.35)}
.exh th{background:rgba(0,0,0,.06);color:inherit}
textarea.resp{width:100%;min-height:360px;border:1.5px solid var(--line);border-radius:10px;padding:14px;background:var(--card);line-height:1.6;resize:vertical}
textarea.notes{width:100%;min-height:90px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:.9rem}
textarea:focus{outline:none;border-color:var(--brand)}
.wc{display:flex;gap:10px;align-items:center;font-size:.84rem}
.wc .meter{flex:1;height:7px;background:var(--line2);border-radius:99px;position:relative;overflow:hidden}
.wc .meter i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.wc .meter .z{position:absolute;top:0;bottom:0;left:57%;width:29%;background:var(--good-soft);opacity:.9}
.tasklist{margin:8px 0 0;padding-left:20px}
.tasklist li{margin-bottom:6px}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rubric label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.86rem}
.rubric select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.checks input{margin-top:4px;width:18px;height:18px;flex:0 0 18px}
.prose{white-space:pre-wrap;font-size:.93rem;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 13px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}

/* exam (test-center frame) */
#exam{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column}
.xbar{background:var(--band);color:var(--band-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.xbar .ttl{font-weight:700;font-size:.9rem;min-width:0}
.xbar .clock{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.xbar .clock.low{background:#B4392F;color:#fff}
.xbody{flex:1;overflow:auto;padding:22px 16px 30px}
.xinner{max-width:820px;margin:0 auto}
.xfoot{border-top:1px solid var(--line);background:var(--card);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.xfoot .grp{display:flex;gap:8px;flex-wrap:wrap}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.navgrid button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-family:var(--f-mono);font-size:.8rem;position:relative}
.navgrid button.ans{background:var(--brand-soft);border-color:var(--brand)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.navgrid button.cur{outline:2px solid var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* misc */
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.callout{border-radius:12px;padding:14px 16px;background:var(--brand-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.red{background:var(--red-soft)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.insight:last-child{border-bottom:0}
.insight .ix{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.insight .ix.r{background:var(--red-soft);color:var(--red)}
.trapcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
.trapcard:last-child{border-bottom:0}
.trapcard .rate{font-family:var(--f-mono);font-weight:600;text-align:right}
.trapcard .fix{grid-column:1/-1;font-size:.88rem;background:var(--line2);border-radius:8px;padding:8px 10px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad div{border-radius:10px;padding:12px;background:var(--line2)}
.quad .n{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.quad .bad{background:var(--bad-soft)}
.quad .good{background:var(--good-soft)}
.quad .warn{background:var(--warn-soft)}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.qitem .qs{font-weight:700;font-size:.92rem}
.qitem .qm{font-size:.84rem;color:var(--muted);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:st}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);flex-wrap:wrap}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);background:var(--brand-soft);color:var(--brand)}
.step.done .num{background:var(--good);color:#fff}
.step .body{flex:1 1 220px;min-width:0}
.step .body b{display:block}
.milestones{display:flex;gap:0;flex-wrap:wrap}
.ms{flex:1 1 120px;padding:10px 10px 10px 0;position:relative;font-size:.8rem}
.ms::before{content:"";display:block;height:4px;border-radius:99px;background:var(--line);margin-bottom:8px}
.ms.done::before{background:var(--good)}
.ms.now::before{background:var(--brand)}
.ms b{display:block;font-size:.84rem}
.spark{width:100%;height:60px}
.spark .ln{fill:none;stroke:var(--brand);stroke-width:2}
.spark .ar{fill:var(--brand-soft)}
.spark .pass{stroke:var(--red);stroke-dasharray:4 4;stroke-width:1}
.spark .pt{fill:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:14px 16px}
input[type=date],input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
@media (max-width:560px){
  html{font-size:16px}
  .view-title{font-size:1.45rem}
  .card{padding:16px}
  .pfoot .hint{display:none}
  .pfoot .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script type="application/json" id="bank">{"questions":[{"id":"4.5-01","skill":"4.5","type":"scenario","difficulty":2,"diag":1,"stem":"A grade 7 Integrated ENL/ELA class is starting a grade-level historical novel. Several Transitioning ELLs say the first chapter is “too hard” because of unfamiliar historical references and long, descriptive sentences. The co-teachers want these students to meet the grade-level standard for analyzing how the setting shapes the characters. Which plan would be most effective?","options":["Give the ELLs a leveled reader on the same theme, written at their independent reading level, so they can practice analyzing setting in a book they can read on their own.","Keep the novel; front-load key historical background and a few essential words, then guide rereading of short chunks with text-dependent questions and partner talk.","Have the ELLs listen to an audio recording of each chapter while following along in the book, and then answer the end-of-chapter questions independently.","Pre-teach every unfamiliar word in the chapter by giving students a list of dictionary definitions to study at home the night before each reading."],"answer":1,"why":"This plan amplifies rather than simplifies: students stay with the grade-level novel, and the teachers remove barriers instead of removing content. Front-loading historical background builds the schema the chapter assumes, a few essential words keep the vocabulary load manageable, and chunked rereading guided by text-dependent questions and partner talk sends students back to the text for evidence about setting. This is the Blueprint principle that instruction for ELLs is rigorous and grade-level.","traps":[{"code":"LOWER_RIGOR","note":"Swapping in an easier book removes the complex text the standard is about. The students lose access to grade-level language and ideas instead of getting help with them."},null,{"code":"PARTIAL","note":"Audio support helps with decoding and fluency, but it does not build the missing historical background or teach students to unpack the dense sentences, and answering alone gives them no interaction."},{"code":"ISOLATED","note":"A long list of dictionary definitions studied out of context overwhelms students and does not build the historical schema. Front-loading should be selective and tied to the text."}],"key":"Scaffold the complex grade-level text with background, chunking, text-dependent questions, and talk; don't replace it with an easier one."},{"id":"4.5-02","skill":"4.5","type":"analysis","difficulty":3,"diag":0,"stimulus":"Original sentence from a grade 8 class novel:\n“Despite the drought that had withered the crops, the farmers refused to abandon the land their families had worked for generations.”\n\nVersion 1:\n“There was no rain. The crops died. The farmers did not leave their land.”\n\nVersion 2:\n“Despite the drought (a long time with no rain) that had withered (dried up and killed) the crops, the farmers refused to abandon (leave forever) the land. Their families had worked that land for generations, so it was very important to them.”","stem":"An ENL teacher prepares two versions of a sentence from a grade-level novel for a group of Transitioning ELLs. Which of the following best evaluates the two versions?","options":["Version 1 is the stronger scaffold, because short, simple sentences lower the cognitive load and let students focus on the main idea of the passage.","Version 2 is a simplified text, because it splits the original sentence in two and therefore reduces the overall linguistic complexity for students.","Version 2 is an elaborated text: it keeps the original wording and structure but adds glosses and makes the implied reason explicit.","Version 1 suits Transitioning students best, and Version 2 should be saved for Expanding students who are ready to handle longer, denser text."],"answer":2,"why":"Walqui's principle “amplify, don't simplify” separates elaboration from simplification. An elaborated text keeps the original vocabulary and sentence structures and adds redundancy—glosses, paraphrases, explicit links—so students get comprehensible input and still meet the academic language they must learn. Version 1 strips out “despite,” “refused,” and the generational reason, so the very relationships a reader has to understand disappear.","traps":[{"code":"LOWER_RIGOR","note":"Simplification deletes the concessive connector “despite” and the farmers' reason for staying. Without those links the text can actually be harder to understand, and students never practice the academic structures."},{"code":"TERM","pair":"elaborated ↔ simplified text","note":"Version 2 keeps the full original sentence, including the relative clause and “despite.” It adds support rather than taking language away, which is what makes it elaborated."},null,{"code":"WRONG_LEVEL","note":"Transitioning students can work with authentic grade-level sentences when glosses and explicit links are added. Holding back the real language until Expanding delays access to the very structures they need."}],"key":"Elaborated (amplified) texts add support but keep the original language; simplified texts remove the academic language ELLs need."},{"id":"4.5-03","skill":"4.5","type":"application","difficulty":1,"diag":0,"stimulus":"Small-group transcript, grade 5 Integrated ENL/ELA (reciprocal teaching)\nAmina: I don't get “reluctantly” in this sentence. Let's look at the next part. It says he “dragged his feet” and “didn't want to go.” So maybe “reluctantly” means he did it, but he didn't want to.\nTeacher: How did you figure that out?\nAmina: I read the words around it.","stem":"In this exchange, Amina is primarily carrying out which reciprocal teaching strategy?","options":["Clarifying","Predicting","Questioning","Summarizing"],"answer":0,"why":"Reciprocal teaching (Palincsar & Brown) rotates four strategies: predicting, questioning, clarifying, and summarizing. Clarifying means noticing a comprehension breakdown—an unknown word or a confusing idea—and repairing it, as Amina does with context clues. For ELLs, the defined roles and modeled language give every student a clear reason and a way to talk about the text.","traps":[null,{"code":"TERM","pair":"clarifying ↔ predicting","note":"Predicting uses text clues to anticipate what will happen next. Amina is working out the meaning of a word already on the page, not forecasting events."},{"code":"TERM","pair":"clarifying ↔ questioning","note":"In reciprocal teaching, questioning means posing questions about the content for the group to answer. Saying “I don't get this word” and fixing it is a clarifying move."},{"code":"TERM","pair":"clarifying ↔ summarizing","note":"Summarizing restates the main ideas of a section in a few words. Amina focuses on one word's meaning, not on condensing the passage."}],"key":"Reciprocal teaching: predict, question, clarify, summarize. Clarifying repairs a breakdown such as an unknown word."},{"id":"4.5-04","skill":"4.5","type":"application","difficulty":1,"diag":0,"stimulus":"Teacher, reading aloud from a grade 6 article projected on the board:\n“‘The town's population dwindled after the factory closed.’ Hmm, I'm not sure what dwindled means. The factory closed, so people probably lost their jobs. Maybe they moved away. I think dwindled means got smaller. Let me keep reading to check… ‘Only a few hundred residents remained.’ Yes, that confirms it.”","stem":"The teacher's main purpose in this segment is most likely to:","options":["check whether students can define the word dwindled before they read the rest of the article on their own","pre-teach a Tier 3 content word that students will need in order to understand the article's main idea","model fluent oral reading so that students hear the correct pronunciation and phrasing of the article","make visible how a proficient reader notices confusion, uses context to repair it, and checks the guess"],"answer":3,"why":"A think-aloud makes invisible cognitive work visible: the teacher says out loud how she notices a problem, predicts a meaning from context, and confirms it with later text. For ELLs this turns comprehension monitoring (a CALLA metacognitive strategy) into something concrete they can imitate, and it gives them language for describing their own thinking. The next gradual-release step is for students to try the same moves with a partner.","traps":[{"code":"LITERAL","note":"The teacher, not the students, works through the word, so nothing is being checked. Focusing on the word itself misses that the lesson is about the process."},{"code":"TERM","pair":"Tier 2 ↔ Tier 3","note":"Dwindled is a Tier 2 word (general academic, used across contexts), not a Tier 3 content-specific term. And the teacher is modeling a strategy, not pre-teaching."},{"code":"PARTIAL","note":"Reading aloud does model fluency, but the deliberate pauses to reason about meaning show that the main purpose is modeling comprehension monitoring."},null],"key":"Think-alouds make a skilled reader's hidden comprehension strategies visible so students can imitate them."},{"id":"4.5-05","skill":"4.5","type":"application","difficulty":2,"diag":2,"stimulus":"Excerpt (grade 8 memoir):\n“For three winters my father worked the night shift and slept through the afternoons. We learned to whisper. We learned to close doors the way you might set down a sleeping baby. When he finally got a day job, the apartment seemed suddenly too loud, as if the walls themselves had forgotten how.”","stem":"A grade 8 Integrated ENL/ELA class will closely reread this excerpt. Which of the following is the best example of a text-dependent question?","options":["Has anyone in your family ever worked at night, and how did that change life in your home?","What kinds of jobs usually require a night shift, and why are those jobs important to a city?","What does comparing closing doors to setting down a sleeping baby suggest about the family?","What are three dictionary meanings of the word shift, and which meaning is the most common?"],"answer":2,"why":"A text-dependent question can be answered only with evidence from the text, so it sends students back to the author's words—the core of close reading in the Next Generation ELA Learning Standards. Asking what the “sleeping baby” comparison suggests requires students to analyze figurative language and infer the family's care for the father from specific lines. For ELLs, such questions are paired with rereading, partner talk, and frames such as “The author compares ___ to ___, which shows ___.”","traps":[{"code":"PARTIAL","note":"A personal connection can be a good warm-up, but students can answer it without reading the excerpt at all, so it is not text-dependent."},{"code":"LITERAL","note":"This question grabs the surface topic “night shift” and moves to general knowledge. It can be answered without the text and ignores the author's craft."},null,{"code":"ISOLATED","note":"Listing dictionary meanings is decontextualized word work. Close reading asks how words work in this passage, not what they mean in general."}],"key":"A text-dependent question cannot be answered without returning to evidence in the text."},{"id":"4.5-06","skill":"4.5","type":"application","difficulty":1,"diag":0,"stem":"Emerging ELLs in a grade 4 Integrated ENL/ELA class will read an informational article explaining how cutting down forests causes soil erosion, which in turn causes flooding downstream. Which graphic organizer would best support their comprehension of the text's structure?","options":["A cause-and-effect flow chart with arrows linking each event to its result","A Venn diagram comparing the features of forests and farmland in the region","A timeline showing the years when each area of the forest was cleared","A KWL chart listing what students know, want to know, and have learned"],"answer":0,"why":"Graphic organizers help ELLs most when they mirror the text's organizational structure. This article is a causal chain (deforestation → erosion → flooding), so a flow chart with arrows makes the logical relationships visible and supports oral or written retelling with signal words like “causes,” “leads to,” and “as a result.” Matching organizers to structures also teaches students to recognize text structures on their own.","traps":[null,{"code":"TERM","pair":"cause-effect ↔ compare-contrast","note":"A Venn diagram fits a compare-contrast text. This article explains a chain of causes and results, so a Venn diagram would not show its logic."},{"code":"TERM","pair":"cause-effect ↔ sequence","note":"A timeline shows when things happened. The article's key idea is why one event leads to another, which a timeline does not capture."},{"code":"PARTIAL","note":"A KWL chart activates background knowledge and sets a purpose, but it does not map the causal chain that students need in order to understand this text."}],"key":"Match the organizer to the text structure: cause-effect → flow chart; compare-contrast → Venn diagram; sequence → timeline."},{"id":"4.5-07","skill":"4.5","type":"scenario","difficulty":2,"diag":0,"stem":"A grade 10 ENL teacher is about to begin a grade-level novel set during the Dust Bowl of the 1930s. Her class includes recent arrivals from Yemen, Ecuador, and Uzbekistan who have strong home-language schooling but little knowledge of U.S. history. Which pre-reading activity would best build the background knowledge the novel requires?","options":["Deliver a detailed lecture on the economic causes of the Great Depression so that students have accurate historical information before they read.","Show photographs and a short video of the Dust Bowl, then have pairs discuss how drought or hard times affected people they know, adding ideas to a concept web.","Skip the historical context and begin reading right away, since the novel's central themes of family loyalty and survival are universal and familiar to all students.","Have students read an encyclopedia entry on the Dust Bowl independently and answer the comprehension questions before beginning the novel."],"answer":1,"why":"Schema theory holds that readers understand new text by connecting it to existing knowledge, which is why Building Background is a SIOP component. Visuals make the unfamiliar setting comprehensible without depending on English, and pair talk links that setting to students' own experiences—their funds of knowledge. The concept web then gives them a shared reference and key vocabulary to carry into the novel.","traps":[{"code":"PASSIVE","note":"A detailed lecture is one-way, language-heavy input with no visuals, interaction, or link to students' experiences, so recent arrivals are likely to understand little of it."},null,{"code":"PARTIAL","note":"Universal themes are a real bridge, but the plot depends on specific historical conditions. Without that background, students will misread events and characters' choices."},{"code":"WRONG_LEVEL","note":"An unsupported encyclopedia entry is a second dense text at the newcomers' frustration level. It adds reading load instead of building background in a comprehensible way."}],"key":"Before a text that assumes unfamiliar historical or cultural knowledge, build background with visuals, discussion, and links to students' lives."},{"id":"4.5-08","skill":"4.5","type":"scenario","difficulty":3,"diag":0,"stem":"A grade 3 Integrated ENL/ELA class includes four Entering ELLs whose home language is Bengali. A Bengali-speaking paraprofessional is available for 15 minutes just before and just after the ELA block, when the class will read a grade-level folktale in English. Which use of the paraprofessional would best support both comprehension and English development?","options":["During the lesson, she sits beside the students and translates each of the teacher's sentences into Bengali as the teacher reads aloud and explains the story.","During the ELA block, she takes the students to a separate room to read a Bengali folktale and answer comprehension questions about it in Bengali.","Before the lesson, she drills the students on English vocabulary flash cards with pictures, using words the teacher has selected from the folktale.","Before the lesson, she previews the story's main events in Bengali; the teacher teaches in English; afterward, she reviews the story with them in Bengali."],"answer":3,"why":"In the preview-view-review model, the home language frames an English lesson: the preview gives students the gist and key concepts so the English input becomes comprehensible, and the review consolidates and checks understanding. Unlike concurrent translation, it keeps students attending to English because they are not waiting for a sentence-by-sentence translation. It uses the home language as a resource, consistent with the Blueprint and Cummins's Common Underlying Proficiency.","traps":[{"code":"TERM","pair":"concurrent translation ↔ preview-view-review","note":"Concurrent translation feels supportive, but students learn to tune out the English and wait for the Bengali, so it does little for English development."},{"code":"EXCLUSION","note":"Pulling the students out during ELA removes them from the grade-level lesson and from English instruction instead of making that lesson accessible."},{"code":"PARTIAL","note":"Pre-teaching some vocabulary helps, but drilling English words ignores the paraprofessional's biggest asset, Bengali, which could build understanding of the whole story before the lesson."},null],"key":"Preview-view-review uses the home language before and after an English lesson; avoid sentence-by-sentence concurrent translation."},{"id":"4.5-09","skill":"4.5","type":"application","difficulty":2,"diag":0,"stem":"While choosing a short story for a grade 6 unit, an ELA teacher checks its Lexile measure and then reviews its structure, levels of meaning, and language features. The ENL co-teacher adds that the ELLs in the class have little background knowledge of the story's topic and that the planned task asks them to compare two characters' motives. The ENL teacher's comments address which dimension of text complexity?","options":["Reader and task considerations","Quantitative measures of the text","Qualitative measures of the text","Readability formula results"],"answer":0,"why":"The text complexity model used with the NYS standards has three dimensions: quantitative measures (Lexile, sentence length, word frequency), qualitative measures (structure, levels of meaning, language conventionality, knowledge demands), and reader and task considerations (these particular students' knowledge, language, and motivation, plus what the task asks them to do). The ENL teacher is weighing these readers and this task, which is where ESOL expertise usually points to the scaffolds a text will need rather than to rejecting it.","traps":[null,{"code":"TERM","pair":"quantitative ↔ reader-and-task","note":"Quantitative measures, such as the Lexile the ELA teacher already checked, are computed from word and sentence features. They say nothing about these students or this task."},{"code":"TERM","pair":"qualitative ↔ reader-and-task","note":"Qualitative measures describe features of the text itself, like structure and meaning, which the ELA teacher already reviewed. The ENL teacher is describing the readers and the task."},{"code":"TERM","pair":"readability formula ↔ reader-and-task","note":"Readability formulas are a kind of quantitative measure based on sentence and word length, not a separate dimension, and they ignore readers and tasks."}],"key":"Text complexity has three dimensions: quantitative, qualitative, and reader and task. ELLs' background and the assigned task fall under reader and task."},{"id":"4.5-10","skill":"4.5","type":"application","difficulty":1,"diag":0,"stimulus":"Before reading, mark each statement Agree or Disagree. Then discuss your choices with a partner.\n1. It is always wrong to break a promise.\n2. Young people should follow their parents' wishes even when they disagree.\n3. Being honest is more important than being kind.","stem":"A grade 9 ENL teacher gives students this sheet before they read a short story. The primary purpose of this activity is to:","options":["find out whether students understood the plot of the story after they have finished reading it on their own","determine each student's English reading level so that the teacher can assign appropriate texts for the unit","activate students' prior knowledge and opinions about the story's themes and give them a purpose for reading","pre-teach the academic vocabulary that students will encounter in the opening paragraphs of the story"],"answer":2,"why":"An anticipation guide is a pre-reading strategy: students take a position on theme-related statements, which activates their schema, sparks discussion, and gives them a reason to read—to see whether the story supports their views. After reading, students revisit the statements and cite evidence for any change in their thinking. Because the statements draw on life experience rather than prior reading, ELLs from any background can contribute.","traps":[{"code":"TERM","pair":"pre-reading ↔ post-reading","note":"The sheet is used before reading, so it cannot check plot comprehension. Revisiting it afterward is a follow-up, not its primary purpose."},{"code":"ASSESS_INVALID","note":"Agree/disagree opinions give no valid information about reading level. A reading-level decision needs an appropriate reading measure."},null,{"code":"LITERAL","note":"The statements present themes, not target vocabulary from the story, so this misreads what the activity is designed to do."}],"key":"Anticipation guides activate prior knowledge and set a purpose before reading; students revisit them with text evidence afterward."},{"id":"4.5-11","skill":"4.5","type":"scenario","difficulty":3,"diag":0,"stimulus":"Sentence from the grade 8 class text:\n“The settlers, who had been promised fertile land by agents who had never seen the territory, discovered that the soil was too rocky to farm.”","stem":"Expanding ELLs in a grade 8 class can define nearly every word in this sentence, yet in discussion they say that “the agents discovered the soil was rocky.” Which instructional response best addresses the source of their difficulty?","options":["Rewrite the text's long sentences as shorter, simpler sentences so that students can follow the meaning without having to untangle embedded clauses.","Assign a grammar workbook unit on relative clauses, with practice sentences unrelated to the novel, before students continue reading the text.","Pre-teach fertile, territory, and settlers with visuals and student-friendly definitions, and then have the students reread the paragraph.","Lead a sentence deconstruction: chunk the sentence into clauses, ask who did what in each chunk, and discuss which noun each “who” clause describes."],"answer":3,"why":"The misreading shows a syntactic breakdown: students cannot tell which noun each relative clause modifies or find the main subject and verb (“The settlers… discovered”). Sentence deconstruction, like Wong Fillmore's “juicy sentence” routine, teaches students to unpack dense academic sentences from the very text they are reading, which builds the skill rather than avoiding it. Knowing every word does not guarantee comprehension when complex syntax carries the meaning.","traps":[{"code":"LOWER_RIGOR","note":"Rewriting the sentences removes the syntax the students need to learn to read. Grade-level texts are full of such sentences, so avoiding them keeps the problem in place."},{"code":"ISOLATED","note":"Workbook drills on unrelated sentences rarely transfer. Students need to untangle relative clauses in the text they are actually reading."},{"code":"LITERAL","note":"The stem says students already know the words. The error is about who did what, a syntax problem, so more vocabulary work misses the evidence."},null],"key":"When ELLs know the words but still misread a sentence, deconstruct its syntax in context instead of simplifying it."},{"id":"4.5-12","skill":"4.5","type":"analysis","difficulty":2,"diag":0,"stimulus":"Reading data, grade 5 (grade-level fiction passage)\nStudent | Word accuracy | Oral reading rate | Retell (0–4) | Inferential questions\nSofia (Expanding, home language Spanish, 4th year of ENL services) | 98% | At grade-level benchmark | 1 | 1 of 5 correct\nTeacher note: Sofia's retell lists details from the first paragraph only. She could not explain why the main character changed her mind.","stem":"Which conclusion and next step are best supported by these data?","options":["Sofia needs more phonics and decoding practice, because accurate word reading is the foundation that her comprehension depends on.","Sofia decodes well but needs comprehension instruction: vocabulary and background building, plus modeled inference and retelling strategies.","Sofia should be referred for a special education evaluation, because a fluent reader who cannot comprehend text may have a learning disability.","Sofia should move to texts two grade levels lower so that she can practice comprehension strategies with easier and shorter material."],"answer":1,"why":"Ninety-eight percent accuracy at a grade-level rate, combined with a weak retell and missed inferences, shows that decoding is not the problem; comprehension is. This pattern is common in ELLs whose decoding and conversational English (BICS) outpace academic vocabulary, background knowledge, and inferencing (CALP). Explicit comprehension instruction with grade-level text—think-alouds, story maps, inference frames—targets the actual need.","traps":[{"code":"LITERAL","note":"The data show 98% accuracy at benchmark rate, so decoding is a strength. This answer ignores the key evidence, which is the weak retell and inferencing."},null,{"code":"MISREFERRAL","note":"A comprehension gap in a developing ELL is typical of academic language still being acquired. Targeted instruction and progress monitoring come first, not a referral based on one data point."},{"code":"LOWER_RIGOR","note":"Sofia reads grade-level text accurately. Moving her to easier texts lowers expectations instead of teaching the comprehension strategies she needs for grade-level work."}],"key":"Fluent, accurate decoding with a weak retell signals a comprehension need, not a phonics need or a disability."},{"id":"4.5-13","skill":"4.5","type":"scenario","difficulty":2,"diag":0,"stem":"Dilnoza, a grade 4 Entering ELL who arrived from Uzbekistan two months ago, reads and writes fluently in Uzbek. Her Integrated ENL/ELA class is reading a grade-level informational text about the water cycle and will then explain the process in writing. Which plan best gives Dilnoza meaningful access to this lesson?","options":["Preview the concept through an Uzbek-language video or text, then have her label a water-cycle diagram from a word bank and explain it to a partner using a frame.","Have her work through an English alphabet and phonics workbook at a side table until she knows enough English to take a full part in the class's reading lessons.","Give her the same text and writing prompt as her classmates, without changes, on the expectation that she will acquire English through daily exposure.","Give her a kindergarten picture book about the weather so that she can read a text written at her current English level while the class reads."],"answer":0,"why":"Entering students can work with grade-level concepts when the language load is heavily scaffolded. A home-language preview draws on Dilnoza's strong Uzbek literacy (Cummins's Common Underlying Proficiency), so the concept transfers; the labeled diagram, word bank, and frame let her produce English at an Entering level while she thinks about the same content as her peers. This matches the NLAP pattern of substantial support at Entering, not a separate curriculum.","traps":[null,{"code":"EXCLUSION","note":"Isolating her with a phonics workbook removes her from grade-level content until she is “ready.” She can learn the concept now with scaffolds."},{"code":"ONE_SIZE","note":"Unmodified grade-level input is not comprehensible at Entering. Exposure without scaffolds ignores her proficiency level and leaves her unable to participate."},{"code":"LOWER_RIGOR","note":"A kindergarten weather book replaces the grade-level concept with much simpler content and underestimates a literate fourth grader."}],"key":"At Entering, keep grade-level content and add heavy scaffolds: home-language preview, visuals, word banks, frames, and partner talk."},{"id":"4.5-14","skill":"4.5","type":"application","difficulty":3,"diag":0,"stimulus":"Passage: “Lena counted the coins in her jar again: still four dollars short. She looked at the bike in the shop window, then at the Help Wanted sign taped beside it.”\nQuestion: “What will Lena probably do next, and what clues support your answer?”","stem":"A teacher is using the Question-Answer Relationship (QAR) framework with Transitioning ELLs. How should the class classify this question?","options":["Right There, because the words needed to answer it are stated directly in one sentence of the passage","Think and Search, because the reader must put together information from more than one sentence","Author and Me, because the reader combines clues in the text with his or her own knowledge","On My Own, because the reader can answer it from experience without needing to read the passage"],"answer":2,"why":"Raphael's QAR framework sorts questions by where the answer comes from: In the Book (Right There; Think and Search) or In My Head (Author and Me; On My Own). Predicting Lena's next step requires combining text clues—four dollars short, a Help Wanted sign—with background knowledge about earning money, so it is Author and Me. Teaching ELLs to classify questions shows them where to look for an answer and when they are expected to infer.","traps":[{"code":"TERM","pair":"Right There ↔ Author and Me","note":"The passage never states what Lena will do, so the answer cannot be found in a single sentence."},{"code":"TERM","pair":"Think and Search ↔ Author and Me","note":"Think and Search answers are in the text, spread across sentences. Here the clues are in the text, but the answer itself (taking a job) must come from the reader's knowledge."},null,{"code":"TERM","pair":"On My Own ↔ Author and Me","note":"The question requires the text clues (four dollars short, the sign). An On My Own question could be answered without reading at all."}],"key":"QAR: Right There and Think and Search are in the text; Author and Me combines text and reader knowledge; On My Own uses reader knowledge."},{"id":"4.6-01","skill":"4.6","type":"analysis","difficulty":2,"diag":1,"stimulus":"Writing sample (grade 4, Transitioning, home language Spanish; personal narrative):\n“Last winter my family go to the mountains in Pennsylvania. First we drive four hours. Is very cold and is snow everywhere. Then my cousin and me make a big snowman. At the end of the day we was tired but very happy. I want to go again next year!”","stem":"Which of the following best describes a strength and a priority need shown in this sample?","options":["Strength: varied complex sentences with embedded clauses; need: organizing the events of the story in a clear, logical order","Strength: a clear, time-ordered sequence of events; need: more vivid descriptive details and dialogue to develop the story","Strength: a clear, time-ordered sequence with transitions; need: consistent past-tense verbs and stated subjects, as in “It is very cold”","Strength: a willingness to take risks writing in English; need: an evaluation for a language disorder, given the many repeated grammar errors"],"answer":2,"why":"The sample shows real narrative competence: a time-ordered sequence signaled by “Last winter,” “First,” “Then,” and “At the end of the day,” plus a closing reflection. The most pervasive need is past-tense marking (go, drive, make, was), and “Is very cold” shows a dropped subject consistent with Spanish, which allows subjects to be omitted (“Está nevando” = “It is snowing”). Strong analysis names an asset to build on and a patterned, teachable need—the same thinking the constructed response requires.","traps":[{"code":"LITERAL","note":"This reverses the evidence. The sentences are mostly short and simple, and the sequence of events is already one of the clearest strengths."},{"code":"PARTIAL","note":"The strength is accurate and details would enrich the story, but the need overlooks the verb-tense pattern that runs through every sentence, which is the priority for a Transitioning writer."},null,{"code":"MISREFERRAL","note":"The errors are systematic and typical of second-language development, partly shaped by Spanish. Nothing in the sample suggests a language disorder."}],"key":"Analyze ELL writing for an asset (such as organization) and a patterned, teachable need (such as past-tense marking), not for every error."},{"id":"4.6-02","skill":"4.6","type":"scenario","difficulty":2,"diag":2,"stimulus":"Dialogue journal entry (grade 6, Emerging, home language Haitian Creole):\n“Yesterday I go to my aunt house in Brooklyn. She make diri ak djon djon for my birthday. Is my favorite food. I am very happy.”","stem":"Which teacher reply in the journal best fits the purpose of a dialogue journal?","options":["“Happy birthday! Your aunt made diri ak djon djon for you? What a special gift. My sister made my favorite soup when I went to her house. What do you like best about the rice?”","“Good effort! Remember to write ‘Yesterday I went,’ ‘She made,’ and ‘It is.’ Please rewrite your entry using the correct past-tense verbs and bring it back to me tomorrow morning.”","“Great job! I can tell that you worked hard on your journal this week. Keep it up, and remember to write at least five complete sentences in your next entry.”","“What a fabulous shindig! It sounds like your aunt really went all out and pulled out all the stops to make your big day one to remember forever!”"],"answer":0,"why":"A dialogue journal is a private written conversation: the teacher responds to the student's message, not to the errors. The best reply shows genuine interest, stays on the student's topic, naturally models the target forms (“made,” “went”) at a level just beyond the student's own (i+1), and asks a question that invites the student to keep writing. Over time students notice and adopt the modeled forms without the anxiety that red-pen correction can create.","traps":[null,{"code":"OVERCORRECT","note":"Turning the journal into a rewrite assignment makes it about form rather than communication, which raises the affective filter and discourages the student from writing freely."},{"code":"PARTIAL","note":"The reply is encouraging, but it ignores what the student said, models no language, and asks no question, so the written conversation stops."},{"code":"WRONG_LEVEL","note":"Idioms such as “went all out” and “pulled out all the stops” are far beyond an Emerging reader. A journal reply should model language just above the student's level."}],"key":"In dialogue journals, respond to meaning, model correct forms naturally, and ask a question. Don't correct the errors."},{"id":"4.6-03","skill":"4.6","type":"application","difficulty":2,"diag":0,"stem":"In a grade 1 Integrated ENL class, the teacher and students compose a thank-you note to the school custodian on chart paper. Students suggest each sentence and the group rereads it aloud. Students take turns coming to the chart to write letters and words they know, while the teacher writes the rest and briefly teaches spacing and capital letters. This approach is best described as:","options":["shared writing","the Language Experience Approach","guided writing","interactive writing"],"answer":3,"why":"Interactive writing is “sharing the pen”: teacher and students compose the message together, students physically write the parts within their reach, and the teacher writes the rest while teaching conventions at the point of need. For young ELLs it connects oral language to print in a meaningful group text that the class rereads many times. On the gradual-release continuum it sits between shared writing (the teacher scribes) and guided or independent writing.","traps":[{"code":"TERM","pair":"interactive writing ↔ shared writing","note":"In shared writing the teacher holds the pen and scribes the group's ideas. Here the students take turns writing on the chart themselves."},{"code":"TERM","pair":"interactive writing ↔ Language Experience Approach","note":"In the LEA, students dictate an account of a shared experience and the teacher writes their words to create a reading text. Students do not share the pen."},{"code":"TERM","pair":"interactive writing ↔ guided writing","note":"In guided writing, each student writes his or her own piece in a small group while the teacher coaches. This scenario is one whole-class text."},null],"key":"Interactive writing: teacher and students share the pen. Shared writing: the teacher scribes the group's ideas."},{"id":"4.6-04","skill":"4.6","type":"scenario","difficulty":2,"diag":0,"stem":"Grade 8 Expanding ELLs write argument essays that state a clear claim and give reasons, but none of the essays acknowledges or responds to an opposing view. Which next step would best help students develop this element of argument writing?","options":["Add a counterclaim row to the essay rubric and return the drafts with a lower score in that category so that students can clearly see what is missing.","Assign a worksheet on contrast transitions such as however, although, and on the other hand, using practice sentences unrelated to the students' essays.","Give each student a complete model essay to copy into a notebook so that students become familiar with the format of a strong argument.","Have students study a mentor essay to see how the writer introduces and rebuts a counterclaim, chart its language, and try those moves in their drafts."],"answer":3,"why":"Mentor texts let students read like writers: they notice how a skilled writer handles one specific move—here, acknowledging and rebutting a counterclaim—and then try that move in their own work. For ELLs, naming the move and charting its language (“Some people argue that…; however, the evidence shows…”) makes both the rhetorical purpose and the forms explicit. This connects reading and writing within the grade-level genre.","traps":[{"code":"PARTIAL","note":"A rubric row clarifies the expectation, but it doesn't teach students how to write a counterclaim. Lowering the score without instruction just labels the gap."},{"code":"ISOLATED","note":"Practicing transitions in unrelated sentences is decontextualized. Students need to see how those words do rhetorical work inside an argument."},{"code":"PASSIVE","note":"Copying a model involves no analysis and none of the students' own reasoning. Mentor texts are studied and emulated, not transcribed."},null],"key":"Use mentor texts to make a specific writing move and its language visible, then have students apply it to their own drafts."},{"id":"4.6-05","skill":"4.6","type":"analysis","difficulty":1,"diag":0,"stimulus":"Writing sample (grade 5, Transitioning, home language Bengali):\n“My grandmother lives in Dhaka. She is old. She is very kind. She tells stories. The stories are about her village. I miss her.”","stem":"Which instructional focus would best help this student develop more mature sentences?","options":["Sentence combining with the student's own sentences, using adjectives, and, who, or that to join ideas","Instruction in subject-verb agreement, since agreement errors are the main problem shown in this sample","A rule that every sentence must contain at least fifteen words, so that the student's sentences get longer","Diagramming practice sentences from a grammar textbook to label each subject and each predicate"],"answer":0,"why":"The sample is grammatically accurate but made of short, repetitive simple sentences, a common stage as writers gain control. Sentence combining teaches students to merge related ideas with adjectives, conjunctions, and relative clauses (“My kind, elderly grandmother, who lives in Dhaka, tells stories about her village”), building syntactic complexity in meaningful context. Working from the student's own sentences keeps the practice authentic and shows how combining changes emphasis and flow.","traps":[null,{"code":"LITERAL","note":"There are no agreement errors here (“She is,” “She tells” are correct). This option doesn't match the evidence in the sample."},{"code":"PARTIAL","note":"It targets the right symptom, short sentences, but gives the student no strategy. Arbitrary length rules tend to produce run-ons rather than well-built complex sentences."},{"code":"ISOLATED","note":"Labeling parts of textbook sentences is decontextualized analysis. It does not teach the student to build longer sentences in her own writing."}],"key":"Choppy but accurate simple sentences call for sentence combining, using the student's own writing."},{"id":"4.6-06","skill":"4.6","type":"analysis","difficulty":3,"diag":0,"stimulus":"Excerpt from an essay by a grade 10 Expanding ELL (prompt: “Should students be required to do community service?”):\n“There is a saying in my family: a tree is known by its fruit. Since ancient times, people have helped their neighbors in many ways. In my grandfather's village, everyone repaired the well together… [three more paragraphs of stories and examples] …Therefore, I believe that service should be part of every student's education.”\n\nIn a writing conference, the student explains: “In my old school, we learned not to say your opinion at the beginning. You lead the reader to it.”","stem":"Which interpretation of the essay's organization is most appropriate?","options":["The essay shows that the student has not yet developed the ability to think logically and to organize ideas in any language.","The pattern is typical of all writers from the student's language background, so the teacher can expect it from those students.","The organization likely reflects conventions from the student's prior schooling; the teacher should contrast it explicitly with the U.S. early-thesis norm.","The teacher should accept the organization without comment, since asking the student to change it would devalue the student's home culture and identity."],"answer":2,"why":"Contrastive rhetoric (Kaplan; now often called intercultural rhetoric) holds that writers may carry organizational conventions from prior schooling, such as opening with a proverb or delaying the main point. The asset-based response treats this as a different, learned convention rather than a deficit, and teaches the U.S. academic expectation of an early, explicit thesis as an added option, for example by comparing the two structures side by side. The student's own explanation is the evidence; the pattern should not be generalized to a whole language group.","traps":[{"code":"DEFICIT","note":"The essay has a deliberate, coherent structure that the student can explain. It reflects a different convention, not an inability to think logically."},{"code":"STEREOTYPE","note":"Contrastive rhetoric has been criticized for exactly this kind of overgeneralization. Writers vary, and the evidence here is one student's own account."},null,{"code":"LOWER_RIGOR","note":"Withholding the conventions the student will be judged on, such as on the Regents exam, lowers expectations. Adding a new convention does not erase the old one."}],"key":"Unfamiliar essay organization may reflect learned rhetorical conventions; teach the U.S. academic structure explicitly without treating it as a deficit."},{"id":"4.6-07","skill":"4.6","type":"application","difficulty":1,"diag":0,"stem":"During a peer conference in a grade 7 Integrated ENL/ELA class, partners use a checklist that asks: “Does the opening grab the reader's attention? Is any part confusing? Where could the writer add an example?” In which stage of the writing process are the students working?","options":["Prewriting","Revising","Editing","Publishing"],"answer":1,"why":"Revising improves the content, organization, and clarity of a draft: strengthening an opening, clearing up confusing parts, adding examples. Editing fixes conventions such as spelling, punctuation, and grammar. Keeping the two separate matters for ELLs, because when feedback jumps straight to grammar, students can conclude that writing is about avoiding errors rather than communicating ideas. Checklists with question stems also give ELLs the language to give peer feedback.","traps":[{"code":"TERM","pair":"prewriting ↔ revising","note":"Prewriting generates and organizes ideas before drafting. These questions assume a draft already exists."},null,{"code":"TERM","pair":"revising ↔ editing","note":"Editing focuses on conventions such as spelling, punctuation, and grammar. These questions are about content and clarity."},{"code":"TERM","pair":"publishing ↔ revising","note":"Publishing means sharing a finished piece with an audience. The checklist is still improving the draft."}],"key":"Revising improves content, organization, and clarity; editing corrects conventions (spelling, punctuation, grammar)."},{"id":"4.6-08","skill":"4.6","type":"scenario","difficulty":2,"diag":0,"stimulus":"Paragraph from a grade 9 Transitioning ELL's response to a short story (home language Russian):\n“In the story, the main character is very brave person. She goes to the forest alone for find her brother. When she sees the wolf, she is not run away. This shows that she loves the brother more than she is afraid.”","stem":"The teacher notes that the student's claim is well supported by evidence from the story. Which approach to written feedback would be most effective?","options":["Mark every grammatical error in red and write the correct form above each one so that the student can see all of the mistakes at once.","Praise the well-supported claim, then mark two examples of one pattern, such as missing articles, and have the student find and fix the rest.","Comment only on the ideas and avoid mentioning grammar at all, since any attention to language form will discourage the student from writing more.","Rewrite the paragraph in correct English and ask the student to copy the corrected version neatly into the final draft of the response."],"answer":1,"why":"Second-language writing research and practice favor focused (selective) corrective feedback: addressing one or two frequent, patterned errors rather than marking everything. Missing articles are a systematic pattern here, consistent with transfer from Russian, which has no articles. Pairing praise for the strong ideas with a limited self-correction task builds noticing and responsibility without overwhelming the writer.","traps":[{"code":"OVERCORRECT","note":"Marking every error buries the strong ideas, overwhelms the student, and gives no priority. The student can't tell which pattern matters most."},null,{"code":"PARTIAL","note":"Meaning comes first, but a Transitioning high school writer benefits from focused feedback on patterned errors. Ignoring form entirely can let errors fossilize."},{"code":"PASSIVE","note":"Copying the teacher's correct version requires no noticing or problem solving by the student, so little is learned."}],"key":"Give focused feedback: praise the ideas, target one or two patterned errors, and have the student self-correct."},{"id":"4.6-09","skill":"4.6","type":"scenario","difficulty":3,"diag":0,"stem":"An ENL teacher uses the teaching-learning cycle of genre-based pedagogy to teach grade 6 Transitioning ELLs to write scientific explanations. Students have built knowledge of the topic through hands-on investigation and have analyzed a model explanation to identify its stages and language features. Which step should come next?","options":["Students independently write their own explanations, using the model text and a rubric as references while they draft.","Students analyze two more model explanations so that they are thoroughly familiar with the genre before writing anything.","The teacher and class write a new explanation together, the teacher guiding structure and language as students contribute ideas.","The teacher reviews the rules for the present tense and the passive voice through a series of sentence-level grammar practice exercises."],"answer":2,"why":"The teaching-learning cycle (associated with Rothery, Derewianka, and Gibbons) moves through building the field, deconstruction of a model text, joint construction, and independent construction. Joint construction is the bridge: the teacher shapes the text and thinks aloud about choices while students contribute, so they practice the genre's structure and language with support before writing alone. It is the writing version of gradual release, “we do” before “you do.”","traps":[{"code":"WRONG_LEVEL","note":"This skips the supported step and expects independent performance too early. Transitioning writers need guided practice with the genre first."},{"code":"PARTIAL","note":"More models can help, but students have already deconstructed one. What they need now is supported practice producing the genre, not more analysis."},null,{"code":"ISOLATED","note":"Sentence-level grammar drills pull the language out of the genre. In genre pedagogy, grammar is taught as it functions within the text being written."}],"key":"Genre cycle: build the field → deconstruct a model → joint construction → independent construction."},{"id":"4.6-10","skill":"4.6","type":"analysis","difficulty":2,"diag":0,"stimulus":"Writing sample (grade 6, Transitioning, home language Mandarin; recount):\n“Last Saturday my father take me to the library. We borrow three book about animal. I read one book on the train. It is about a panda who lose her baby. At the end the panda find baby and I feel happy.”","stem":"Which conclusion about this student's writing is best supported by the sample?","options":["The student consistently omits past-tense and plural endings, a pattern consistent with Mandarin, which does not use word endings for tense or plurals.","The errors are random slips that the student will correct easily once reminded to proofread the recount carefully before turning it in for a grade.","The student's limited English vocabulary prevents him from describing the events of the recount clearly and in a logical order.","The repeated grammatical omissions suggest a language-based learning disability that should be formally evaluated by the school's evaluation team."],"answer":0,"why":"Every past-tense verb (take, borrow, lose, find, feel) and the plurals “book” and “animal” lack endings, which makes this a systematic error pattern rather than random mistakes (Corder's error/mistake distinction). Mandarin expresses time with time words and particles rather than verb endings and does not require plural marking on nouns, so negative transfer is a likely contributor. The sample also shows strengths—clear sequence and accurate content vocabulary—so instruction can target inflectional endings in the student's own recounts.","traps":[null,{"code":"TERM","pair":"error ↔ mistake","note":"Corder distinguished errors (systematic gaps in the learner's current system) from mistakes (occasional slips). A pattern this consistent is an error, so a proofreading reminder won't fix it."},{"code":"LITERAL","note":"The vocabulary is accurate (library, borrow, panda) and the events are in order. The problem is word endings, not word knowledge."},{"code":"MISREFERRAL","note":"Systematic omission of endings is a normal, often L1-influenced stage of second-language development. It is not evidence of a disability."}],"key":"Systematic omission of tense and plural endings is a patterned error, often influenced by Mandarin. Teach the forms; don't refer."},{"id":"4.6-11","skill":"4.6","type":"analysis","difficulty":1,"diag":0,"stimulus":"Writing sample (grade 2, Emerging, home language Spanish; written under a drawing of her family at a table):\n“I laik mai famili. Mai mamá cook arroz an beans. On Sonday we go to the parke.”","stem":"Which statement best describes what this sample shows?","options":["The student has a spelling disability and should receive intensive intervention in English letter-sound correspondences.","The student is applying Spanish sound-spelling knowledge to English words and using home-language words to convey meaning.","The student is confusing her two languages and should be told to write only in English to avoid further interference from Spanish.","The student's spelling shows that she has not yet learned that letters represent the sounds in spoken words."],"answer":1,"why":"Spellings like “laik,” “mai,” “famili,” and “parke” map English sounds onto Spanish letter-sound patterns (Spanish spells the /aɪ/ sound “ai” and the /i/ sound “i”), which shows solid phonemic awareness and positive transfer of alphabetic knowledge. Writing “arroz” is translanguaging: she uses her full repertoire to keep communicating. The next step is to build on this by explicitly contrasting English and Spanish spelling patterns, not to treat the sample as a deficit.","traps":[{"code":"MISREFERRAL","note":"The spellings are systematic and logical according to Spanish phonics. That is evidence of transfer, not of a disability."},null,{"code":"DEFICIT","note":"Using Spanish spelling patterns and words is a resource. Banning the home language treats a normal bilingual strategy as a problem."},{"code":"LITERAL","note":"The opposite is true: she represents nearly every sound with a letter. She just uses Spanish letter-sound rules to do it."}],"key":"Invented spellings that follow home-language sound-letter rules show phonemic awareness and positive transfer, not a disability."},{"id":"4.6-12","skill":"4.6","type":"scenar
