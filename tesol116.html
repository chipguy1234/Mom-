io","difficulty":2,"diag":0,"stem":"A grade 6 Integrated ENL/ELA class will write an opinion paragraph on whether the school should adopt uniforms. The ELLs in the class are at the Entering, Transitioning, and Expanding levels. Which plan best differentiates writing support by proficiency level?","options":["All ELLs use the same paragraph frame and word bank, so that every student receives an equal amount of support during the task","Entering students copy the teacher's model paragraph, Transitioning students complete a cloze worksheet, and Expanding students write the paragraph on their own","Entering students write independently to build confidence, Transitioning students use frames, and Expanding students get a partly completed paragraph","Entering: illustrated organizer, word bank, frames, and home-language brainstorming; Transitioning: paragraph frame; Expanding: mentor paragraph and checklist"],"answer":3,"why":"The NLAP describe the same grade-level standard at every proficiency level, with scaffolding that decreases from substantial support at Entering toward independence at Commanding. Entering writers need visuals, word banks, frames, and home-language planning to express an opinion; Transitioning writers can handle connected sentences with a paragraph frame; Expanding writers benefit from a mentor text and a self-check list that push toward independence. Every student still writes an opinion with reasons—the target stays the same while the support changes.","traps":[{"code":"ONE_SIZE","note":"Identical support ignores proficiency differences. The frame will overwhelm Entering students and hold back Expanding students."},{"code":"PASSIVE","note":"Copying and cloze work leave Entering and Transitioning students with no ideas of their own to express, so they never actually write an opinion."},{"code":"WRONG_LEVEL","note":"The supports are inverted: the least proficient students get the least help, and the most proficient students get the most."},null],"key":"Keep the same writing task for all ELLs; reduce scaffolds as proficiency rises (word banks and frames → paragraph frames → mentor texts)."},{"id":"4.6-13","skill":"4.6","type":"scenario","difficulty":1,"diag":0,"stem":"Hana, a grade 9 Emerging ELL who was a strong writer in Arabic at her previous school, sits silently during the planning stage of an English narrative assignment. Which support would be most effective during prewriting?","options":["Require her to plan only in English, since planning in Arabic will slow her progress in learning to write in English.","Assign her a shorter and simpler topic, such as a list of her favorite foods, while her classmates plan their narratives.","Let her brainstorm and outline in Arabic, talk through her ideas with a partner, and then draft in English using frames.","Give her extra time to look up every word she will need in an Arabic-English dictionary before she writes anything down."],"answer":2,"why":"Cummins's Common Underlying Proficiency suggests that the composing skills Hana built in Arabic—generating ideas, organizing a narrative—can transfer to English. Planning in her strongest language lets her bring that expertise to the grade-level task, and partner talk plus frames help her carry the ideas into English. This is a purposeful translanguaging scaffold within the writing process, not a lowered expectation.","traps":[{"code":"DEFICIT","note":"Banning Arabic treats her strongest literacy as an obstacle. Planning in Arabic lets her use skills that transfer, so it speeds rather than slows her English writing."},{"code":"LOWER_RIGOR","note":"A list of foods replaces the narrative task with a much simpler one and underestimates a strong writer."},null,{"code":"PARTIAL","note":"A bilingual dictionary is a useful tool, but looking up every word before writing stalls idea generation and ignores the composing skills she already has."}],"key":"Let ELLs who are literate in the home language plan in it, then draft in English with scaffolds."},{"id":"4.6-14","skill":"4.6","type":"analysis","difficulty":3,"diag":0,"stimulus":"Excerpt from an argument essay by a grade 10 student who has received ENL services since kindergarten (most recent NYSESLAT level: Expanding):\n“Kids should totally get more time for lunch cuz 25 minutes is like nothing. Me and my friends are always rushing and stuff, and you can't even finish your food. So basically the school needs to fix it.”","stem":"This writing profile is common among Long-Term ELLs. Which of the following best describes the student's primary language need?","options":["Shifting from a conversational register to the formal word choice and structures expected in a written argument","Basic sentence structure, since most of the student's sentences are incomplete or run together without punctuation","Everyday social vocabulary, since the student lacks the words needed to talk about lunchtime at school","A possible learning disability, since ten years of ENL services have not moved the student to Commanding"],"answer":0,"why":"The excerpt is fluent and grammatical as speech, but it uses spoken-register features—“totally,” “cuz,” “like nothing,” “and stuff,” “basically”—in a genre that calls for formal word choice, precise claims, and evidence. This is the classic Long-Term ELL profile: strong conversational English (BICS) with underdeveloped academic language (CALP). Instruction should make register explicit, for example by comparing informal and academic versions of the same argument and analyzing mentor essays.","traps":[null,{"code":"LITERAL","note":"The sentences are complete and correctly punctuated. The issue is the register, not basic sentence structure."},{"code":"TERM","pair":"BICS ↔ CALP","note":"Everyday social language (BICS) is the student's strength. The gap is in academic language (CALP)."},{"code":"MISREFERRAL","note":"Long-term ELL status often reflects inconsistent programs and too little explicit academic-language instruction. Nothing in this sample points to a disability."}],"key":"Long-Term ELLs often write fluently in a conversational register; teach academic register explicitly through contrast and mentor texts."},{"id":"4.7-01","skill":"4.7","type":"application","difficulty":2,"diag":1,"stem":"In a grade 5 Integrated ENL/ELA class, students write and illustrate books about their families' histories in English and in their home languages, with help from family members. The finished books are read aloud at a family celebration and added to the classroom library. This project is best described as students creating:","options":["dialogue journals that build written fluency through private exchanges with the teacher","Language Experience Approach texts that students dictate to the teacher about a shared event","leveled readers matched to each student's independent reading level for the class library","identity texts that showcase students' linguistic and cultural identities to real audiences"],"answer":3,"why":"Identity texts (Cummins & Early) are student creations—written, spoken, visual, or multilingual—into which students invest their identities, and which reflect those identities back in a positive light when shared with real audiences such as peers and families. They let students use their full linguistic repertoire, position the home language as a valuable resource, and bring families in as partners. This reflects the Blueprint principles of leveraging home language and culture and partnering with families.","traps":[{"code":"TERM","pair":"identity text ↔ dialogue journal","note":"A dialogue journal is an ongoing private written conversation between student and teacher. These books are published works shared with a public audience."},{"code":"TERM","pair":"identity text ↔ Language Experience Approach","note":"In the LEA, students dictate an account of a shared class experience for the teacher to write down. Here students author bilingual books about their own families."},{"code":"LITERAL","note":"This latches onto the surface detail that the books go into the library. The defining feature is that students invest their identities and languages in the work."},null],"key":"Identity texts are student-created, often bilingual works that showcase students' identities to real audiences such as families and peers."},{"id":"4.7-02","skill":"4.7","type":"analysis","difficulty":2,"diag":0,"stimulus":"Excerpt from a short story read in a grade 8 class:\n“Marcus stared at the empty bleachers. After the homecoming game, everyone had gone to the dance, but he still didn't have a date.”\n\nResponse from an Expanding ELL who arrived from Nepal in grade 7:\n“Marcus is sad because his family went home and forgot him at the stadium.”","stem":"The student reads the excerpt aloud accurately and fluently. Which explanation best accounts for her interpretation?","options":["She has a decoding problem that keeps her from accurately processing each of the words in the story's opening sentences.","She lacks cultural schema for U.S. school traditions like homecoming, so she fills the gap with a scenario she knows.","She has weak inferencing ability, which signals a possible comprehension disability that should be referred for evaluation.","Students from her cultural background are generally not taught to make inferences when they read fiction in school."],"answer":1,"why":"Schema theory explains that readers interpret texts through their background knowledge. When a story assumes culturally specific knowledge—homecoming, school dances, having “a date”—a reader without that schema builds a plausible but different meaning. The student is in fact inferring, just from a different cultural frame. The teacher should build the needed cultural background with visuals, a brief explanation, and peer discussion, and invite comparisons with school celebrations students know.","traps":[{"code":"LITERAL","note":"The stem says she reads the excerpt accurately and fluently, so decoding is ruled out by the evidence."},null,{"code":"MISREFERRAL","note":"She is inferring; she just lacks the cultural information the author assumes. Missing background knowledge is not evidence of a disability."},{"code":"STEREOTYPE","note":"This makes an unsupported generalization about a whole cultural group. The evidence points to one missing piece of cultural knowledge, not to how she was taught."}],"key":"Misreadings of culturally specific situations often reflect missing cultural schema, not weak reading skill; build that background."},{"id":"4.7-03","skill":"4.7","type":"analysis","difficulty":1,"diag":0,"stimulus":"Novel excerpt: “Ana had practiced for weeks, but the night before the audition she got cold feet and almost stayed home.”\n\nJournal response from a grade 6 Transitioning ELL: “Ana almost did not go because her feet were cold. She needed warm socks.”","stem":"Which instructional response would best address this misunderstanding?","options":["Give students a list of fifty common English idioms with their definitions to memorize for a quiz at the end of each week.","Postpone instruction in idioms and other figurative language until students reach the Commanding level and can understand them.","Explain that idioms aren't read word by word, use context clues to infer “got nervous,” and compare similar home-language expressions.","Tell the student the correct meaning of the idiom and move on so that the class can finish reading the assigned chapter on schedule today."],"answer":2,"why":"Idioms are non-compositional—their meaning is not the sum of their words—so reading “cold feet” literally is a natural, predictable step for ELLs. Effective instruction teaches idioms in context, models using surrounding clues (“practiced for weeks… almost stayed home”) to infer the meaning, and builds cross-linguistic awareness by comparing idioms in students' home languages. Figurative language is part of grade-level ELA, so it is taught with support at every proficiency level.","traps":[{"code":"ISOLATED","note":"Memorizing long lists out of context rarely transfers to reading. Students need to practice inferring idioms from the clues around them in real texts."},{"code":"EXCLUSION","note":"Figurative language appears in grade-level texts at every level. Waiting until Commanding denies students access to literature they are reading now."},null,{"code":"PARTIAL","note":"Giving the meaning fixes this one instance but teaches no strategy, so the student will be stuck again at the next idiom."}],"key":"Teach idioms in context with clue-based inference and home-language comparisons, not with memorized lists or postponement."},{"id":"4.7-04","skill":"4.7","type":"application","difficulty":3,"diag":0,"stem":"An elementary school celebrates diversity with a yearly International Food Fair and a hallway display of famous people from students' home countries, but the ELA curriculum and its texts are unchanged. According to James Banks's approaches to multicultural curriculum reform, the school is working at which level?","options":["The contributions approach","The additive approach","The transformation approach","The social action approach"],"answer":0,"why":"Banks describes four levels: contributions (heroes, holidays, foods, and other discrete cultural elements), additive (adding multicultural content, themes, or a unit without changing the curriculum's structure), transformation (restructuring the curriculum so students examine issues from multiple perspectives), and social action (students make decisions and take action on social issues). Food fairs and famous-people displays are the hallmark of the contributions level, sometimes called “heroes and holidays.” The CR-SE Framework's call for an inclusive curriculum points toward the transformation and social action levels.","traps":[null,{"code":"TERM","pair":"contributions ↔ additive","note":"The additive approach adds multicultural content, such as a new book or unit, to the curriculum. Here nothing in the curriculum has changed; only celebrations were added."},{"code":"TERM","pair":"contributions ↔ transformation","note":"Transformation restructures the curriculum so students study issues from multiple perspectives. This school's curriculum is unchanged."},{"code":"TERM","pair":"contributions ↔ social action","note":"Social action has students study and act on real social issues. A food fair and a display involve no critical inquiry or action."}],"key":"Banks's levels: contributions (heroes, holidays, food) → additive → transformation (multiple perspectives) → social action."},{"id":"4.7-05","skill":"4.7","type":"scenario","difficulty":2,"diag":2,"stem":"In a grade 8 Integrated ENL/ELA class, two Emerging ELLs whose home language is Spanish discuss the theme of a grade-level novel in Spanish during small-group work. When it is time to share with the class, they struggle to express their ideas in English. Which teacher response best reflects a translanguaging approach?","options":["Remind them that ELA class is an English-only space, so that they get as much practice speaking and writing in English as possible.","Let them keep discussing in Spanish, but excuse them from sharing with the whole class until they become more proficient in English.","Move each of them into a separate group with English-proficient peers, so that they will need to use English to discuss the theme.","Value the Spanish talk as a tool for analysis, then have them jot key ideas bilingually and rehearse sharing in English with frames."],"answer":3,"why":"Translanguaging pedagogy (García; CUNY-NYSIEB) treats bilingual students' full linguistic repertoire as one resource for learning. Discussing theme in Spanish lets these Emerging students do grade-level literary analysis they cannot yet fully express in English, and the teacher then builds a bridge to English with bilingual notes, frames, and rehearsal. The home language supports both the content goal and English development rather than competing with them.","traps":[{"code":"DEFICIT","note":"An English-only rule treats Spanish as an obstacle and shuts down the deep analysis the students were doing. More English time does not help if the thinking stops."},{"code":"EXCLUSION","note":"Excusing them from sharing until they are “more proficient” removes the English output opportunity they need. The teacher should scaffold the sharing, not skip it."},{"code":"PARTIAL","note":"Working with English-proficient peers can be valuable at times, but splitting them up to force English removes the resource that was producing their best analysis."},null],"key":"Translanguaging uses the home language strategically to deepen thinking, then bridges to English output with scaffolds."},{"id":"4.7-06","skill":"4.7","type":"scenario","difficulty":3,"diag":0,"stem":"An ENL teacher sends home dual-language (Bengali–English) editions of the picture books her grade 2 class reads and encourages families to read and talk about the stories in Bengali. A colleague worries that this will slow the children's progress in English reading. Which principle provides the strongest response to the colleague's concern?","options":["Lowering the affective filter at home is the main benefit, since reading with family makes children feel relaxed and confident.","Children acquire conversational English within one to three years, so home reading in Bengali affects only social language.","Comprehension skills and concepts developed in the home language transfer to English through a common underlying proficiency.","Contrastive analysis shows that reading in the home language helps children avoid errors caused by first-language interference."],"answer":2,"why":"Cummins's Common Underlying Proficiency (the “iceberg”) and Developmental Interdependence hypothesis hold that literacy concepts and comprehension skills learned in one language—predicting, sequencing, understanding story structure, knowing what words mean—are available in the other. Rich home-language reading therefore supports, rather than delays, English reading, which answers the colleague's concern directly. Dual-language books also bring families in as literacy partners and affirm the home language, as the Blueprint calls for.","traps":[{"code":"PARTIAL","note":"Comfort and family connection are real benefits, but they don't answer the concern about English reading. Transfer of comprehension skills does."},{"code":"TERM","pair":"BICS ↔ CALP","note":"Reading and discussing stories builds literacy and academic language (CALP), not just social language. The BICS timeline is beside the point here."},null,{"code":"MISAPPLIED_THEORY","note":"Lado's contrastive analysis predicts errors from differences between two languages. It is not a rationale for home-language reading and says nothing about transfer of comprehension."}],"key":"Home-language reading builds transferable comprehension (Cummins's Common Underlying Proficiency); it supports, rather than slows, English literacy."},{"id":"4.7-07","skill":"4.7","type":"analysis","difficulty":2,"diag":0,"stimulus":"Notes from a teacher's review of a picture book being considered for a grade 3 unit on families:\n- Written by an author with no stated connection to the culture portrayed\n- Every Mexican character wears a sombrero or poncho and lives in a rural village\n- The story is set in the present day\n- The only character who solves a problem is a visiting American child","stem":"Based on these notes, which evaluation of the book is most accurate?","options":["The book is appropriate, because any representation of Mexican culture will help Mexican students feel welcome in the class.","The book offers a stereotyped single story of Mexican culture and gives the agency to an outsider, so a more authentic text is needed.","The book is acceptable as long as the teacher adds a lesson on Mexican holidays and foods to give students more cultural context.","The illustrations are the main problem, so the teacher can use the book if students listen to the text without seeing the pictures."],"answer":1,"why":"Evaluating multicultural literature means checking for authenticity (an insider perspective or careful research), accurate and varied present-day portrayals, and characters from the culture who have agency. A present-day story in which every Mexican character wears traditional dress in a village, and an outsider solves the problem, offers what Chimamanda Ngozi Adichie calls a “single story.” The CR-SE Framework calls for an inclusive curriculum that reflects students' identities accurately and with dignity.","traps":[{"code":"STEREOTYPE","note":"Stereotyped representation is not neutral. It can misinform classmates and tell Mexican students that their lives are seen only through clichés."},null,{"code":"PARTIAL","note":"A holidays-and-foods lesson is a contributions-level add-on that leaves the book's stereotypes and outsider-hero plot in place."},{"code":"LITERAL","note":"The text itself is a problem: the characterization, the outsider hero, and the author's lack of connection to the culture. Hiding the pictures fixes none of that."}],"key":"Choose multicultural texts with authentic, varied, present-day portrayals and characters with agency; reject stereotyped “single stories.”"},{"id":"4.7-08","skill":"4.7","type":"scenario","difficulty":1,"diag":0,"stem":"At family conferences, a grade 3 teacher learns that several students' grandparents tell traditional stories at home in Wolof, Spanish, Fulani, and Haitian Creole. The class is beginning a folktale unit. Which plan best builds on what the teacher learned?","options":["Invite relatives to tell a traditional tale, with an interpreter as needed, then have students compare its elements to a grade-level folktale.","Display a world map that marks the countries the students' families come from, with a flag and a greeting in each home language.","Ask students to translate their grandparents' stories into English at home and turn in written versions before the folktale unit begins.","Assign each student to read only the folktales from his or her family's home country, so that every child focuses on his or her own culture."],"answer":0,"why":"Funds of knowledge (Moll and colleagues) are the skills and knowledge found in households—here, oral storytelling traditions. Inviting relatives to tell tales positions families as experts and partners, and comparing story elements (characters, problem, lesson) across tales meets the grade-level standard while honoring oral literacy. It is a culturally sustaining move that enriches the unit for every student, not only for the storytellers' grandchildren.","traps":[null,{"code":"PARTIAL","note":"A map is welcoming but superficial (a contributions-level gesture). It doesn't use the families' storytelling knowledge in the actual literacy work."},{"code":"FAMILY_BARRIER","note":"This puts the job of translating on young children instead of engaging families directly, and it turns an oral tradition into a written homework burden."},{"code":"STEREOTYPE","note":"Assigning texts by presumed heritage pigeonholes students and denies everyone the cross-cultural comparison that makes the unit rich."}],"key":"Build on funds of knowledge by bringing family expertise, such as oral storytelling, into grade-level literacy work."},{"id":"4.7-09","skill":"4.7","type":"analysis","difficulty":2,"diag":0,"stimulus":"Draft of a poem by a grade 7 Transitioning ELL (home language Urdu), modeled on George Ella Lyon's poem “Where I'm From”:\n“I am from chai in the morning\nand my nani's stories at night.\nI am from ‘beta, eat more!’\nand cricket in the narrow street.\nI am from two languages\nthat live in one heart.”","stem":"Which response to this draft would best support the student's growth as a writer?","options":["Ask the student to replace “nani” and “beta” with their English equivalents so that every reader in the class can easily understand the poem.","Focus the conference on punctuation and capitalization, since conventions should be correct before any content is revised.","Praise the poem and post it on the bulletin board without any revision, since poetry does not have to follow strict rules.","Affirm the Urdu phrases and imagery, then confer about adding sensory details and context that helps readers infer “nani” and “beta.”"],"answer":3,"why":"This is an identity text built on a mentor poem: the student borrows a published poem's structure to express a bicultural identity, and the Urdu words carry meaning and voice that English substitutes would lose. Asset-based feedback affirms these choices and then pushes craft—sensory detail and context clues for readers—so expectations stay high. It treats translanguaging as a legitimate literary device, as many published bilingual authors do.","traps":[{"code":"DEFICIT","note":"Replacing the Urdu words erases the voice and identity that make the poem powerful and signals that the home language doesn't belong in literature."},{"code":"OVERCORRECT","note":"Putting conventions before content reverses the writing process and focuses on form when the poem's meaning and imagery are the point."},{"code":"LOWER_RIGOR","note":"Celebrating the poem is good, but skipping revision denies the student feedback on craft. High expectations include pushing a strong draft further."},null],"key":"In identity writing, affirm home-language words as craft choices, then push revision for imagery and reader understanding."},{"id":"4.7-10","skill":"4.7","type":"application","difficulty":3,"diag":0,"stem":"A middle school ELA teacher's explicit goal is not only to use students' Spanish, Arabic, and Bengali as bridges to English, but also to help students maintain and develop those languages and their communities' literacy practices as valuable in their own right—for example, through bilingual poetry publishing and a heritage-language book club. This goal most closely reflects which framework?","options":["Ladson-Billings's culturally relevant pedagogy","Paris's culturally sustaining pedagogy","Moll's funds of knowledge","Krashen's affective filter hypothesis"],"answer":1,"why":"Django Paris proposed culturally sustaining pedagogy, which aims to perpetuate and foster linguistic, literate, and cultural pluralism—treating students' languages and practices as worth sustaining, not only as bridges to dominant English. It builds on Ladson-Billings's culturally relevant pedagogy (academic success, cultural competence, critical consciousness) and Gay's culturally responsive teaching. NYS's Culturally Responsive-Sustaining Education Framework carries the word “sustaining” from this line of work.","traps":[{"code":"TERM","pair":"culturally relevant ↔ culturally sustaining","note":"Ladson-Billings's framework centers academic success, cultural competence, and critical consciousness. Paris extended it with the explicit goal of sustaining students' languages and cultures."},null,{"code":"TERM","pair":"funds of knowledge ↔ culturally sustaining pedagogy","note":"Funds of knowledge draws on household knowledge and skills as resources for instruction. It does not, by itself, make maintaining heritage languages a goal."},{"code":"MISAPPLIED_THEORY","note":"The affective filter concerns how anxiety blocks input. It is about comfort, not about sustaining languages and cultural practices."}],"key":"Culturally sustaining pedagogy (Paris) aims to maintain students' languages and cultures, not just use them as bridges to English."},{"id":"4.7-11","skill":"4.7","type":"scenario","difficulty":2,"diag":0,"stem":"Zarghuna, a grade 7 Entering ELL who arrived from Afghanistan with strong literacy in Dari, has followed the class novel through a home-language summary, visuals, and partner discussion. The class is now writing literary analyses of the novel's theme. Which approach would give the teacher the most valid evidence of Zarghuna's literary understanding?","options":["Let her write the analysis in Dari with a short framed summary in English, and have a Dari-speaking colleague help review it.","Grade her analysis written in English with the same rubric as her classmates, so that she is held to the same grade-level expectations.","Excuse her from the analysis for now and have her complete it later, once her English proficiency reaches the Transitioning level.","Replace the analysis with a multiple-choice quiz on vocabulary words from the novel, which she can complete with a bilingual glossary."],"answer":0,"why":"Valid assessment measures the intended construct, and here the construct is understanding of theme, not English writing. Letting a literate Entering student respond in her home language separates literary understanding from English proficiency, while the framed English summary still provides evidence of language growth. NYS does not allow translations or glossaries on its ELA tests, but in classroom assessment the teacher can and should gather evidence that shows what the student truly knows.","traps":[null,{"code":"ASSESS_INVALID","note":"Grading an Entering student's English essay on the class rubric measures her English proficiency, not her understanding of the theme, so the results would be misleading."},{"code":"EXCLUSION","note":"Postponing the task until she is “more proficient” shuts her out of grade-level work and leaves the teacher with no evidence of her learning."},{"code":"LOWER_RIGOR","note":"A vocabulary quiz replaces literary analysis with recall. It lowers the cognitive demand and doesn't measure understanding of theme."}],"key":"To assess an Entering student's literary understanding validly, allow a home-language response; grading English proficiency instead gives invalid results."},{"id":"4.7-12","skill":"4.7","type":"scenario","difficulty":2,"diag":0,"stimulus":"Opening stanza of a poem by Emily Dickinson:\n“‘Hope’ is the thing with feathers -\nThat perches in the soul -\nAnd sings the tune without the words -\nAnd never stops - at all -”","stem":"Transitioning ELLs in a grade 7 class say that this poem is “about a bird.” Which next step would best help them analyze its figurative language?","options":["Replace the poem with a simpler one that uses literal language so that students can focus on identifying the main idea.","Explain the meaning of the poem to the class, and then have students copy the explanation into their notebooks for later review.","Have partners list what the bird does in the poem, then explain the comparison with the frame “Hope is like a bird because ___.”","Pre-teach the definitions of perches and soul with visuals so that students understand every word that appears in the poem."],"answer":2,"why":"The students' literal reading shows they understand the surface image but not the extended metaphor. Guiding them to map the traits of the image (a bird perches, sings, never stops) onto the idea it represents (hope) teaches the thinking process of figurative analysis, and the frame plus partner talk supports output at the Transitioning level. Students can also share how hope is pictured in poems and sayings in their home languages.","traps":[{"code":"LOWER_RIGOR","note":"Swapping in a literal poem removes the very skill the lesson targets. The students' partial reading shows they are ready to be guided further, not given less."},{"code":"PASSIVE","note":"Students only listen and copy, so they never practice the reasoning that figurative analysis requires."},null,{"code":"PARTIAL","note":"Knowing the words helps, but the students already grasp the literal image. The gap is in interpreting the metaphor, which vocabulary alone won't close."}],"key":"Teach metaphor by mapping traits of the image onto the idea it stands for, using frames and partner talk, not by replacing the text."},{"id":"4.7-13","skill":"4.7","type":"knowledge","difficulty":1,"diag":0,"stem":"Which of the following best describes translanguaging as a pedagogical approach?","options":["Having a bilingual aide translate each of the teacher's sentences into the students' home languages while the teacher is speaking","Purposefully using students' whole linguistic repertoire, not only English, to make meaning, learn content, and grow both languages","Switching between two separate language systems only at moments when a student lacks the English word needed to express an idea","Teaching each language in its own time block and discouraging students from mixing languages during instruction"],"answer":1,"why":"Translanguaging (Ofelia García; CUNY-NYSIEB) views bilinguals as having one integrated linguistic repertoire rather than two separate language boxes. As pedagogy, it means deliberately designing opportunities—bilingual discussion, home-language research, multilingual texts—that use all of students' language resources to deepen learning and build English. It differs from concurrent translation, which tends to lead students to tune out the English.","traps":[{"code":"TERM","pair":"translanguaging ↔ concurrent translation","note":"Sentence-by-sentence translation is concurrent translation. Students learn to wait for their home language, and it is not a planned use of their repertoire."},null,{"code":"TERM","pair":"translanguaging ↔ code-switching","note":"This describes a deficit view of code-switching, as a fallback for missing words. Translanguaging sees one integrated repertoire used purposefully, not as a patch for gaps."},{"code":"TERM","pair":"translanguaging ↔ strict language separation","note":"Strict separation of languages is a program design choice, as in some dual language models. Translanguaging intentionally brings languages together."}],"key":"Translanguaging pedagogy purposefully uses students' whole linguistic repertoire to learn content and develop both languages."},{"id":"4.7-14","skill":"4.7","type":"scenario","difficulty":1,"diag":0,"stem":"A grade 11 ELA teacher in Washington Heights, where most of her students are Dominican American, is choosing an anchor text for a unit on identity and voice. Which choice best reflects culturally relevant text selection while keeping the unit rigorous?","options":["A high-interest, low-readability book about a Dominican baseball star, since many of the students enjoy watching and following the sport","A classic canonical novel alone, since students need exposure to the literary works most often taught in American high schools","A Spanish translation of a Shakespeare tragedy, so that students can read a classic work of literature in their heritage language","An acclaimed verse novel by a Dominican American author about a Harlem teen finding her voice in poetry, paired with canonical poems"],"answer":3,"why":"Culturally relevant texts act as what Rudine Sims Bishop called “mirrors” that reflect students' lives, as well as “windows” into others' experiences. A complex, award-winning novel by an insider author offers authentic representation and grade-level rigor, and pairing it with canonical poems keeps the unit connected to the wider literary tradition. Relevance should come with complexity, not instead of it, and should not rest on stereotypes about students' interests.","traps":[{"code":"STEREOTYPE","note":"Choosing a baseball book because students are Dominican relies on a cultural stereotype, and a low-readability text also lowers rigor for grade 11."},{"code":"PARTIAL","note":"Canonical works have real value, but using one alone gives students no mirror of their own experience in a unit about identity and voice."},{"code":"LITERAL","note":"This equates cultural relevance with reading in Spanish. Students' language profiles vary, and a translated Shakespeare play neither reflects their lives nor builds English literary analysis."},null],"key":"Pick complex, authentic texts by insider authors that mirror students' lives, paired with other texts, not stereotyped or watered-down choices."},{"id":"5.1-01","skill":"5.1","type":"application","difficulty":1,"diag":0,"stimulus":"Lesson excerpt, grade 6 Integrated ENL science (food preservation unit):\nThe teacher opens by asking students how their families keep food from spoiling at home. Students describe drying fish, pickling vegetables, and salting meat. The teacher then says, 'Last week we learned that bacteria need warmth and moisture to grow. Let's figure out how each of your families' methods takes one of those away.'","stem":"The teacher's opening most clearly reflects which SIOP component?","options":["Lesson Preparation, because the teacher planned a meaningful activity that integrates content with language practice","Building Background, because the teacher links the new concepts to students' experiences and to past learning","Comprehensible Input, because the teacher uses familiar examples to make her speech easier to understand","Review & Assessment, because the teacher reviews key content concepts from the previous week's lesson"],"answer":1,"why":"SIOP's Building Background component has three features: concepts explicitly linked to students' background experiences, explicit links between past learning and new concepts, and emphasis on key vocabulary. Asking about families' food-preservation practices connects the lesson to students' lives (their funds of knowledge), and the reference to last week's bacteria lesson connects past learning to the new concept. Both moves are textbook Building Background.","traps":[{"code":"TERM","pair":"Lesson Preparation ↔ Building Background","note":"Lesson Preparation covers planning features such as objectives, appropriate concepts, supplementary materials, and adapted content. The defining move here is explicitly connecting to students' experiences and prior lessons, which SIOP places in Building Background."},null,{"code":"TERM","pair":"Comprehensible Input ↔ Building Background","note":"Comprehensible Input is about how the teacher speaks and explains tasks (rate, enunciation, modeling, visuals). This teacher isn't adjusting her speech; she is activating and connecting background knowledge."},{"code":"LITERAL","note":"The mention of last week is a bridge to new learning, not a comprehensive review. Review & Assessment features (reviewing key vocabulary and concepts, giving feedback, checking comprehension) happen during and at the end of a lesson."}],"key":"SIOP Building Background = link to students' experiences + link to past learning + emphasize key vocabulary."},{"id":"5.1-02","skill":"5.1","type":"application","difficulty":2,"diag":1,"stimulus":"Grade 7 Integrated ENL science, Transitioning and Expanding ELLs.\nContent objective: Students will compare plant and animal cells.\nPlanned task: Partners examine microscope images, then report similarities and differences to the class.","stem":"Which of the following is the most appropriate language objective for this lesson?","options":["Students will identify the cell wall, chloroplasts, and vacuole in plant cells viewed under a microscope.","Students will complete a Venn diagram that shows how plant and animal cells are alike and how they differ.","Students will orally compare the two cell types using 'Both ___ and ___ have ___' and '___, whereas ___.'","Students will copy and memorize the glossary definitions of ten cell-structure vocabulary words."],"answer":2,"why":"A language objective states how students will use academic language to learn or show the content: a language function (compare), a domain (orally), and the target forms (Both… and… have…; whereas). This option names all three and matches the planned task, in which partners report similarities and differences. SIOP calls for both content and language objectives that are clearly defined, displayed, and reviewed with students.","traps":[{"code":"TERM","pair":"content objective ↔ language objective","note":"Identifying cell structures is content knowledge: what students learn about science. It names no language function or forms, so it is a second content objective, not a language objective."},{"code":"PARTIAL","note":"A Venn diagram is a useful scaffold, but this describes an activity. It doesn't say which language function, forms, or domain students will practice."},null,{"code":"ISOLATED","note":"Copying and memorizing glossary definitions is decontextualized and has nothing to do with the lesson's language function (comparing). It produces no meaningful output."}],"key":"A strong language objective names the function, domain, and target forms students will use, not a content fact or an activity."},{"id":"5.1-03","skill":"5.1","type":"analysis","difficulty":2,"diag":2,"stimulus":"A grade 8 Transitioning ELL (home language: Bengali) thinks aloud before reading a social studies chapter:\n'First I'll look at the headings and the questions at the end, so I know what this is about. Then I'll read the part about the factory workers most carefully, because that's what the questions ask about.'","stem":"In the CALLA framework, the strategies this student is using are best classified as","options":["metacognitive strategies, because the student is planning and directing her attention before the task","cognitive strategies, because the student is manipulating the text material in order to understand it","social/affective strategies, because the student is managing her motivation and interest while reading","compensation strategies, because the student is making up for gaps in her English vocabulary knowledge"],"answer":0,"why":"CALLA (Chamot & O'Malley) groups learning strategies into three types. Metacognitive strategies are planning, selective attention, monitoring, and self-evaluation. Cognitive strategies work directly with the material: note-taking, summarizing, grouping, inferencing, using resources. Social/affective strategies are asking for clarification, cooperating, and self-talk. Previewing headings to plan, and deciding in advance what to focus on, are planning and selective attention. The student is managing her own learning, so these are metacognitive strategies.","traps":[null,{"code":"TERM","pair":"metacognitive ↔ cognitive","note":"Cognitive strategies involve working with the content itself (taking notes, summarizing, classifying). This student hasn't started working with the text yet; she is planning how to approach it, which is thinking about her learning."},{"code":"TERM","pair":"metacognitive ↔ social/affective","note":"Social/affective strategies involve other people (asking for clarification, cooperating) or managing feelings (positive self-talk). Nothing in the think-aloud involves peers or emotions."},{"code":"MISAPPLIED_THEORY","note":"'Compensation' is a category in Rebecca Oxford's strategy taxonomy, not one of CALLA's three types. The student also isn't compensating for missing knowledge (guessing, using synonyms, gesturing)."}],"key":"Planning, selective attention, monitoring, and self-evaluation are metacognitive; working directly on the material is cognitive."},{"id":"5.1-04","skill":"5.1","type":"application","difficulty":3,"diag":0,"stem":"A high school sheltered biology teacher asks a question, pauses several seconds before calling on anyone, and then lets students rehearse their answers with a partner (sometimes in their home language) before sharing with the class. In the SIOP model, these practices are features of which component?","options":["Comprehensible Input","Strategies","Lesson Delivery","Interaction"],"answer":3,"why":"SIOP's Interaction component has four features: frequent opportunities for interaction and discussion, grouping configurations that support the objectives, sufficient wait time for responses, and ample opportunities to clarify key concepts in L1. The teacher's pause is wait time, and partner rehearsal (including in the home language) is interaction and L1 clarification. Wait time is a classic trap because it seems to belong under Comprehensible Input.","traps":[{"code":"TERM","pair":"Comprehensible Input ↔ Interaction","note":"Wait time feels like it makes a lesson comprehensible, but SIOP lists 'sufficient wait time' and 'clarify key concepts in L1' under Interaction. Comprehensible Input covers teacher speech, clear task explanations, and techniques such as modeling and visuals."},{"code":"TERM","pair":"Strategies ↔ Interaction","note":"Strategies covers learning strategies, scaffolding techniques such as think-alouds, and higher-order questions. These practices concern how students respond and talk, not strategy instruction."},{"code":"TERM","pair":"Lesson Delivery ↔ Interaction","note":"Lesson Delivery asks whether delivery supports the objectives, whether students are engaged 90–100% of the time, and whether pacing is appropriate. A deliberate pause before calling on students is an Interaction feature, not pacing."},null],"key":"In SIOP, wait time and L1 clarification belong to Interaction, not Comprehensible Input."},{"id":"5.1-05","skill":"5.1","type":"knowledge","difficulty":1,"diag":0,"stem":"The Cognitive Academic Language Learning Approach (CALLA) integrates which three components?","options":["Grade-level content topics, academic language development, and explicit learning-strategy instruction","Explicit grammar rules, vocabulary memorization, and translation of content texts into the home language","Posted content objectives, posted language objectives, and a thirty-feature lesson observation protocol","Total physical response, an extended silent period, and a gradual movement toward oral production"],"answer":0,"why":"Chamot and O'Malley designed CALLA to prepare ELLs for grade-level content classes. It integrates three components: content topics from the curriculum, the academic language those topics require, and explicit instruction in learning strategies (metacognitive, cognitive, and social/affective). The learning-strategy strand is what most distinguishes CALLA from other content-based models.","traps":[null,{"code":"TERM","pair":"CALLA ↔ Grammar-Translation","note":"Rules, memorized vocabulary, and translation describe the Grammar-Translation method. CALLA instead teaches academic language and strategies through grade-level content."},{"code":"TERM","pair":"CALLA ↔ SIOP","note":"Content and language objectives evaluated with a 30-feature protocol describe the SIOP Model (Echevarría, Vogt & Short), not CALLA."},{"code":"TERM","pair":"CALLA ↔ Natural Approach/TPR","note":"TPR and a silent period followed by gradual production describe Asher's TPR and Krashen and Terrell's Natural Approach, which focus on beginning oral language rather than academic content and strategies."}],"key":"CALLA = content + academic language + explicit learning-strategy instruction (Chamot & O'Malley)."},{"id":"5.1-06","skill":"5.1","type":"application","difficulty":3,"diag":0,"stimulus":"Grade 5 Integrated ENL math. CALLA lesson on selective attention (underlining the question and the key numbers in a word problem):\nDay 1: Students describe how they usually start a word problem.\nDay 1: The teacher models the strategy in a think-aloud and names it.\nDay 2: Partners apply the strategy to three new problems.\nDay 2: Students write in their learning logs: 'How well did underlining work for me? Which problem was hardest, and why?'","stem":"The learning-log entry on Day 2 corresponds to which phase of the CALLA instructional sequence?","options":["Preparation","Practice","Self-evaluation","Expansion"],"answer":2,"why":"CALLA's instructional sequence has five phases. Preparation finds out what students know and which strategies they already use. Presentation models and names the strategy. Practice applies it. Self-evaluation (sometimes listed simply as Evaluation) has students judge their own learning and how useful the strategy was. Expansion transfers the strategy to new contexts. Asking 'How well did underlining work for me?' is self-evaluation, which builds metacognitive awareness.","traps":[{"code":"TERM","pair":"Preparation ↔ Self-evaluation","note":"Preparation is the opening phase, when the teacher finds out what students know and how they already approach the task. That is the Day 1 discussion, not the reflective log."},{"code":"LITERAL","note":"The log comes on the same day as the partner work, but Practice is the phase of applying the strategy to tasks. Judging how well the strategy worked is a separate phase."},null,{"code":"TERM","pair":"Expansion ↔ Self-evaluation","note":"Expansion asks students to transfer the strategy to new settings (another subject, home, real life). This log asks students to judge their own success, not to extend the strategy."}],"key":"CALLA sequence: Preparation → Presentation → Practice → Self-evaluation → Expansion."},{"id":"5.1-07","skill":"5.1","type":"application","difficulty":3,"diag":0,"stem":"A grade 4 Integrated ENL teacher and the classroom teacher are planning a lesson on finding the perimeter of rectangles. Using the distinction between content-obligatory and content-compatible language, which target is content-compatible?","options":["The terms perimeter, length, and width, which students need to name what they are measuring","The past tense, as in 'We measured each side,' when groups report on what they did","The phrase 'the distance around,' which students need to explain what perimeter means","The language 'add all the sides,' which students need to describe how to find perimeter"],"answer":1,"why":"Snow, Met, and Genesee distinguish content-obligatory language from content-compatible language. Content-obligatory language is the vocabulary, structures, and functions students must have to learn and express the concept. Content-compatible language fits naturally into the lesson and can be practiced there, but it isn't required to master the content. The perimeter terms and the language for explaining and computing perimeter are obligatory. The past tense in a group report is compatible: a good extra target once the obligatory language is planned.","traps":[{"code":"TERM","pair":"content-obligatory ↔ content-compatible","note":"Students can't understand or talk about perimeter without these terms, so they are content-obligatory, the first language to plan."},null,{"code":"TERM","pair":"content-obligatory ↔ content-compatible","note":"Explaining what perimeter means is part of the concept itself. Students must have this language to express the content, so it is obligatory."},{"code":"TERM","pair":"content-obligatory ↔ content-compatible","note":"Describing the procedure for finding perimeter is essential to the math objective, so this language is obligatory, not optional."}],"key":"Content-obligatory language is required to learn the concept; content-compatible language fits the lesson but isn't essential."},{"id":"5.1-08","skill":"5.1","type":"knowledge","difficulty":3,"diag":0,"stem":"At a high school, ELLs enroll in a mainstream biology course and, at the same time, in a linked ENL course. The ENL teacher uses the biology readings and assignments to teach the reading, writing, and note-taking skills the course demands, and the two teachers coordinate weekly. This arrangement best exemplifies which content-based instruction model?","options":["Theme-based instruction","Sheltered content instruction","Two-way immersion","The adjunct model"],"answer":3,"why":"Brinton, Snow, and Wesche described three classic CBI models. In the adjunct model, students are co-enrolled in a mainstream content course and a linked language course, and the teachers coordinate so the language course targets the content course's demands. In sheltered instruction, a content course is taught to ELLs with language-sensitive modifications. In theme-based instruction, a language course is organized around content themes.","traps":[{"code":"TERM","pair":"theme-based ↔ adjunct","note":"In theme-based instruction, a language course is organized around topics the language teacher chooses. Students are not co-enrolled in a linked mainstream content course."},{"code":"TERM","pair":"sheltered ↔ adjunct","note":"In sheltered instruction, the content course itself is taught to ELLs with modifications. Here students take the regular mainstream course plus a separate, linked language course."},{"code":"TERM","pair":"two-way immersion ↔ adjunct","note":"Two-way immersion is a dual language program that teaches English speakers and partner-language speakers content in both languages. It doesn't describe a linked ENL support course."},null],"key":"Adjunct = mainstream content course + linked language course; sheltered = adapted content course; theme-based = language course built on themes."},{"id":"5.1-09","skill":"5.1","type":"scenario","difficulty":2,"diag":0,"stem":"A grade 8 social studies teacher with several Emerging ELLs in a sheltered class says the textbook chapter on the Industrial Revolution is 'too hard for them.' Which adaptation best reflects sheltered instruction principles?","options":["Keep the grade-level chapter, and add a graphic organizer, a leveled study guide, and highlighted key passages","Replace the chapter with a picture book about factories that was written for early elementary students","Have the ELLs listen while the teacher reads the chapter aloud, as the rest of the class takes notes on main ideas","Excuse the ELLs from the chapter and assign them a word search built from the chapter's key vocabulary terms"],"answer":0,"why":"Sheltered instruction, including SIOP's feature 'adaptation of content to all levels of student proficiency,' keeps grade-level concepts and makes the text accessible. Typical supports are graphic organizers, leveled study guides, highlighted text, outlines, and marginal notes. The goal is to scaffold access to rigorous content, not to replace it with easier material.","traps":[null,{"code":"LOWER_RIGOR","note":"An early-elementary picture book swaps grade-level content for a far less demanding text. Sheltering means scaffolding the same concepts, not lowering them."},{"code":"PASSIVE","note":"Just listening to a read-aloud while others take notes gives ELLs no structured support, interaction, or output. The dense language of the text stays inaccessible."},{"code":"EXCLUSION","note":"Excusing ELLs from the chapter removes them from grade-level content, and a word search is a decontextualized task that builds no understanding of the Industrial Revolution."}],"key":"Sheltered instruction adapts access to grade-level text with scaffolds; it doesn't replace the text with easier content."},{"id":"5.1-10","skill":"5.1","type":"scenario","difficulty":1,"diag":0,"stem":"While observing a grade 3 Integrated ENL lesson, an ENL teacher notices that the content and language objectives are written on the board in the curriculum's technical wording but are never mentioned during the lesson. According to SIOP, what is the most effective recommendation?","options":["Remove the language objective from the board so students can concentrate on the content objective","Have students copy the objectives into their notebooks at the start of each lesson as handwriting practice","Restate both objectives in student-friendly language at the start, and revisit them at the end of the lesson","Post the objectives in each student's home language so that families can read them during the week"],"answer":2,"why":"SIOP's first two features call for content and language objectives that are clearly defined, displayed, and reviewed with students. Posting them isn't enough. The teacher should state them in student-friendly language at the start, refer to them during the lesson, and review them at the end so students can judge whether they met them.","traps":[{"code":"LOWER_RIGOR","note":"Dropping the language objective removes the explicit language target that sheltered instruction requires. SIOP calls for both content and language objectives in every lesson."},{"code":"PASSIVE","note":"Copying objectives is rote transcription. Students still don't understand what they're learning or whether they've learned it."},null,{"code":"PARTIAL","note":"Home-language versions can support understanding and family engagement, but they don't fix the core problem: the objectives are never explained or reviewed with students."}],"key":"SIOP objectives must be displayed AND reviewed with students in student-friendly language, at the start and the end."},{"id":"5.1-11","skill":"5.1","type":"scenario","difficulty":1,"diag":0,"stem":"A sheltered grade 6 math teacher speaks quickly, uses idioms such as 'ballpark figure,' and gives multistep directions orally. Several Emerging ELLs often start the task incorrectly. Which adjustment best addresses SIOP's Comprehensible Input component?","options":["Speak more loudly, and repeat the same directions word for word until all students begin working","Give the Emerging ELLs a shorter set of easier problems so that they can finish the task on time","Have the Emerging ELLs wait until bilingual classmates finish their work and can explain the directions","Slow down, replace idioms with plain terms, and model the steps while also posting them in writing"],"answer":3,"why":"SIOP's Comprehensible Input component includes speech appropriate to students' proficiency (slower rate, clear enunciation, simpler sentences, fewer idioms), a clear explanation of academic tasks, and a variety of techniques such as modeling, visuals, and demonstrations. Modeling the steps and posting written directions gives ELLs both oral and visual access to the same grade-level task.","traps":[{"code":"PARTIAL","note":"Repetition can help a little, but volume does nothing for comprehension. Repeating the same fast, idiomatic directions word for word keeps the language just as inaccessible."},{"code":"LOWER_RIGOR","note":"Fewer, easier problems lower the math expectations instead of making the directions comprehensible. The barrier is the teacher's language, not the math."},{"code":"PASSIVE","note":"Waiting for peers leaves ELLs idle and dependent, and it shifts the teacher's job of making input comprehensible onto classmates."},null],"key":"Comprehensible input: adjust your rate and wording, explain tasks clearly, and model with visuals. Speaking louder or assigning easier work doesn't count."},{"id":"5.1-12","skill":"5.1","type":"application","difficulty":2,"diag":0,"stem":"Ten minutes before the end of a grade 7 sheltered science lesson on ecosystems, the teacher says, 'Before you leave, let's go over today's key words and ideas.' Students sort the day's terms (producer, consumer, decomposer) into a concept map and use each term in a sentence about the food web they studied, and the teacher gives feedback on their sentences. In SIOP, this activity mainly reflects which component?","options":["Review & Assessment","Building Background","Lesson Preparation","Strategies"],"answer":0,"why":"SIOP's Review & Assessment component includes a comprehensive review of key vocabulary, a comprehensive review of key content concepts, regular feedback on student output, and assessment of comprehension throughout the lesson. Reviewing the day's terms in meaningful sentences about the food web, with teacher feedback, checks both vocabulary and content at the close of the lesson. Vocabulary appears in two SIOP components: it is emphasized in Building Background and reviewed in Review & Assessment.","traps":[null,{"code":"TERM","pair":"Building Background ↔ Review & Assessment","note":"Building Background includes 'key vocabulary emphasized' when words are introduced. A comprehensive end-of-lesson review of key terms and concepts, with feedback, is a Review & Assessment feature."},{"code":"TERM","pair":"Lesson Preparation ↔ Review & Assessment","note":"Lesson Preparation features are planning decisions (objectives, materials, adaptations, meaningful activities). This is an in-class review and check at the close of the lesson."},{"code":"TERM","pair":"Strategies ↔ Review & Assessment","note":"A concept map can serve as a learning strategy, but here its purpose and timing (reviewing the day's terms and ideas before students leave, with feedback) make it Review & Assessment."}],"key":"Vocabulary is emphasized in Building Background but comprehensively reviewed in Review & Assessment."},{"id":"5.1-13","skill":"5.1","type":"analysis","difficulty":2,"diag":0,"stimulus":"SIOP observation notes, grade 5 sheltered science (45-minute period):\n- Content and language objectives posted and reviewed at start ✓\n- Lesson linked to last week's lesson on magnets ✓\n- Teacher modeled with realia; spoke clearly ✓\n- 0:05–0:25 Teacher handed out materials table by table; most students waited with nothing to do\n- 0:25–0:40 Partners tested objects with magnets and discussed results using sentence frames ✓\n- 0:40–0:45 Exit ticket on both objectives ✓","stem":"Based on the notes, which SIOP component most needs improvement?","options":["Building Background","Lesson Delivery","Interaction","Review & Assessment"],"answer":1,"why":"SIOP's Lesson Delivery component asks whether delivery supports the content and language objectives, whether students are engaged about 90–100% of the period, and whether pacing suits students' abilities. Twenty of 45 minutes with most students waiting is a serious engagement and pacing problem, and ELLs can't afford to lose that time. Pre-staging materials or giving partners a task during distribution would fix it.","traps":[{"code":"LITERAL","note":"The notes show Building Background was done: the lesson was explicitly linked to last week's magnets lesson. The documented gap lies elsewhere."},null,{"code":"PARTIAL","note":"More interaction is rarely a bad idea, but the notes show partners already discussed results with sentence frames. The specific problem recorded is 20 minutes of idle waiting."},{"code":"LITERAL","note":"The lesson ended with an exit ticket on both objectives, so Review & Assessment is documented. The observation's key evidence points to engagement and pacing."}],"key":"SIOP Lesson Delivery = objectives supported, students engaged 90–100% of the period, and appropriate pacing."},{"id":"5.1-14","skill":"5.1","type":"knowledge","difficulty":2,"diag":0,"stem":"Which of the following is the strongest theoretical rationale for content-based instruction (CBI) with ELLs?","options":["Students need to master English grammar in isolation before they can benefit from content instruction.","Content teachers are no longer responsible for language development once an ELL is placed in their class.","Language is acquired effectively when it is used to learn meaningful, cognitively demanding content.","Krashen's Monitor hypothesis identifies conscious study of grammar rules as the main source of fluency."],"answer":2,"why":"CBI rests on the idea that language develops best as a vehicle for learning meaningful content. Students get rich comprehensible input, have real reasons for output and interaction, and meet the academic language (Cummins' CALP) they need for school. Integrating content and language also keeps ELLs from falling behind in grade-level content while they learn English.","traps":[{"code":"ISOLATED","note":"Grammar-first-in-isolation is the sequential view CBI rejects. Language and content are learned together, and ELLs can't afford to postpone grade-level content."},{"code":"NYS_POLICY","note":"This contradicts NYS's Blueprint for ELL/MLL Success, whose first principle is that every teacher is a teacher of ELLs. Content teachers share responsibility for language development."},null,{"code":"MISAPPLIED_THEORY","note":"Krashen's Monitor hypothesis says the opposite: consciously learned rules serve only as an editor (monitor), while fluency comes from acquisition through comprehensible input."}],"key":"CBI rationale: language grows when it is used to learn meaningful, grade-level content, so ELLs shouldn't wait for English before learning content."},{"id":"5.2-01","skill":"5.2","type":"application","difficulty":2,"diag":1,"stem":"In a grade 6 Integrated ENL science class, the co-teachers want four newly arrived Entering ELLs to learn key vocabulary and handle the lab materials before tomorrow's whole-class investigation. For 15 minutes, the ENL teacher works with this small group while the science teacher reviews homework with the rest of the class. Which co-teaching model are they using?","options":["Parallel teaching","Station teaching","One teach, one assist","Alternative teaching"],"answer":3,"why":"In alternative teaching, one teacher works with the large group while the other takes a small group for a specific purpose: pre-teaching, re-teaching, enrichment, or assessment. Pre-teaching vocabulary and materials to Entering ELLs before a whole-class lab is a classic use. To avoid stigma, co-teachers should vary which students join the small group and why.","traps":[{"code":"TERM","pair":"parallel ↔ alternative","note":"Parallel teaching splits the class into two roughly equal, heterogeneous groups that learn the same content. Here one small group gets specialized pre-teaching while the large group does something else."},{"code":"TERM","pair":"station ↔ alternative","note":"In station teaching, content is divided across stations and all students rotate. Here only a selected small group works with the ENL teacher, and no one rotates."},{"code":"TERM","pair":"one teach, one assist ↔ alternative","note":"In one teach, one assist, one teacher leads the whole class while the other circulates. Here the teachers are working with two separate groups."},null],"key":"Alternative teaching: one teacher takes a small group for a specific purpose (pre-teach, re-teach, enrich) while the other leads the large group."},{"id":"5.2-02","skill":"5.2","type":"scenario","difficulty":2,"diag":0,"stem":"Co-teachers in a grade 8 Integrated ENL social studies class notice that in whole-class discussions of primary sources, only a few students speak and most ELLs never contribute. They want every student to have more chances to talk about the same document during the same period. Which approach best fits this goal?","options":["Parallel teaching, with each teacher leading the same discussion with half of the class","One teach, one observe, with the ENL teacher tallying which students speak during the discussion","Team teaching, with both teachers taking turns leading the whole-class discussion from the front","Alternative teaching, with the ENL teacher taking the ELLs to a separate table for the whole unit"],"answer":0,"why":"Parallel teaching divides the class into two heterogeneous groups, and each teacher teaches the same content at the same time. Halving the group size roughly doubles each student's chances to speak, which is exactly what ELLs need for oral academic language development. Mixed groups keep ELLs with English-proficient peers who model the language.","traps":[null,{"code":"PARTIAL","note":"Tracking participation produces useful data, but it doesn't give any student more chances to speak. The class is still one large discussion group."},{"code":"TERM","pair":"team ↔ parallel","note":"Team teaching keeps the whole class together with both teachers co-leading. It can model discussion, but it doesn't reduce the number of students competing for each turn."},{"code":"EXCLUSION","note":"Pulling the ELLs to a separate table for a whole unit segregates them from their peers and from the grade-level discussion, the opposite of integrated instruction."}],"key":"Parallel teaching: two heterogeneous halves, same content, same time, so every student gets more chances to talk."},{"id":"5.2-03","skill":"5.2","type":"application","difficulty":1,"diag":0,"stem":"Co-teachers in a grade 4 Integrated ENL math class want specific data on how their ELLs use the language of mathematical explanation. They decide that the classroom teacher will lead the lesson while the ENL teacher records, on a checklist, which students use target phrases such as 'I know ___ because ___.' Which co-teaching model have they chosen?","options":["One teach, one assist","One teach, one observe","Team teaching","Station teaching"],"answer":1,"why":"In one teach, one observe, one teacher leads instruction while the other systematically gathers data on specific students or skills, here the ELLs' use of explanation language. The observation is purposeful, with a clear focus and a tool, and the data should drive co-planning, such as which students need a mini-lesson on 'because' clauses.","traps":[{"code":"TERM","pair":"one teach, one assist ↔ one teach, one observe","note":"In one teach, one assist, the second teacher circulates and helps individual students. Here the ENL teacher deliberately collects data instead of helping."},null,{"code":"TERM","pair":"team ↔ one teach, one observe","note":"In team teaching, both teachers share instruction of the whole class. Here only one teacher instructs while the other observes."},{"code":"TERM","pair":"station ↔ one teach, one observe","note":"Station teaching divides the content across stations that groups rotate through. This lesson is taught to the whole group by one teacher."}],"key":"One teach, one observe: one teacher leads while the other collects focused data to guide planning."},{"id":"5.2-04","skill":"5.2","type":"application","difficulty":1,"diag":0,"stimulus":"Co-teaching plan, grade 5 Integrated ENL science (states of matter):\nGroups rotate every 12 minutes.\n- Table 1 (science teacher): melting-ice investigation\n- Table 2 (ENL teacher): describing changes with 'When ___ heats up, it ___.'\n- Table 3 (independent): sorting picture cards into solid, liquid, and gas","stem":"Which co-teaching model does this plan use?","options":["Parallel teaching","Alternative teaching","Station teaching","Team teaching"],"answer":2,"why":"In station teaching, the content is divided into parts. Each teacher leads one station, often alongside an independent station, and student groups rotate so every student gets every part. It lowers the student–teacher ratio and lets the ENL teacher lead a station on the language of the content, as Table 2 does.","traps":[{"code":"TERM","pair":"parallel ↔ station","note":"In parallel teaching, two halves of the class learn the same content at the same time. Here each table has different content and groups rotate."},{"code":"TERM","pair":"alternative ↔ station","note":"Alternative teaching pulls one small group for a specific purpose. Here every student rotates through all three tables."},null,{"code":"TERM","pair":"team ↔ station","note":"Team teaching keeps the class together while both teachers lead jointly. This plan splits students into rotating groups."}],"key":"Station teaching: the content is divided among stations, groups rotate, and each teacher leads a station."},{"id":"5.2-05","skill":"5.2","type":"scenario","difficulty":2,"diag":0,"stem":"Co-teachers in a grade 10 Integrated ENL global history class want to show students what an academic disagreement sounds like before students debate whether a ruler's policies helped or harmed peasants. Which approach makes the best use of team teaching for this goal?","options":["The ENL teacher prepares a handout of debate phrases while the history teacher explains the debate rules","The history teacher lectures on the policies while the ENL teacher circulates to help ELLs follow along","Each teacher takes half of the class, reads the same primary source aloud, and answers students' questions","Both teachers stage a short debate for the class, pointing out phrases such as 'I see your point, but…'"],"answer":3,"why":"In team teaching, both teachers deliver instruction to the whole class together, sharing the lead. A short debate between the two teachers models academic discourse (taking turns, disagreeing politely, backing up claims) and lets them highlight the exact language students will use. Team teaching shines when two voices are part of the content: debates, role plays, or think-aloud dialogues.","traps":[{"code":"PARTIAL","note":"A phrase handout is a helpful scaffold, but this splits the work instead of co-delivering instruction, and students never hear a live model of academic disagreement."},{"code":"TERM","pair":"one teach, one assist ↔ team teaching","note":"Lecturing while the other teacher circulates is one teach, one assist. A lecture also doesn't model what debate language sounds like."},{"code":"TERM","pair":"parallel ↔ team teaching","note":"Splitting the class in half is parallel teaching, and a read-aloud with questions doesn't model debate discourse."},null],"key":"Team teaching: both teachers co-lead the whole class, ideal for modeling dialogue, debate, and academic discourse."},{"id":"5.2-06","skill":"5.2","type":"scenario","difficulty":2,"diag":0,"stimulus":"ENL teacher's reflection, November:\n'In our grade 7 co-taught math class, Mr. Okafor plans and teaches every lesson. I find out the topic when I walk in, and I spend the period walking around helping ELLs who look lost. Their writing samples show they need explicit work on explaining their reasoning, but I never get to teach it.'","stem":"Which next step would best improve this co-teaching partnership?","options":["Continue the current arrangement, since the ELLs are receiving individual help from a certified ESOL teacher","Set up regular co-planning time to add language objectives and rotate models so the ENL teacher also leads","Ask the principal to schedule pull-out sessions during math so the ENL teacher can work with the ELLs alone","Have the ENL teacher sit beside the ELLs during each lesson and translate the math teacher's explanations"],"answer":1,"why":"One teach, one assist is easy to slip into but should be used sparingly. When it becomes the default, the ENL teacher functions as an aide, language instruction goes unplanned, and parity is lost. Regular co-planning lets both teachers set content and language objectives (here, language for explaining reasoning) and choose models such as station, parallel, alternative, or team teaching in which the ENL teacher leads instruction.","traps":[{"code":"PARTIAL","note":"Individual help has some value, but daily one teach, one assist reduces the ENL teacher to an aide, provides no planned language instruction, and ignores what the writing samples show students need."},null,{"code":"EXCLUSION","note":"Pulling ELLs out during math removes them from grade-level math instruction and from the co-taught setting that Integrated ENL is meant to provide."},{"code":"PARTIAL","note":"Home-language support can help, but constant translation keeps the ENL teacher in an assisting role and never teaches the English language of mathematical reasoning that students need."}],"key":"Overusing one teach, one assist turns the ENL teacher into an aide; co-planning and rotating models restore shared instruction."},{"id":"5.2-07","skill":"5.2","type":"analysis","difficulty":3,"diag":0,"stimulus":"Co-teaching log, grade 3 Integrated ENL class, weeks 1–6:\n- Every day, 20 minutes: the ENL teacher works at the back table with the same six ELLs (all Entering or Emerging), re-teaching the day's lesson.\n- The classroom teacher continues with the rest of the class.\n- Week 6 note: Two of the six students now call themselves 'the slow table.'","stem":"What is the most important change the co-teachers should make?","options":["Vary the purpose and membership of the small group, including non-ELLs and enrichment, based on ongoing data","Move the small group to a separate room so that the other students do not notice who is being retaught","Stop small-group work and keep the ELLs in whole-class instruction so they hear more grade-level English","Keep the same six students together, since their shared proficiency level makes a fixed group most efficient"],"answer":0,"why":"Alternative teaching is powerful for pre-teaching, re-teaching, and enrichment. But when the same students are always pulled, it becomes de facto tracking and stigmatizes them, as the students' comment shows. Co-teachers should form flexible groups from ongoing data, vary the purpose (pre-teaching and enrichment, not just remediation), include non-ELLs, and take turns leading the small group.","traps":[null,{"code":"EXCLUSION","note":"A separate room makes the separation more visible and removes the ELLs even further from the integrated class, which deepens the stigma rather than ending it."},{"code":"ONE_SIZE","note":"Ending small-group work gives every student identical whole-class instruction regardless of proficiency. Targeted small-group support is valuable; the problem is the fixed membership."},{"code":"PARTIAL","note":"Grouping by need can be appropriate for a specific purpose, but a fixed, permanent group of the same ELLs is what produced the 'slow table' label. Groups should change with the data."}],"key":"Don't always pull the same ELLs in alternative teaching; use flexible, data-based groups with varied purposes."},{"id":"5.2-08","skill":"5.2","type":"scenario","difficulty":2,"diag":2,"stem":"During weekly co-planning for a grade 8 Integrated ENL science unit on energy transfer, the science teacher has drafted the content objectives and the lab. Which contribution from the ENL teacher would add the most to the plan?","options":["Offering to grade the ELLs' lab reports separately using a simpler rubric that focuses on effort","Offering to teach the ELLs a simplified version of the energy unit at a side table during class","Offering to find translated versions of the chapter for the ELLs to read in place of the English text","Analyzing the unit's language demands, then drafting language objectives and level-matched scaffolds"],"answer":3,"why":"The ENL teacher's distinct expertise in co-planning is language. That means analyzing the unit's linguistic demands (vocabulary, structures such as passive voice and cause–effect, and discourse such as lab-report writing), writing language objectives, and designing scaffolds matched to each student's proficiency level. Combined with the content teacher's objectives, this lets both teachers share responsibility for content and language.","traps":[{"code":"ASSESS_INVALID","note":"An effort-only rubric measures neither content nor language learning, and grading ELLs separately undercuts shared responsibility and lowers expectations."},{"code":"LOWER_RIGOR","note":"A simplified side-table unit waters down grade-level content and creates a separate track inside the co-taught class."},{"code":"PARTIAL","note":"Home-language texts can be a valuable scaffold alongside English, but replacing the English text doesn't build the academic English of the unit, and it is narrower than planning for the lesson's language demands."},null],"key":"In co-planning, the ENL teacher analyzes language demands and adds language objectives and level-matched scaffolds to the content plan."},{"id":"5.2-09","skill":"5.2","type":"knowledge","difficulty":2,"diag":0,"stem":"Under CR Part 154, which of the following describes an Integrated ENL class?","options":["A class in which an ESOL-certified teacher provides English language development instruction to ELLs","A content class taught by a content-certified teacher, with an ESOL teaching assistant for the ELLs","A content class co-taught by a content-certified and an ESOL-certified teacher, or by one dually certified teacher","A class in which ELLs learn content in their home language and in English, with English increasing over time"],"answer":2,"why":"In NYS, Integrated ENL delivers core content instruction (such as ELA, math, science, or social studies) together with English language development. It is taught by a teacher dually certified in the content area and ESOL, or co-taught by a certified content teacher and a certified ESOL teacher. Stand-alone ENL is the separate English language development class taught by an ESOL teacher.","traps":[{"code":"TERM","pair":"Stand-alone ENL ↔ Integrated ENL","note":"An ESOL teacher providing
